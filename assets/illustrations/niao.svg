<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgNiao" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowNiao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgNiao)"/>
  <!-- Cute Blue Songbird (小鸟) -->
  <g filter="url(#shadowNiao)">
    <!-- Tree Branch -->
    <path d="M 60 380 Q 250 360 440 370" stroke="#78350f" stroke-width="12" fill="none" stroke-linecap="round"/>
    <ellipse cx="380" cy="355" rx="14" ry="8" fill="#22c55e" transform="rotate(-20, 380, 355)"/>
    <!-- Bird Body -->
    <ellipse cx="250" cy="270" rx="90" ry="75" fill="#38bdf8"/>
    <!-- Bird Belly -->
    <ellipse cx="270" cy="290" rx="60" ry="45" fill="#e0f2fe"/>
    <!-- Bird Wing -->
    <path d="M 210 260 C 160 270 140 340 220 320 C 260 310 250 260 210 260 Z" fill="#0284c7"/>
    <!-- Bird Head -->
    <circle cx="310" cy="210" r="50" fill="#38bdf8"/>
    <!-- Eye -->
    <circle cx="325" cy="200" r="7" fill="#0f172a"/>
    <circle cx="323" cy="198" r="2.5" fill="#ffffff"/>
    <!-- Rosy Cheek -->
    <circle cx="310" cy="220" r="8" fill="#f43f5e" opacity="0.5"/>
    <!-- Orange Beak -->
    <polygon points="355,205 390,215 355,225" fill="#f97316"/>
    <!-- Tail Feathers -->
    <path d="M 170 290 L 110 320 L 130 280 L 105 250 L 170 270 Z" fill="#0284c7"/>
    <!-- Feet gripping branch -->
    <line x1="240" y1="340" x2="240" y2="370" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <line x1="270" y1="340" x2="270" y2="370" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>