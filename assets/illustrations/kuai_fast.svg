<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKuai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadowKuai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgKuai)"/>

  <!-- High-Speed Bullet Train Speeding Forward (高铁列车飞快疾驰) -->
  
  <!-- Dynamic Speed Wind Lines behind train -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="170" x2="160" y2="170"/>
    <line x1="50" y1="210" x2="180" y2="210"/>
    <line x1="20" y1="250" x2="150" y2="250"/>
    <line x1="60" y1="290" x2="200" y2="290"/>
    <line x1="40" y1="330" x2="170" y2="330"/>
  </g>
  <g stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="145" x2="190" y2="145"/>
    <line x1="100" y1="365" x2="210" y2="365"/>
  </g>

  <!-- Smooth High Speed Train Track (平稳钢轨) -->
  <path d="M 40 400 L 460 370" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <path d="M 40 425 L 460 395" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <!-- Track ties -->
  <g stroke="#94a3b8" stroke-width="6">
    <line x1="100" y1="395" x2="100" y2="422"/>
    <line x1="180" y1="390" x2="180" y2="416"/>
    <line x1="260" y1="385" x2="260" y2="410"/>
    <line x1="340" y1="379" x2="340" y2="405"/>
    <line x1="420" y1="373" x2="420" y2="399"/>
  </g>

  <!-- Streamlined Bullet Train Nose & Carriage -->
  <g filter="url(#shadowKuai)">
    <!-- Main Train Body (Pure White with Aerodynamic Curve) -->
    <path d="M 140 220 L 320 200 C 410 200 460 260 465 340 L 460 355 L 140 375 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Red Champion / Fuxing Speed Stripe (中国红飘带) -->
    <path d="M 140 295 L 340 280 C 410 280 445 320 455 350 L 140 355 Z" fill="#ef4444"/>
    <!-- Gold Trim Stripe -->
    <path d="M 140 288 L 345 273 C 405 273 440 305 450 335" stroke="#facc15" stroke-width="6" fill="none"/>

    <!-- Aerodynamic Dark Cockpit Windshield -->
    <path d="M 370 230 C 420 235 448 275 452 300 L 390 280 Z" fill="#0f172a"/>
    <!-- Glass Highlight -->
    <path d="M 385 242 Q 415 245 435 275" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Passenger Windows in carriage -->
    <g fill="#1e293b" rx="6">
      <rect x="160" y="240" width="45" height="30" rx="6"/>
      <rect x="220" y="235" width="45" height="30" rx="6"/>
      <rect x="280" y="230" width="45" height="30" rx="6"/>
    </g>

    <!-- Train Headlight beam beaming forward -->
    <polygon points="465,340 500,320 500,360" fill="#fef08a" opacity="0.6"/>
    <circle cx="462" cy="340" r="7" fill="#facc15"/>
  </g>

  <!-- Speed Lightning Bolt Symbol (⚡ 飞快) -->
  <g transform="translate(240, 80)">
    <polygon points="20,-20 -5,12 12,12 -15,45 28,5 8,5" fill="#facc15" stroke="#eab308" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>