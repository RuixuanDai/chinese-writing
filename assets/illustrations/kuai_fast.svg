<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKuai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowKuai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgKuai)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#fde68a" opacity="0.6"/>
  <!-- Speed Wind Lines Behind -->
  <line x1="60" y1="200" x2="160" y2="200" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="240" x2="180" y2="240" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <line x1="70" y1="280" x2="150" y2="280" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <!-- Fast Cheetah Sprinting Forward -->
  <g filter="url(#shadowKuai)">
    <!-- Tail -->
    <path d="M 120 240 Q 80 200 100 160" stroke="#eab308" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Streamlined Body -->
    <ellipse cx="250" cy="240" rx="110" ry="45" fill="#facc15"/>
    <!-- Cheetah Spots -->
    <circle cx="200" cy="230" r="7" fill="#18181b"/>
    <circle cx="230" cy="250" r="8" fill="#18181b"/>
    <circle cx="270" cy="235" r="7" fill="#18181b"/>
    <circle cx="295" cy="250" r="6" fill="#18181b"/>
    <!-- Head & Ears -->
    <ellipse cx="360" cy="210" rx="42" ry="32" fill="#facc15"/>
    <circle cx="340" cy="180" r="12" fill="#ca8a04"/>
    <circle cx="380" cy="205" r="5" fill="#18181b"/>
    <!-- Extended Sprinting Legs -->
    <path d="M 330 260 L 410 320 L 440 315" stroke="#facc15" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 170 260 L 110 330 L 80 325" stroke="#facc15" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Lightning Bolt Icon -->
    <polygon points="260,110 240,150 265,150 245,190 285,140 260,140" fill="#f97316"/>
  </g>
</svg>