    <!-- Flagpole -->
    <rect x="120" y="70" width="14" height="380" rx="4" fill="#94a3b8"/>
    <circle cx="127" cy="70" r="14" fill="#facc15"/>
    <!-- Waving Red Flag Fabric -->
    <path d="M 134 90 C 230 60 290 140 410 90 L 410 270 C 290 320 230 240 134 270 Z" fill="#ef4444"/>
