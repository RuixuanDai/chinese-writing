<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYongBr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowYongBr" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9a3412" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYongBr)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fed7aa" opacity="0.6"/>
  <!-- Brave Little Lion Cub standing proudly -->
  <g filter="url(#shadowYongBr)">
    <!-- Red Hero Cape flowing behind -->
    <path d="M 200 240 Q 130 260 110 370 Q 180 340 230 330 Z" fill="#ef4444"/>
    <!-- Lion Mane -->
    <circle cx="260" cy="220" r="95" fill="#ea580c"/>
    <!-- Lion Face -->
    <circle cx="260" cy="220" r="65" fill="#fcd34d"/>
    <!-- Ears -->
    <circle cx="205" cy="150" r="22" fill="#ea580c"/>
    <circle cx="205" cy="150" r="12" fill="#fde68a"/>
    <circle cx="315" cy="150" r="22" fill="#ea580c"/>
    <circle cx="315" cy="150" r="12" fill="#fde68a"/>
    <!-- Brave Big Eyes -->
    <circle cx="235" cy="205" r="12" fill="#18181b"/>
    <circle cx="285" cy="205" r="12" fill="#18181b"/>
    <circle cx="238" cy="200" r="4" fill="#ffffff"/>
    <circle cx="288" cy="200" r="4" fill="#ffffff"/>
    <!-- Snout & Nose -->
    <ellipse cx="260" cy="235" rx="20" ry="14" fill="#ffffff"/>
    <polygon points="260,230 252,222 268,222" fill="#78350f"/>
    <!-- Body & Paws -->
    <rect x="210" y="280" width="100" height="110" rx="24" fill="#f59e0b"/>
    <circle cx="215" cy="385" r="24" fill="#fcd34d"/>
    <circle cx="305" cy="385" r="24" fill="#fcd34d"/>
  </g>
</svg>