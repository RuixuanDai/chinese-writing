<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYouRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowYouRight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYouRight)"/>
  <g filter="url(#shadowYouRight)">
    <!-- Big Dynamic Right Arrow -->
    <polygon points="300,120 430,250 300,380 300,310 90,310 90,190 300,190" fill="#3b82f6" stroke="#1d4ed8" stroke-width="8"/>
    <!-- Inner Arrow Highlight -->
    <polygon points="310,150 410,250 310,350 310,300 110,300 110,200 310,200" fill="#60a5fa"/>
    <text x="220" y="265" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="55" font-weight="bold" fill="#ffffff" text-anchor="middle">右</text>
  </g>
</svg>