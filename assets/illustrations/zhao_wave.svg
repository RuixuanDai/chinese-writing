<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhao" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowZhao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9f1239" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhao)"/>
  <ellipse cx="250" cy="450" rx="160" ry="20" fill="#fecdd3" opacity="0.6"/>

  <!-- Cheerful child waving hand enthusiastically (招手打招呼) -->
  <g filter="url(#shadowZhao)">
    <!-- Body & Shirt -->
    <path d="M 140 450 C 140 350 300 350 300 450 Z" fill="#ec4899"/>
    <!-- Collar -->
    <polygon points="190,370 220,395 250,370 230,360 210,360" fill="#ffffff"/>

    <!-- Left resting arm -->
    <path d="M 155 370 Q 130 410 135 430" stroke="#fed7aa" stroke-width="26" stroke-linecap="round" fill="none"/>

    <!-- Head & Neck -->
    <rect x="205" y="300" width="30" height="60" fill="#fed7aa"/>
    <circle cx="220" cy="240" r="90" fill="#fed7aa"/>

    <!-- Hair with cute hairclips -->
    <path d="M 130 230 C 120 130 320 130 310 230 C 290 170 150 170 130 230 Z" fill="#3b1f13"/>
    <path d="M 145 190 Q 185 210 220 185 Q 255 210 295 190" stroke="#3b1f13" stroke-width="8" fill="none"/>
    <polygon points="140,165 155,160 150,175" fill="#f59e0b"/>
    <polygon points="295,165 280,160 285,175" fill="#f59e0b"/>

    <!-- Big smiling eyes -->
    <ellipse cx="185" cy="225" rx="9" ry="12" fill="#1e293b"/>
    <ellipse cx="255" cy="225" rx="9" ry="12" fill="#1e293b"/>
    <circle cx="182" cy="221" r="3.5" fill="#ffffff"/>
    <circle cx="252" cy="221" r="3.5" fill="#ffffff"/>

    <!-- Rosy cheeks -->
    <circle cx="165" cy="250" r="14" fill="#fda4af" opacity="0.8"/>
    <circle cx="275" cy="250" r="14" fill="#fda4af" opacity="0.8"/>

    <!-- Happy curved smile -->
    <path d="M 195 255 Q 220 285 245 255" stroke="#be123c" stroke-width="5" stroke-linecap="round" fill="#fda4af"/>

    <!-- Right Arm raised high waving (招手) -->
    <path d="M 285 360 C 330 320 370 240 375 160" stroke="#fed7aa" stroke-width="32" stroke-linecap="round" fill="none"/>
    
    <!-- Open Waving Palm & Fingers -->
    <g transform="translate(375, 140) rotate(15)">
      <!-- Palm -->
      <ellipse cx="0" cy="0" rx="26" ry="24" fill="#fed7aa"/>
      <!-- Thumb -->
      <ellipse cx="-20" cy="2" rx="10" ry="15" fill="#fed7aa" transform="rotate(-35, -20, 2)"/>
      <!-- 4 fingers -->
      <rect x="-18" y="-40" width="10" height="26" rx="5" fill="#fed7aa"/>
      <rect x="-6" y="-45" width="10" height="28" rx="5" fill="#fed7aa"/>
      <rect x="6" y="-42" width="10" height="26" rx="5" fill="#fed7aa"/>
      <rect x="18" y="-35" width="9" height="22" rx="4.5" fill="#fed7aa"/>
    </g>

    <!-- Waving motion vibration curves -->
    <path d="M 430 90 Q 455 125 435 160" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 445 105 Q 465 130 450 155" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Little greeting heart -->
    <path d="M 390 60 C 390 50 380 50 380 60 C 380 70 390 77 390 85 C 390 77 400 70 400 60 C 400 50 390 50 390 60 Z" fill="#f43f5e"/>
  </g>
</svg>