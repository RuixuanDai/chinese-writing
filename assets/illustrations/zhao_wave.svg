<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhao" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowZhao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9f1239" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhao)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#fecdd3" opacity="0.6"/>
  <!-- Lucky Cat Waving Paw (招手) -->
  <g filter="url(#shadowZhao)">
    <!-- Cat Ears -->
    <polygon points="170,170 140,90 220,130" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <polygon points="160,160 145,105 205,135" fill="#f43f5e"/>
    <polygon points="290,170 320,90 240,130" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <polygon points="300,160 315,105 255,135" fill="#f43f5e"/>
    <!-- Cat Head & Body -->
    <circle cx="230" cy="220" r="95" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Happy Closed Eyes -->
    <path d="M 180 215 Q 195 225 210 215" stroke="#18181b" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 240 215 Q 255 225 270 215" stroke="#18181b" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Pink Cheeks -->
    <circle cx="175" cy="235" r="14" fill="#fda4af"/>
    <circle cx="275" cy="235" r="14" fill="#fda4af"/>
    <!-- Red Collar & Golden Bell -->
    <rect x="160" y="300" width="140" height="22" rx="10" fill="#ef4444"/>
    <circle cx="230" cy="325" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <!-- Waving Right Paw Raised Up High (招手动作) -->
    <rect x="300" y="160" width="55" height="120" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="328" cy="160" r="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <ellipse cx="328" cy="160" rx="15" ry="12" fill="#fda4af"/>
    <!-- Motion lines of waving -->
    <path d="M 370 130 Q 385 155 370 180" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>