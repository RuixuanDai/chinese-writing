<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_mai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_mai)"/>

  <line x1="18" y1="168" x2="182" y2="168" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <!-- Small blue puddle being stepped over + red stride arc -->
  <ellipse cx="100" cy="168" rx="24" ry="6" fill="#38bdf8"/>
  <path d="M68 156 Q100 126 132 156" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,4"/>
  <!-- Back arm -->
  <line x1="90" y1="88" x2="58" y2="108" stroke="#ea580c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="55" cy="110" r="6" fill="#fed7aa"/>
  <!-- Head -->
  <circle cx="100" cy="52" r="20" fill="#fed7aa"/>
  <path d="M80 48 Q100 26 120 48" fill="#451a03"/>
  <circle cx="94" cy="52" r="2.3" fill="#1e293b"/><circle cx="108" cy="52" r="2.3" fill="#1e293b"/>
  <path d="M95 60 Q101 65 107 60" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Wide striding legs -->
  <line x1="92" y1="116" x2="58" y2="160" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <line x1="108" y1="116" x2="142" y2="156" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="54" cy="162" rx="9" ry="5" fill="#ef4444"/>
  <ellipse cx="146" cy="158" rx="9" ry="5" fill="#ef4444"/>
  <!-- Torso & front arm -->
  <rect x="82" y="74" width="36" height="44" rx="12" fill="#f97316"/>
  <line x1="110" y1="88" x2="142" y2="104" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
  <circle cx="145" cy="106" r="6" fill="#fed7aa"/>

</svg>
