<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowMai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgMai)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#bbf7d0" opacity="0.6"/>
  <!-- Track with Distance Marks -->
  <line x1="80" y1="410" x2="420" y2="410" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="410" r="8" fill="#16a34a"/>
  <circle cx="340" cy="410" r="8" fill="#16a34a"/>
  <!-- Giant Stride Forward (迈大步) -->
  <g filter="url(#shadowMai)">
    <!-- Pelvis / Waist -->
    <circle cx="250" cy="230" r="30" fill="#2563eb"/>
    <!-- Left Leg Striding Wide Back -->
    <path d="M 235 240 L 150 370 L 120 380" stroke="#1d4ed8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Leg Striding Wide Forward -->
    <path d="M 265 240 L 350 360 L 380 365" stroke="#1d4ed8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Running Shoes -->
    <rect x="105" y="375" width="45" height="22" rx="8" fill="#ef4444"/>
    <rect x="355" y="360" width="50" height="22" rx="8" fill="#ef4444"/>
    <!-- Forward Energy Arrow -->
    <polygon points="390,260 440,260 440,240 480,270 440,300 440,280 390,280" fill="#f59e0b"/>
  </g>
</svg>