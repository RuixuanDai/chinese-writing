<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_cha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_cha)"/>

  <!-- Fragrant steam curls -->
  <path d="M84 68 Q78 52 86 38" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M108 64 Q102 48 110 34" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <!-- Saucer directly supporting the teacup (no floating gap!) -->
  <ellipse cx="96" cy="152" rx="58" ry="14" fill="#92400e" stroke="#78350f" stroke-width="2.5"/>
  <ellipse cx="96" cy="150" rx="42" ry="8" fill="#b45309"/>
  <!-- Cup handle -->
  <path d="M136 102 C158 102 158 134 134 134" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Porcelain teacup body resting on saucer at y=150 -->
  <path d="M50 92 L142 92 C140 132 122 150 96 150 C70 150 52 132 50 92 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Green tea liquid inside top rim -->
  <ellipse cx="96" cy="92" rx="46" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="96" cy="94" rx="40" ry="9" fill="#84cc16"/>
  <!-- Fresh green tea leaves beside saucer -->
  <path d="M142 158 Q164 142 174 160 Q154 172 142 158 Z" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <path d="M136 162 Q148 144 158 154 Q148 168 136 162 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>

</svg>
