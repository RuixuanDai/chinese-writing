<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCha" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowCha" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgCha)"/>
  <ellipse cx="250" cy="430" rx="180" ry="35" fill="#bbf7d0" opacity="0.6"/>
  <!-- Delicate Steam -->
  <path d="M 230 160 Q 210 120 230 90 M 270 160 Q 290 120 270 90" stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  <g filter="url(#shadowCha)">
    <!-- Wooden Saucer -->
    <ellipse cx="250" cy="380" rx="150" ry="35" fill="#92400e"/>
    <ellipse cx="250" cy="375" rx="140" ry="30" fill="#b45309"/>
    <!-- Ceramic Teacup -->
    <path d="M 150 250 C 150 370 350 370 350 250 Z" fill="#f8fafc"/>
    <ellipse cx="250" cy="250" rx="100" ry="35" fill="#e2e8f0"/>
    <!-- Green Tea Liquid -->
    <ellipse cx="250" cy="252" rx="90" ry="30" fill="#84cc16"/>
    <!-- Floating Tea Leaf (茶尖) -->
    <path d="M 240 245 C 230 255 260 260 250 245 Z" fill="#3f6212"/>
    <!-- Teacup Handle -->
    <path d="M 330 265 Q 390 280 340 330" stroke="#f8fafc" stroke-width="18" fill="none"/>
  </g>
</svg>