<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowJia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJia)"/>
  <ellipse cx="250" cy="440" rx="190" ry="35" fill="#86efac" opacity="0.7"/>
  <g filter="url(#shadowJia)">
    <!-- Chimney & Smoke Puff -->
    <rect x="330" y="140" width="35" height="70" rx="4" fill="#991b1b"/>
    <circle cx="350" cy="110" r="14" fill="#ffffff" opacity="0.7"/>
    <circle cx="365" cy="85" r="18" fill="#ffffff" opacity="0.5"/>
    <!-- House Wall Box -->
    <rect x="130" y="240" width="240" height="170" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="6"/>
    <!-- Triangular Roof with Tiles -->
    <polygon points="250,110 90,250 410,250" fill="#dc2626"/>
    <polygon points="250,130 120,240 380,240" fill="#ef4444"/>
    <!-- Round Attic Window -->
    <circle cx="250" cy="190" r="22" fill="#fef08a" stroke="#ffffff" stroke-width="4"/>
    <line x1="250" y1="168" x2="250" y2="212" stroke="#ffffff" stroke-width="3"/>
    <line x1="228" y1="190" x2="272" y2="190" stroke="#ffffff" stroke-width="3"/>
    <!-- Front Door with Knob -->
    <rect x="220" y="290" width="60" height="120" rx="6" fill="#b45309"/>
    <circle cx="270" cy="355" r="6" fill="#fef08a"/>
    <!-- Cozy Warm Glowing Windows -->
    <rect x="150" y="280" width="50" height="55" rx="6" fill="#fef08a" stroke="#b45309" stroke-width="4"/>
    <line x1="175" y1="280" x2="175" y2="335" stroke="#b45309" stroke-width="3"/>
    <line x1="150" y1="305" x2="200" y2="305" stroke="#b45309" stroke-width="3"/>
    <rect x="300" y="280" width="50" height="55" rx="6" fill="#fef08a" stroke="#b45309" stroke-width="4"/>
    <line x1="325" y1="280" x2="325" y2="335" stroke="#b45309" stroke-width="3"/>
    <line x1="300" y1="305" x2="350" y2="305" stroke="#b45309" stroke-width="3"/>
  </g>
</svg>