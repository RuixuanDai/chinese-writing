<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSheep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowSheep" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#16a34a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgSheep)"/>
  <!-- Cute Fluffy Sheep (小绵羊) -->
  <g filter="url(#shadowSheep)">
    <!-- 4 Little Legs -->
    <rect x="180" y="320" width="16" height="70" rx="8" fill="#475569"/>
    <rect x="220" y="325" width="16" height="65" rx="8" fill="#64748b"/>
    <rect x="270" y="320" width="16" height="70" rx="8" fill="#475569"/>
    <rect x="310" y="325" width="16" height="65" rx="8" fill="#64748b"/>
    <!-- Cloud-like Fluffy White Wool Body -->
    <circle cx="210" cy="260" r="45" fill="#ffffff"/>
    <circle cx="260" cy="240" r="50" fill="#ffffff"/>
    <circle cx="305" cy="260" r="45" fill="#ffffff"/>
    <circle cx="240" cy="290" r="48" fill="#ffffff"/>
    <circle cx="285" cy="290" r="48" fill="#ffffff"/>
    <!-- Sheep Head -->
    <ellipse cx="160" cy="225" rx="42" ry="50" fill="#f8fafc"/>
    <!-- Cute Ears -->
    <ellipse cx="120" cy="195" rx="20" ry="12" fill="#fda4af" transform="rotate(-30, 120, 195)"/>
    <ellipse cx="195" cy="195" rx="20" ry="12" fill="#fda4af" transform="rotate(30, 195, 195)"/>
    <!-- Eyes -->
    <circle cx="145" cy="215" r="5" fill="#0f172a"/>
    <circle cx="175" cy="215" r="5" fill="#0f172a"/>
    <circle cx="144" cy="213" r="1.8" fill="#ffffff"/>
    <circle cx="174" cy="213" r="1.8" fill="#ffffff"/>
    <!-- Nose & Smile -->
    <path d="M 155 240 Q 160 245 165 240" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>