<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowTi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9f1239" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgTi)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fecdd3" opacity="0.6"/>
  <g filter="url(#shadowTi)">
    <!-- Exam Paper -->
    <rect x="110" y="80" width="280" height="340" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Question Lines -->
    <line x1="150" y1="180" x2="350" y2="180" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="220" x2="350" y2="220" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="260" x2="320" y2="260" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="300" x2="350" y2="300" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="340" x2="280" y2="340" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- Bright Red 100 Score Stamp with double underline -->
    <text x="310" y="150" font-family="'Arial Black', sans-serif" font-size="56" font-weight="bold" fill="#ef4444">100</text>
    <line x1="305" y1="160" x2="375" y2="160" stroke="#ef4444" stroke-width="6"/>
    <line x1="305" y1="170" x2="375" y2="170" stroke="#ef4444" stroke-width="4"/>
  </g>
</svg>