<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <filter id="shadowQing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQing)"/>
  <!-- Distant Cyan Mountains (青山) -->
  <polygon points="180,180 50,380 310,380" fill="#0d9488" opacity="0.6"/>
  <polygon points="340,160 210,380 470,380" fill="#0f766e" opacity="0.7"/>
  <!-- Rolling Cyan Hills -->
  <circle cx="120" cy="460" r="150" fill="#14b8a6"/>
  <circle cx="360" cy="450" r="160" fill="#0d9488"/>
  <!-- Lush Cyan Bamboo Stems in foreground -->
  <g filter="url(#shadowQing)">
    <rect x="235" y="140" width="20" height="260" rx="4" fill="#2dd4bf"/>
    <line x1="230" y1="210" x2="260" y2="210" stroke="#0f766e" stroke-width="4"/>
    <line x1="230" y1="280" x2="260" y2="280" stroke="#0f766e" stroke-width="4"/>
    <line x1="230" y1="350" x2="260" y2="350" stroke="#0f766e" stroke-width="4"/>
    <!-- Bamboo Leaves -->
    <path d="M 235 210 Q 180 200 170 230 Q 200 220 235 210 Z" fill="#14b8a6"/>
    <path d="M 255 210 Q 310 190 320 220 Q 280 210 255 210 Z" fill="#14b8a6"/>
    <path d="M 235 280 Q 170 270 160 300 Q 195 290 235 280 Z" fill="#0f766e"/>
  </g>
</svg>