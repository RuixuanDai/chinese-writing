<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowCai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgCai)"/>
  <ellipse cx="250" cy="430" rx="170" ry="30" fill="#bbf7d0" opacity="0.6"/>
  <g filter="url(#shadowCai)">
    <!-- Outer Deep Green Leaves -->
    <path d="M 250 300 C 130 220 100 120 160 90 C 220 60 250 160 250 300 Z" fill="#16a34a"/>
    <path d="M 250 300 C 370 220 400 120 340 90 C 280 60 250 160 250 300 Z" fill="#16a34a"/>
    <!-- Center Vibrant Leaves -->
    <path d="M 250 280 C 180 180 180 80 250 80 C 320 80 320 180 250 280 Z" fill="#22c55e"/>
    <!-- Leaf Veins -->
    <path d="M 250 270 L 250 100" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 160 90 Q 200 160 250 280" stroke="#bbf7d0" stroke-width="3" fill="none"/>
    <path d="M 340 90 Q 300 160 250 280" stroke="#bbf7d0" stroke-width="3" fill="none"/>
    <!-- Crisp White Stalk / Base -->
    <path d="M 180 300 C 160 380 200 420 250 420 C 300 420 340 380 320 300 C 280 340 220 340 180 300 Z" fill="#f8fafc"/>
    <path d="M 210 320 C 210 390 230 410 250 415 C 270 410 290 390 290 320 Z" fill="#ffffff"/>
  </g>
</svg>