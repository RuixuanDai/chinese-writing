<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgShen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="shadowShen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShen)"/>
  <ellipse cx="250" cy="450" rx="160" ry="30" fill="#86efac" opacity="0.6"/>
  <g filter="url(#shadowShen)">
    <!-- Legs in dynamic running/jumping pose -->
    <rect x="210" y="320" width="28" height="110" rx="14" fill="#3b82f6"/>
    <rect x="265" y="320" width="28" height="110" rx="14" fill="#3b82f6"/>
    <!-- Red Sneakers -->
    <ellipse cx="215" cy="430" rx="24" ry="14" fill="#ef4444"/>
    <ellipse cx="285" cy="430" rx="24" ry="14" fill="#ef4444"/>
    <!-- Torso / Yellow T-Shirt -->
    <rect x="190" y="200" width="120" height="135" rx="20" fill="#facc15"/>
    <circle cx="250" cy="260" r="18" fill="#ea580c"/>
    <!-- Arms waving cheerfully -->
    <path d="M 195 215 L 120 160" stroke="#facc15" stroke-width="26" stroke-linecap="round"/>
    <circle cx="115" cy="155" r="16" fill="#fed7aa"/>
    <path d="M 305 215 L 380 160" stroke="#facc15" stroke-width="26" stroke-linecap="round"/>
    <circle cx="385" cy="155" r="16" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="250" cy="135" r="55" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 195 130 C 190 70 310 70 305 130 Z" fill="#78350f"/>
    <!-- Smiling Face -->
    <circle cx="230" cy="130" r="6" fill="#1e293b"/>
    <circle cx="270" cy="130" r="6" fill="#1e293b"/>
    <path d="M 235 150 Q 250 165 265 150" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>