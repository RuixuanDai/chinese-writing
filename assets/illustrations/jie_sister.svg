<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadowJie" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJie)"/>
  <g filter="url(#shadowJie)">
    <!-- Twin Braids on sides -->
    <ellipse cx="140" cy="300" rx="22" ry="70" fill="#78350f"/>
    <circle cx="140" cy="370" r="12" fill="#f43f5e"/>
    <ellipse cx="360" cy="300" rx="22" ry="70" fill="#78350f"/>
    <circle cx="360" cy="370" r="12" fill="#f43f5e"/>
    <!-- Pretty Dress -->
    <path d="M 150 440 C 150 340 350 340 350 440 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="250" cy="230" r="85" fill="#fed7aa"/>
    <!-- Hair with bangs -->
    <path d="M 160 210 C 150 120 350 120 340 210 C 310 170 270 180 250 175 C 230 180 190 170 160 210 Z" fill="#78350f"/>
    <!-- Big Gentle Eyes -->
    <circle cx="215" cy="225" r="10" fill="#1e293b"/>
    <circle cx="212" cy="220" r="3.5" fill="#ffffff"/>
    <circle cx="285" cy="225" r="10" fill="#1e293b"/>
    <circle cx="282" cy="220" r="3.5" fill="#ffffff"/>
    <!-- Cheerful Smile -->
    <path d="M 225 260 Q 250 285 275 260" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="185" cy="255" r="11" fill="#f43f5e" opacity="0.4"/>
    <circle cx="315" cy="255" r="11" fill="#f43f5e" opacity="0.4"/>
  </g>
</svg>