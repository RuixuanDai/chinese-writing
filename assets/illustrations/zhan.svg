<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowZhan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhan)"/>
  <g filter="url(#shadowZhan)">
    <!-- Station Canopy Roof -->
    <polygon points="80,180 420,180 390,210 110,210" fill="#3b82f6"/>
    <!-- Pillars -->
    <rect x="140" y="210" width="16" height="150" fill="#64748b"/>
    <rect x="340" y="210" width="16" height="150" fill="#64748b"/>
    <!-- Station Platform -->
    <rect x="70" y="360" width="360" height="50" rx="6" fill="#94a3b8"/>
    <!-- Station Name Board Sign -->
    <rect x="200" y="220" width="100" height="50" rx="6" fill="#2563eb"/>
    <text x="250" y="255" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">车站</text>
  </g>
</svg>