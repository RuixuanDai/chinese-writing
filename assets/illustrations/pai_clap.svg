<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_pai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_pai)"/>

  <!-- Bouncing ball & hand patting it down -->
  <circle cx="100" cy="134" r="32" fill="#f97316" stroke="#c2410c" stroke-width="3"/>
  <path d="M72 122 Q100 140 128 122" fill="none" stroke="#fde047" stroke-width="4"/>
  <!-- Hand patting top of ball -->
  <ellipse cx="100" cy="76" rx="30" ry="16" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  <!-- Impact/clap bursts -->
  <line x1="56" y1="92" x2="42" y2="82" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="144" y1="92" x2="158" y2="82" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="48" x2="100" y2="34" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

</svg>
