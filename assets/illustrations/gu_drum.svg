<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGuDrum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <filter id="shadowGuDrum" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgGuDrum)"/>
  <ellipse cx="250" cy="440" rx="180" ry="35" fill="#fbcfe8" opacity="0.6"/>
  <g filter="url(#shadowGuDrum)">
    <!-- Red Drum Body (大红堂鼓) -->
    <path d="M 120 200 C 100 280 100 320 120 400 L 380 400 C 400 320 400 280 380 200 Z" fill="#dc2626"/>
    <!-- Drum Head Leather Surface -->
    <ellipse cx="250" cy="200" rx="130" ry="45" fill="#fef3c7" stroke="#ca8a04" stroke-width="6"/>
    <!-- Brass Studs around drum head -->
    <circle cx="140" cy="215" r="5" fill="#facc15"/>
    <circle cx="180" cy="235" r="5" fill="#facc15"/>
    <circle cx="220" cy="242" r="5" fill="#facc15"/>
    <circle cx="250" cy="245" r="5" fill="#facc15"/>
    <circle cx="280" cy="242" r="5" fill="#facc15"/>
    <circle cx="320" cy="235" r="5" fill="#facc15"/>
    <circle cx="360" cy="215" r="5" fill="#facc15"/>
    <!-- Drumsticks Crossed -->
    <line x1="150" y1="110" x2="280" y2="230" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
    <line x1="350" y1="110" x2="220" y2="230" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>