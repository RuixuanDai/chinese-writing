<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Back rim of open box -->
      <polygon points="48,96 152,96 164,112 36,112" fill="#9d174d"/>
      <!-- Glowing golden ball sitting INSIDE the box -->
      <circle cx="100" cy="102" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
      <circle cx="93" cy="95" r="5" fill="#ffffff" opacity="0.75"/>
      <!-- Front of box overlapping lower half of ball -->
      <rect x="48" y="108" width="104" height="60" rx="6" fill="#ec4899" stroke="#be185d" stroke-width="3"/>
      <rect x="92" y="108" width="16" height="60" fill="#fde047"/>
      <!-- Open flaps -->
      <polygon points="48,108 26,92 38,82 54,98" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
      <polygon points="152,108 174,92 162,82 146,98" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
      <g transform="translate(100, 66)">
      <line x1="0" y1="-22" x2="0" y2="-4" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
      <polygon points="0,8 -11,-8 11,-8" fill="#ef4444"/>
    </g>
    
</svg>