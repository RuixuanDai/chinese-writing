<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </radialGradient>
    <filter id="shadowLi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9a3412" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLi)"/>
  <ellipse cx="250" cy="435" rx="160" ry="24" fill="#fed7aa" opacity="0.6"/>
  <g filter="url(#shadowLi)">
    <!-- Cute Teddy Bear popping OUT from INSIDE the box -->
    <circle cx="205" cy="175" r="26" fill="#92400e"/>
    <circle cx="205" cy="175" r="14" fill="#fcd34d"/>
    <circle cx="295" cy="175" r="26" fill="#92400e"/>
    <circle cx="295" cy="175" r="14" fill="#fcd34d"/>
    <circle cx="250" cy="210" r="60" fill="#b45309"/>
    <!-- Bear muzzle and eyes -->
    <ellipse cx="250" cy="225" rx="26" ry="18" fill="#fef3c7"/>
    <ellipse cx="250" cy="218" rx="10" ry="7" fill="#451a03"/>
    <circle cx="230" cy="195" r="6" fill="#1e293b"/>
    <circle cx="270" cy="195" r="6" fill="#1e293b"/>
    <!-- Bear hands on box rim -->
    <circle cx="185" cy="265" r="20" fill="#b45309"/>
    <circle cx="315" cy="265" r="20" fill="#b45309"/>
    <!-- Gift Box (Front) -->
    <rect x="150" y="260" width="200" height="150" rx="14" fill="#ec4899"/>
    <rect x="235" y="260" width="30" height="150" fill="#facc15"/>
    <!-- Open Lid angled behind/side -->
    <polygon points="120,240 240,210 260,225 140,255" fill="#db2777"/>
  </g>
</svg>