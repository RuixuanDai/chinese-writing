<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQuan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowQuan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQuan)"/>
  <!-- Rocks around the spring -->
  <ellipse cx="140" cy="380" rx="65" ry="40" fill="#64748b"/>
  <ellipse cx="360" cy="380" rx="65" ry="40" fill="#64748b"/>
  <g filter="url(#shadowQuan)">
    <!-- Clear Spring Pool -->
    <ellipse cx="250" cy="370" rx="140" ry="70" fill="#38bdf8"/>
    <ellipse cx="250" cy="370" rx="110" ry="50" fill="#60a5fa"/>
    <!-- Bubbling Fountain Spout in Center -->
    <path d="M 235 370 Q 220 220 250 180 Q 280 220 265 370 Z" fill="#93c5fd" opacity="0.8"/>
    <!-- Water Splashes / Bubbles -->
    <circle cx="250" cy="160" r="14" fill="#38bdf8"/>
    <circle cx="230" cy="190" r="9" fill="#93c5fd"/>
    <circle cx="270" cy="190" r="9" fill="#93c5fd"/>
    <circle cx="215" cy="230" r="7" fill="#bae6fd"/>
    <circle cx="285" cy="230" r="7" fill="#bae6fd"/>
    <!-- Concentric ripples -->
    <ellipse cx="250" cy="370" rx="70" ry="25" stroke="#ffffff" stroke-width="4" fill="none"/>
  </g>
</svg>