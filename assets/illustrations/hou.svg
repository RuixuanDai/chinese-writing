<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHou" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="shadowHou" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHou)"/>
  <!-- Tree branch -->
  <path d="M 30 390 Q 250 370 470 390" stroke="#78350f" stroke-width="24" stroke-linecap="round"/>
  <!-- Green leaf on branch -->
  <ellipse cx="120" cy="360" rx="20" ry="10" fill="#16a34a" transform="rotate(-25 120 360)"/>
  <ellipse cx="380" cy="365" rx="20" ry="10" fill="#16a34a" transform="rotate(20 380 365)"/>
  <g filter="url(#shadowHou)">
    <!-- Curly Tail -->
    <path d="M 320 320 C 420 330 430 200 370 210 C 340 215 350 250 375 240" stroke="#92400e" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <ellipse cx="250" cy="300" rx="80" ry="75" fill="#92400e"/>
    <ellipse cx="250" cy="310" rx="55" ry="55" fill="#fde68a"/>
    <!-- Feet sitting on branch -->
    <ellipse cx="200" cy="375" rx="24" ry="16" fill="#78350f"/>
    <ellipse cx="300" cy="375" rx="24" ry="16" fill="#78350f"/>
    <!-- Big Round Ears -->
    <circle cx="160" cy="180" r="32" fill="#92400e"/>
    <circle cx="160" cy="180" r="20" fill="#fed7aa"/>
    <circle cx="340" cy="180" r="32" fill="#92400e"/>
    <circle cx="340" cy="180" r="20" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="250" cy="185" r="75" fill="#92400e"/>
    <!-- Heart-shaped Peach Face -->
    <path d="M 250 150 C 220 120 180 140 185 190 C 190 230 250 250 250 250 C 250 250 310 230 315 190 C 320 140 280 120 250 150 Z" fill="#fed7aa"/>
    <!-- Eyes -->
    <circle cx="220" cy="175" r="9" fill="#1e293b"/>
    <circle cx="217" cy="172" r="3" fill="#ffffff"/>
    <circle cx="280" cy="175" r="9" fill="#1e293b"/>
    <circle cx="277" cy="172" r="3" fill="#ffffff"/>
    <!-- Nose & Smile -->
    <ellipse cx="250" cy="195" rx="5" ry="3" fill="#78350f"/>
    <path d="M 235 208 Q 250 224 265 208" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="205" cy="200" r="8" fill="#f43f5e" opacity="0.3"/>
    <circle cx="295" cy="200" r="8" fill="#f43f5e" opacity="0.4"/>
    <!-- Hands holding a delicious yellow banana -->
    <path d="M 210 280 Q 250 330 290 280 Q 250 310 210 280 Z" fill="#facc15"/>
    <circle cx="215" cy="285" r="14" fill="#92400e"/>
    <circle cx="285" cy="285" r="14" fill="#92400e"/>
  </g>
</svg>