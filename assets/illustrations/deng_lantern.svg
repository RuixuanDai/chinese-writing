<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDeng" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <filter id="shadowDeng" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDeng)"/>
  <g filter="url(#shadowDeng)">
    <!-- Hanging cord -->
    <line x1="250" y1="40" x2="250" y2="130" stroke="#ca8a04" stroke-width="6"/>
    <!-- Gold Top Cap -->
    <rect x="190" y="130" width="120" height="24" rx="8" fill="#facc15"/>
    <!-- Red Round Lantern Body (灯笼) -->
    <ellipse cx="250" cy="270" rx="130" ry="120" fill="#dc2626"/>
    <ellipse cx="250" cy="270" rx="80" ry="120" fill="#ef4444"/>
    <ellipse cx="250" cy="270" rx="30" ry="120" fill="#f87171"/>
    <!-- Gold Bottom Cap -->
    <rect x="190" y="380" width="120" height="24" rx="8" fill="#facc15"/>
    <!-- Flowing Golden / Red Tassels -->
    <line x1="220" y1="404" x2="220" y2="470" stroke="#ca8a04" stroke-width="6"/>
    <line x1="250" y1="404" x2="250" y2="480" stroke="#dc2626" stroke-width="12"/>
    <line x1="280" y1="404" x2="280" y2="470" stroke="#ca8a04" stroke-width="6"/>
  </g>
</svg>