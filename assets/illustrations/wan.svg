<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <filter id="shadowWan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgWan)"/>
  <g filter="url(#shadowWan)">
    <!-- Celebration Fireworks Sparks in background -->
    <path d="M 250 140 L 250 80 M 250 140 L 300 90 M 250 140 L 310 140 M 250 140 L 290 180 M 250 140 L 210 180 M 250 140 L 190 140 M 250 140 L 200 90" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <!-- Red Festive Lantern Center -->
    <ellipse cx="250" cy="280" rx="110" ry="120" fill="#dc2626"/>
    <ellipse cx="250" cy="280" rx="65" ry="120" fill="#ef4444"/>
    <line x1="250" y1="160" x2="250" y2="400" stroke="#b91c1c" stroke-width="4"/>
    <!-- Gold Caps on Lantern -->
    <rect x="200" y="150" width="100" height="20" rx="6" fill="#facc15"/>
    <rect x="200" y="390" width="100" height="20" rx="6" fill="#facc15"/>
    <!-- Hanging Tassel -->
    <line x1="250" y1="410" x2="250" y2="470" stroke="#e11d48" stroke-width="12" stroke-linecap="round"/>
    <!-- Gold Badge with "万" on lantern -->
    <circle cx="250" cy="280" r="46" fill="#facc15"/>
    <text x="250" y="302" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="62" font-weight="bold" fill="#b91c1c" text-anchor="middle">万</text>
  </g>
</svg>