<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYuanWish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="shadowYuanWish" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYuanWish)"/>
  <!-- Twinkling Stars in background -->
  <circle cx="100" cy="120" r="3" fill="#ffffff"/>
  <circle cx="390" cy="110" r="3" fill="#ffffff"/>
  <circle cx="420" cy="270" r="2.5" fill="#ffffff"/>
  <circle cx="90" cy="380" r="2.5" fill="#ffffff"/>
  <g filter="url(#shadowYuanWish)">
    <!-- Shooting Wishing Star Trail -->
    <path d="M 80 400 Q 250 250 350 120" stroke="#fef08a" stroke-width="8" stroke-dasharray="14 10" fill="none"/>
    <!-- Radiant Golden Wishing Star -->
    <polygon points="350,70 365,115 410,120 375,150 385,195 350,170 315,195 325,150 290,120 335,115" fill="#facc15" stroke="#eab308" stroke-width="4"/>
    <!-- Folded Paper Origami Crane (千纸鹤) -->
    <polygon points="210,240 140,290 270,300" fill="#38bdf8"/>
    <polygon points="210,240 270,300 240,360" fill="#0284c7"/>
    <polygon points="210,240 280,260 270,300" fill="#93c5fd"/>
    <polygon points="140,290 110,280 130,300" fill="#0284c7"/>
  </g>
</svg>