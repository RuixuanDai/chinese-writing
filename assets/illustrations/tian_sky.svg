<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="softSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#skyGrad)"/>
  
  <!-- Radiant Golden Sun high in the sky (天空 / 晴天) -->
  <g transform="translate(130, 130)">
    <!-- Sunbeams -->
    <g stroke="#fde047" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-70" x2="0" y2="-90"/>
      <line x1="0" y1="70" x2="0" y2="90"/>
      <line x1="-70" y1="0" x2="-90" y2="0"/>
      <line x1="70" y1="0" x2="90" y2="0"/>
      <line x1="-50" y1="-50" x2="-65" y2="-65"/>
      <line x1="50" y1="50" x2="65" y2="65"/>
      <line x1="50" y1="-50" x2="65" y2="-65"/>
      <line x1="-50" y1="50" x2="-65" y2="65"/>
    </g>
    <!-- Sun disc -->
    <circle cx="0" cy="0" r="52" fill="url(#sunGrad)" stroke="#f59e0b" stroke-width="4"/>
    <!-- Cute friendly smiling face on sun -->
    <circle cx="-16" cy="-8" r="5.5" fill="#78350f"/>
    <circle cx="16" cy="-8" r="5.5" fill="#78350f"/>
    <circle cx="-18" cy="-10" r="2" fill="#ffffff"/>
    <circle cx="14" cy="-10" r="2" fill="#ffffff"/>
    <circle cx="-25" cy="5" r="7" fill="#f87171" opacity="0.6"/>
    <circle cx="25" cy="5" r="7" fill="#f87171" opacity="0.6"/>
    <path d="M -12 8 Q 0 20 12 8" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Gentle Rainbow Arching Across Sky -->
  <g opacity="0.75" filter="url(#softSh)">
    <path d="M 120 460 C 150 250 350 250 480 380" stroke="#f43f5e" stroke-width="8" fill="none"/>
    <path d="M 125 460 C 153 256 347 256 475 380" stroke="#fb923c" stroke-width="8" fill="none"/>
    <path d="M 130 460 C 156 262 344 262 470 380" stroke="#facc15" stroke-width="8" fill="none"/>
    <path d="M 135 460 C 159 268 341 268 465 380" stroke="#4ade80" stroke-width="8" fill="none"/>
    <path d="M 140 460 C 162 274 338 274 460 380" stroke="#38bdf8" stroke-width="8" fill="none"/>
    <path d="M 145 460 C 165 280 335 280 455 380" stroke="#a855f7" stroke-width="8" fill="none"/>
  </g>

  <!-- Puffy Cumulus White Clouds in Sky (蓝天白云) -->
  <g filter="url(#softSh)">
    <!-- Main Big Cloud -->
    <g fill="#ffffff">
      <ellipse cx="320" cy="270" rx="90" ry="50"/>
      <circle cx="270" cy="245" r="48"/>
      <circle cx="340" cy="225" r="54"/>
      <circle cx="395" cy="250" r="44"/>
    </g>
    <!-- Soft cloud shade -->
    <ellipse cx="330" cy="285" rx="75" ry="20" fill="#e0f2fe" opacity="0.6"/>
    
    <!-- Secondary cute cloud (lower left) -->
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="140" cy="380" rx="70" ry="38"/>
      <circle cx="110" cy="360" r="34"/>
      <circle cx="160" cy="350" r="40"/>
    </g>
  </g>
</svg>