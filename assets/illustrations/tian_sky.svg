      <g fill="#ffffff" opacity="0.95">
        <circle cx="52" cy="70" r="14"/><circle cx="68" cy="65" r="18"/><circle cx="84" cy="71" r="13"/>
        <rect x="50" y="69" width="36" height="15" rx="7"/>
      </g>
      <g fill="#ffffff" opacity="0.9">
        <circle cx="134" cy="52" r="11"/><circle cx="148" cy="48" r="14"/><circle cx="160" cy="53" r="10"/>
      </g>
      <!-- Tiny soaring sky birds -->
