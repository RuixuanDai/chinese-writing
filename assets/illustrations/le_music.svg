<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_le" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_le)"/>

  <!-- Musical notes floating around -->
  <g fill="#ec4899">
    <circle cx="42" cy="54" r="6"/><rect x="46" y="34" width="3.5" height="20"/><polygon points="46,34 58,38 58,44 46,40"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="154" cy="50" r="6"/><rect x="158" y="30" width="3.5" height="20"/><polygon points="158,30 170,34 170,40 158,36"/>
  </g>
  <!-- Beaming joyful child face -->
  <circle cx="100" cy="82" r="36" fill="#fed7aa" stroke="#f97316" stroke-width="2.5"/>
  <path d="M64 76 Q100 38 136 76" fill="#451a03"/>
  <!-- Happy curved laughing eyes -->
  <path d="M80 78 Q86 70 92 78" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M108 78 Q114 70 120 78" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="75" cy="88" r="6" fill="#f43f5e" opacity="0.45"/>
  <circle cx="125" cy="88" r="6" fill="#f43f5e" opacity="0.45"/>
  <!-- Big joyful open smile -->
  <path d="M84 92 Q100 112 116 92 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <!-- Colorful mini xylophone below -->
  <rect x="44" y="142" width="112" height="8" rx="4" fill="#92400e"/>
  <rect x="50" y="128" width="16" height="32" rx="4" fill="#ef4444"/>
  <rect x="70" y="130" width="16" height="28" rx="4" fill="#f97316"/>
  <rect x="90" y="132" width="16" height="24" rx="4" fill="#eab308"/>
