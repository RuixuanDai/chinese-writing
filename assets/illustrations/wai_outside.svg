<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </radialGradient>
    <filter id="shadowWai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgWai)"/>
  <ellipse cx="250" cy="435" rx="160" ry="24" fill="#bae6fd" opacity="0.6"/>
  <g filter="url(#shadowWai)">
    <!-- Birdcage with Open Door on the left -->
    <rect x="100" y="200" width="130" height="190" rx="20" fill="none" stroke="#d97706" stroke-width="8"/>
    <path d="M 100 240 C 100 150 230 150 230 240" fill="none" stroke="#d97706" stroke-width="8"/>
    <line x1="140" y1="180" x2="140" y2="390" stroke="#d97706" stroke-width="5"/>
    <line x1="190" y1="180" x2="190" y2="390" stroke="#d97706" stroke-width="5"/>
    <!-- Open Door swinging out -->
    <rect x="195" y="240" width="60" height="110" rx="8" fill="none" stroke="#b45309" stroke-width="6"/>
    <!-- Blue Bird Flying Free in the Outside Sky -->
    <path d="M 330 200 Q 300 150 370 140 Q 350 190 390 200 Q 340 230 330 200 Z" fill="#0284c7"/>
    <circle cx="365" cy="165" r="18" fill="#38bdf8"/>
    <polygon points="380,165 405,168 380,174" fill="#f97316"/>
    <circle cx="370" cy="162" r="3.5" fill="#0f172a"/>
    <!-- Clouds in outside sky -->
    <circle cx="380" cy="270" r="30" fill="#ffffff" opacity="0.9"/>
    <circle cx="420" cy="275" r="22" fill="#ffffff" opacity="0.9"/>
    <circle cx="350" cy="280" r="20" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>