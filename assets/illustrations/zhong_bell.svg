<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhongBell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="shadowZhongBell" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhongBell)"/>
  <g filter="url(#shadowZhongBell)">
    <!-- Wooden Beam on Top -->
    <rect x="100" y="80" width="300" height="30" rx="6" fill="#78350f"/>
    <!-- Bronze Bell Body -->
    <path d="M 180 130 Q 250 110 320 130 C 330 240 370 330 380 370 Q 250 390 120 370 C 130 330 170 240 180 130 Z" fill="#ca8a04"/>
    <path d="M 195 140 Q 250 125 305 140 C 315 240 350 325 360 360 Q 250 375 140 360 C 150 325 185 240 195 140 Z" fill="#eab308"/>
    <!-- Bell decorative bands -->
    <path d="M 160 250 Q 250 270 340 250" stroke="#a16207" stroke-width="8" fill="none"/>
    <path d="M 135 340 Q 250 360 365 340" stroke="#a16207" stroke-width="8" fill="none"/>
  </g>
</svg>