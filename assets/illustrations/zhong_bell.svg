<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_zhong" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_zhong)"/>

  <!-- Clock legs -->
  <line x1="66" y1="158" x2="52" y2="176" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <line x1="134" y1="158" x2="148" y2="176" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <!-- Twin top bells & hammer -->
  <path d="M42 54 A22 22 0 0 1 78 36 Z" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <path d="M158 54 A22 22 0 0 0 122 36 Z" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <line x1="100" y1="26" x2="100" y2="44" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="24" r="6" fill="#ea580c"/>
  <!-- Sound rings -->
  <path d="M28 38 Q32 24 46 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 38 Q168 24 154 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Main clock body -->
  <circle cx="100" cy="106" r="58" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
  <circle cx="100" cy="106" r="46" fill="#ffffff"/>
  <!-- 12 hour ticks -->
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="65" x2="100" y2="72"/>
    <line x1="141" y1="106" x2="134" y2="106"/>
    <line x1="100" y1="147" x2="100" y2="140"/>
    <line x1="59" y1="106" x2="66" y2="106"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="120" cy="71" r="2.5"/><circle cx="135" cy="86" r="2.5"/>
    <circle cx="135" cy="126" r="2.5"/><circle cx="120" cy="141" r="2.5"/>
    <circle cx="80" cy="141" r="2.5"/><circle cx="65" cy="126" r="2.5"/>
    <circle cx="65" cy="86" r="2.5"/><circle cx="80" cy="71" r="2.5"/>
  </g>
  <!-- Clock hands (10:10) -->
  <line x1="100" y1="106" x2="80" y2="88" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="100" y1="106" x2="126" y2="82" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="106" r="5" fill="#1e293b"/>

</svg>
