<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHei" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadowHei" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHei)"/>
  <!-- Cute Black Kitten (黑色) -->
  <g filter="url(#shadowHei)">
    <!-- Ears -->
    <polygon points="180,180 150,110 220,150" fill="#0f172a"/>
    <polygon points="175,170 160,130 205,155" fill="#e11d48"/>
    <polygon points="320,180 350,110 280,150" fill="#0f172a"/>
    <polygon points="325,170 340,130 295,155" fill="#e11d48"/>
    <!-- Head -->
    <circle cx="250" cy="225" r="80" fill="#0f172a"/>
    <!-- Body -->
    <ellipse cx="250" cy="345" rx="80" ry="85" fill="#0f172a"/>
    <!-- Big Golden Eyes -->
    <circle cx="215" cy="215" r="14" fill="#facc15"/>
    <circle cx="285" cy="215" r="14" fill="#facc15"/>
    <ellipse cx="215" cy="215" rx="5" ry="12" fill="#000000"/>
    <ellipse cx="285" cy="215" rx="5" ry="12" fill="#000000"/>
    <circle cx="212" cy="210" r="3" fill="#ffffff"/>
    <circle cx="282" cy="210" r="3" fill="#ffffff"/>
    <!-- Pink Nose -->
    <polygon points="250,238 244,232 256,232" fill="#fda4af"/>
    <!-- Red Bowtie -->
    <polygon points="230,305 250,315 230,325" fill="#ef4444"/>
    <polygon points="270,305 250,315 270,325" fill="#ef4444"/>
    <circle cx="250" cy="315" r="6" fill="#dc2626"/>
  </g>
</svg>