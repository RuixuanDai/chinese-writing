<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <filter id="shadowBi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBi)"/>
  <!-- Cheerful Yellow Pencil (画笔 / 铅笔) -->
  <g filter="url(#shadowBi)">
    <g transform="rotate(45, 250, 250)">
      <!-- Eraser -->
      <rect x="230" y="80" width="40" height="40" rx="8" fill="#f43f5e"/>
      <rect x="228" y="115" width="44" height="20" fill="#94a3b8"/>
      <!-- Pencil Body -->
      <rect x="230" y="135" width="40" height="190" fill="#facc15" stroke="#eab308" stroke-width="2"/>
      <line x1="243" y1="135" x2="243" y2="325" stroke="#eab308" stroke-width="3"/>
      <line x1="257" y1="135" x2="257" y2="325" stroke="#eab308" stroke-width="3"/>
      <!-- Wooden Tip -->
      <polygon points="230,325 270,325 250,385" fill="#fed7aa"/>
      <!-- Graphite Lead -->
      <polygon points="243,365 257,365 250,385" fill="#0f172a"/>
    </g>
  </g>
</svg>