<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHeRiver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </radialGradient>
    <filter id="shadowHeRiver" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0891b2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHeRiver)"/>
  <!-- Green Grassy Banks -->
  <path d="M 0 0 L 0 500 L 140 500 C 180 340 100 230 180 0 Z" fill="#4ade80"/>
  <path d="M 500 0 L 500 500 L 360 500 C 400 340 320 230 400 0 Z" fill="#22c55e"/>
  <g filter="url(#shadowHeRiver)">
    <!-- Sparkling Blue Creek Water -->
    <path d="M 180 0 C 100 230 180 340 140 500 L 360 500 C 400 340 320 230 400 0 Z" fill="#38bdf8"/>
    <!-- Water Ripple Currents -->
    <path d="M 230 120 Q 280 150 250 200" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 240 270 Q 290 310 260 360" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- River Pebbles on bank -->
    <ellipse cx="150" cy="380" rx="14" ry="10" fill="#94a3b8"/>
    <ellipse cx="165" cy="410" rx="18" ry="12" fill="#64748b"/>
    <ellipse cx="345" cy="280" rx="15" ry="10" fill="#94a3b8"/>
    <!-- Little fish jumping -->
    <path d="M 270 230 Q 290 215 300 230 Q 290 235 270 230 Z" fill="#f97316"/>
  </g>
</svg>