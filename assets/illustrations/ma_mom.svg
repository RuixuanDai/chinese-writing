    <path d="M 275 210 Q 290 200 305 210" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="210" cy="218" r="4" fill="#1e293b"/>
    <circle cx="290" cy="218" r="4" fill="#1e293b"/>
    <!-- Cute Nose & Sweet Smile -->
    <circle cx="250" cy="235" r="4" fill="#ea580c"/>
