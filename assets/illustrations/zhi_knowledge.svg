<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowZhi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhi)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#bfdbfe" opacity="0.6"/>
  <g filter="url(#shadowZhi)">
    <!-- Stack of Colorful Books -->
    <rect x="130" y="330" width="240" height="45" rx="8" fill="#ef4444"/>
    <rect x="140" y="280" width="220" height="45" rx="8" fill="#3b82f6"/>
    <rect x="155" y="230" width="190" height="45" rx="8" fill="#10b981"/>
    <!-- Book pages edge -->
    <rect x="145" y="340" width="210" height="25" fill="#ffffff" opacity="0.8"/>
    <rect x="155" y="290" width="190" height="25" fill="#ffffff" opacity="0.8"/>
    <rect x="170" y="240" width="160" height="25" fill="#ffffff" opacity="0.8"/>
    <!-- Graduation Cap on top -->
    <polygon points="250,110 120,160 250,200 380,160" fill="#1e1b4b"/>
    <rect x="200" y="180" width="100" height="40" rx="10" fill="#1e1b4b"/>
    <!-- Golden Tassel -->
    <circle cx="250" cy="155" r="7" fill="#f59e0b"/>
    <path d="M 250 155 Q 350 160 360 210" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <rect x="350" y="210" width="20" height="30" rx="4" fill="#f59e0b"/>
  </g>
</svg>