<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Steep rocky mountain slope on right -->
      <polygon points="56,184 148,34 192,184" fill="#64748b"/>
      <polygon points="122,76 148,34 166,78 148,86 134,74" fill="#ffffff"/>
      <polygon points="24,184 88,116 142,184" fill="#475569"/>
      <!-- Red backpack & climbing hiker ascending slope -->
      <g transform="translate(88, 118) rotate(-14)">
        <rect x="-22" y="-18" width="16" height="26" rx="6" fill="#ef4444"/>
        <!-- Climbing legs -->
        <path d="M-4 8 L-14 36 M4 6 L20 22 L20 36" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Torso & arm holding trekking pole -->
        <rect x="-10" y="-20" width="22" height="30" rx="9" fill="#f59e0b"/>
        <path d="M8 -12 L28 -6" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
        <line x1="28" y1="-22" x2="28" y2="34" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Head -->
        <circle cx="2" cy="-34" r="14" fill="#fed7aa"/>
        <path d="M-12 -36 C-12 -52 16 -52 16 -36 Z" fill="#2563eb"/>
        <circle cx="7" cy="-33" r="2" fill="#1e293b"/>
      </g>
      <!-- Upward climb arrow -->
      <path d="M34 118 L56 74 M44 75 L57 72 L59 85" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
</svg>