<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeng" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadowDeng" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDeng)"/>
  <!-- Majestic Mountain Peak (登高) -->
  <polygon points="250,140 60,450 440,450" fill="#0284c7"/>
  <polygon points="250,140 250,450 440,450" fill="#0369a1"/>
  <!-- Mountain Snowcap -->
  <polygon points="250,140 200,220 230,210 250,230 270,210 300,220" fill="#ffffff"/>
  <!-- Clouds around mountain waist -->
  <ellipse cx="140" cy="300" rx="60" ry="24" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="360" cy="320" rx="70" ry="26" fill="#ffffff" opacity="0.85"/>
  <!-- Red Victory Summit Flag planted at the peak -->
  <g filter="url(#shadowDeng)">
    <line x1="250" y1="80" x2="250" y2="160" stroke="#713f12" stroke-width="6" stroke-linecap="round"/>
    <polygon points="250,85 330,110 250,135" fill="#ef4444"/>
    <circle cx="250" cy="80" r="6" fill="#facc15"/>
  </g>
</svg>