<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKuan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadowKuan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0c4a6e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgKuan)"/>
  <!-- Vast Starry Sky -->
  <circle cx="100" cy="100" r="3" fill="#ffffff"/>
  <circle cx="200" cy="70" r="4" fill="#ffffff"/>
  <circle cx="380" cy="90" r="3" fill="#ffffff"/>
  <circle cx="300" cy="130" r="5" fill="#fde047"/>
  <!-- Golden Moon Crescent -->
  <path d="M 400 80 A 35 35 0 0 0 370 130 A 45 45 0 0 1 400 80 Z" fill="#facc15"/>
  <!-- Wide Expansive Ocean Waves -->
  <g filter="url(#shadowKuan)">
    <path d="M 0 310 Q 125 280 250 310 Q 375 340 500 310 L 500 500 L 0 500 Z" fill="#0284c7" opacity="0.7"/>
    <path d="M 0 350 Q 125 380 250 350 Q 375 320 500 350 L 500 500 L 0 500 Z" fill="#0369a1" opacity="0.8"/>
    <path d="M 0 400 Q 125 370 250 400 Q 375 430 500 400 L 500 500 L 0 500 Z" fill="#075985"/>
    <!-- Little Sailboat Sailing on the Wide Sea -->
    <polygon points="260,260 260,330 310,330" fill="#ffffff"/>
    <polygon points="255,270 255,330 220,330" fill="#f87171"/>
    <rect x="220" y="330" width="90" height="20" rx="6" fill="#b45309"/>
  </g>
</svg>