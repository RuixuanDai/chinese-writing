<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_kuan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_kuan)"/>

  <!-- Green banks on far left and far right -->
  <polygon points="0,60 44,60 16,200 0,200" fill="#22c55e"/>
  <polygon points="200,60 156,60 184,200 200,200" fill="#22c55e"/>
  <!-- Very wide open road/plaza spanning almost the entire width -->
  <polygon points="44,60 156,60 184,200 16,200" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <line x1="100" y1="66" x2="100" y2="194" stroke="#facc15" stroke-width="4" stroke-dasharray="10,8"/>
  <!-- Bold red double-headed horizontal arrow emphasizing WIDE -->
  <line x1="34" y1="128" x2="166" y2="128" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  <polygon points="24,128 44,114 44,142" fill="#ef4444"/>
  <polygon points="176,128 156,114 156,142" fill="#ef4444"/>

</svg>
