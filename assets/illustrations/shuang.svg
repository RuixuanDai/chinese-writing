<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgShuang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </radialGradient>
    <filter id="shadowShuang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShuang)"/>
  <g filter="url(#shadowShuang)">
    <!-- Winter Amber Leaf Covered in Frost -->
    <path d="M 120 390 C 110 240 200 120 370 110 C 380 280 260 410 120 390 Z" fill="#b45309"/>
    <!-- Frost Rim around edges -->
    <path d="M 120 390 C 110 240 200 120 370 110" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 10" fill="none"/>
    <path d="M 370 110 C 380 280 260 410 120 390" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 10" fill="none"/>
    <!-- Frost Needles / Crystals on surface -->
    <line x1="200" y1="280" x2="230" y2="250" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="220" x2="280" y2="200" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="270" y1="290" x2="310" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Sparkling Frost Star -->
    <polygon points="350,140 354,152 366,152 356,160 360,172 350,164 340,172 344,160 334,152 346,152" fill="#ffffff"/>
  </g>
</svg>