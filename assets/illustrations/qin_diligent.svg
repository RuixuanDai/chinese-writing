<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowQin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQin)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fde68a" opacity="0.6"/>
  <!-- Blooming Sunflower on the left -->
  <g filter="url(#shadowQin)">
    <!-- Stem & Leaves -->
    <path d="M 120 440 Q 130 350 140 280" stroke="#16a34a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 130 360 Q 80 340 90 310 Q 120 330 130 360 Z" fill="#22c55e"/>
    <!-- Sunflower Petals -->
    <circle cx="140" cy="260" r="70" fill="#facc15"/>
    <circle cx="140" cy="260" r="42" fill="#78350f"/>
    <!-- Busy Honeybee flying toward flower -->
    <!-- Wings -->
    <ellipse cx="290" cy="180" rx="28" ry="48" fill="#e0f2fe" opacity="0.8" transform="rotate(-30 290 180)"/>
    <ellipse cx="320" cy="170" rx="24" ry="42" fill="#e0f2fe" opacity="0.8" transform="rotate(15 320 170)"/>
    <!-- Bee Body -->
    <ellipse cx="310" cy="240" rx="60" ry="42" fill="#fbbf24"/>
    <!-- Black Stripes -->
    <path d="M 285 205 L 285 275" stroke="#18181b" stroke-width="12"/>
    <path d="M 315 200 L 315 280" stroke="#18181b" stroke-width="12"/>
    <path d="M 345 208 L 345 272" stroke="#18181b" stroke-width="12"/>
    <!-- Bee Head -->
    <circle cx="245" cy="240" r="26" fill="#18181b"/>
    <circle cx="240" cy="235" r="5" fill="#ffffff"/>
    <!-- Antennas -->
    <path d="M 235 220 Q 220 195 210 200" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>