<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowQi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQi)"/>
  <g filter="url(#shadowQi)">
    <!-- 7 Rainbow Stars Arching Across -->
    <!-- Star 1 (Red) -->
    <circle cx="80" cy="330" r="28" fill="#ef4444"/>
    <text x="80" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <!-- Star 2 (Orange) -->
    <circle cx="125" cy="240" r="28" fill="#f97316"/>
    <text x="125" y="250" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <!-- Star 3 (Yellow) -->
    <circle cx="185" cy="170" r="28" fill="#eab308"/>
    <text x="185" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <!-- Star 4 (Green, Crest) -->
    <circle cx="250" cy="130" r="34" fill="#22c55e"/>
    <text x="250" y="142" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <!-- Star 5 (Cyan) -->
    <circle cx="315" cy="170" r="28" fill="#06b6d4"/>
    <text x="315" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <!-- Star 6 (Blue) -->
    <circle cx="375" cy="240" r="28" fill="#3b82f6"/>
    <text x="375" y="250" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <!-- Star 7 (Purple) -->
    <circle cx="420" cy="330" r="28" fill="#a855f7"/>
    <text x="420" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <!-- Rainbow arch guide path -->
    <path d="M 80 330 Q 250 80 420 330" stroke="#fbcfe8" stroke-width="6" stroke-dasharray="10 8" fill="none"/>
  </g>
</svg>