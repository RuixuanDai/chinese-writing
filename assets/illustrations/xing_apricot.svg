  <!-- Warm blush on one side -->
  <circle cx="118" cy="102" r="32" fill="#f97316" opacity="0.55"/>
  <!-- Gentle warm crease curve (not black!) -->
  <path d="M96 58 Q80 108 96 156" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <ellipse cx="74" cy="88" rx="8" ry="14" transform="rotate(-20 74 88)" fill="#fef08a" opacity="0.55"/>

</svg>
