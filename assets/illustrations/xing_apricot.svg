<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_xing_ap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_xing_ap)"/>

  <!-- Stem & green apricot leaf -->
  <path d="M100 54 Q96 34 86 28" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 44 Q130 26 144 48 Q122 64 98 44 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <!-- Golden-orange apricot body -->
