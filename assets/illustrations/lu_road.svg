<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLuRoad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="shadowLuRoad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLuRoad)"/>
  <g filter="url(#shadowLuRoad)">
    <!-- Highway Road Vanishing to Horizon -->
    <polygon points="50,470 450,470 280,140 220,140" fill="#334155"/>
    <!-- Yellow Dashed Road Lines -->
    <line x1="250" y1="150" x2="250" y2="470" stroke="#facc15" stroke-width="12" stroke-dasharray="24 18"/>
    <!-- Green Roadside Trees -->
    <circle cx="110" cy="330" r="35" fill="#22c55e"/>
    <circle cx="390" cy="330" r="35" fill="#22c55e"/>
    <circle cx="180" cy="220" r="22" fill="#16a34a"/>
    <circle cx="320" cy="220" r="22" fill="#16a34a"/>
  </g>
</svg>