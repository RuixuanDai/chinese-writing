  <path d="M132 70 L150 102" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
  <rect x="68" y="68" width="64" height="22" rx="8" fill="#38bdf8"/>
  <!-- Round exposed belly (腹部) -->
