<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgFu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowFu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgFu)"/>
  <g filter="url(#shadowFu)">
    <!-- Round Chubby Belly (腹部) -->
    <circle cx="250" cy="270" r="140" fill="#fed7aa"/>
    <!-- Cute Navel (肚脐眼) -->
    <ellipse cx="250" cy="285" rx="10" ry="7" fill="#ea580c"/>
    <circle cx="250" cy="283" r="3" fill="#c2410c"/>
    <!-- Gentle tummy tickle swirls -->
    <path d="M 210 250 Q 250 220 290 250" stroke="#fdba74" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Little Hands patting tummy -->
    <circle cx="130" cy="270" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
    <circle cx="370" cy="270" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  </g>
</svg>