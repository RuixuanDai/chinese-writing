<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_mei" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_mei)"/>

  <!-- Forehead & upper face -->
  <rect x="26" y="34" width="148" height="132" rx="48" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <!-- Prominent arched eyebrows -->
  <path d="M46 82 Q68 62 90 78" fill="none" stroke="#431407" stroke-width="9" stroke-linecap="round"/>
  <path d="M110 78 Q132 62 154 82" fill="none" stroke="#431407" stroke-width="9" stroke-linecap="round"/>
  <!-- Highlight dashed oval around left & right eyebrows -->
  <rect x="36" y="56" width="128" height="36" rx="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Red arrow pointing from top to eyebrows -->
  <path d="M100 22 L100 50" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <polygon points="100,56 91,44 109,44" fill="#ef4444"/>
  <!-- Gentle closed smiling eyes below (de-emphasized) -->
  <path d="M54 118 Q68 128 82 118" fill="none" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M118 118 Q132 128 146 118" fill="none" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="48" cy="134" r="9" fill="#fca5a5" opacity="0.5"/>
  <circle cx="152" cy="134" r="9" fill="#fca5a5" opacity="0.5"/>

</svg>
