    <ellipse cx="170" cy="260" rx="45" ry="30" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <circle cx="170" cy="260" r="22" fill="#3b82f6"/>
    <circle cx="170" cy="260" r="14" fill="#0f172a"/>
    <circle cx="163" cy="253" r="5" fill="#ffffff"/>
    <ellipse cx="330" cy="260" rx="45" ry="30" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <circle cx="330" cy="260" r="22" fill="#3b82f6"/>
    <circle cx="330" cy="260" r="14" fill="#0f172a"/>
    <circle cx="323" cy="253" r="5" fill="#ffffff"/>
  </g>
</svg>