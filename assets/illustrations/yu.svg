<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRain" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
    <g id="raindrop">
      <path d="M 0 -18 C -7 -6 -9 4 0 12 C 9 4 7 -6 0 -18 Z" fill="#38bdf8" opacity="0.85"/>
      <ellipse cx="-2" cy="5" rx="2" ry="4" fill="#ffffff" opacity="0.6"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgRain)"/>

  <!-- Falling Raindrops (雨) -->
  <use href="#raindrop" x="90" y="90" transform="scale(1.1)"/>
  <use href="#raindrop" x="380" y="80" transform="scale(1.2)"/>
  <use href="#raindrop" x="120" y="240" transform="scale(0.9)"/>
  <use href="#raindrop" x="390" y="260" transform="scale(1.1)"/>
  <use href="#raindrop" x="70" y="370" transform="scale(1)"/>
  <use href="#raindrop" x="420" y="380" transform="scale(0.95)"/>

  <!-- Umbrella Top (雨伞) -->
  <g filter="url(#dropShadow)">
    <!-- Canopy -->
    <path d="M 120 280 Q 250 140 380 280 C 340 265 300 265 260 280 C 220 265 180 265 120 280 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <!-- Canopy ribs/panels -->
    <path d="M 250 160 Q 200 220 190 275" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <path d="M 250 160 Q 300 220 310 275" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <!-- Tip -->
    <rect x="247" y="145" width="6" height="15" rx="3" fill="#d97706"/>
    <!-- Handle -->
    <line x1="250" y1="270" x2="250" y2="390" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 250 390 C 250 420 215 420 215 395" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ground Puddle with Ripples -->
  <ellipse cx="250" cy="445" rx="140" ry="16" fill="#bae6fd" opacity="0.6"/>
  <ellipse cx="250" cy="445" rx="100" ry="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
</svg>
