<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGeM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </radialGradient>
    <filter id="shadowGeM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#c2410c" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgGeM)"/>
  <ellipse cx="250" cy="440" rx="170" ry="24" fill="#fed7aa" opacity="0.6"/>

  <!-- Measure Word "个" (一个彩色气球量词) -->
  <g filter="url(#shadowGeM)">
    <!-- One Vibrant Red Flying Balloon (单个个体) -->
    <g transform="translate(250, 260)">
      <!-- Balloon string -->
      <path d="M 0 75 Q -25 110 15 140 Q -15 170 0 190" stroke="#f97316" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- Knot -->
      <polygon points="0,70 -8,80 8,80" fill="#dc2626"/>
      <!-- Balloon body -->
      <ellipse cx="0" cy="0" rx="68" ry="78" fill="#ef4444" stroke="#dc2626" stroke-width="4"/>
      <!-- Highlight -->
      <ellipse cx="-24" cy="-28" rx="18" ry="32" fill="#ffffff" opacity="0.45" transform="rotate(-25 -24 -28)"/>
      <circle cx="-32" cy="-44" r="5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Prominent Counting Measure Badge "1 个" (量词标牌) -->
    <g transform="translate(250, 95)">
      <rect x="-85" y="-35" width="170" height="70" rx="35" fill="#ffffff" stroke="#ea580c" stroke-width="5"/>
      <text x="0" y="14" font-family="'Arial Rounded MT Bold', sans-serif" font-size="40" font-weight="bold" fill="#c2410c" text-anchor="middle" letter-spacing="2">1 个</text>
    </g>
    <!-- Pointer Arrow pointing down to the single balloon -->
    <polygon points="250,145 238,132 262,132" fill="#ea580c"/>
  </g>
</svg>