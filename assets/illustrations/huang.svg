<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHuang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowHuang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHuang)"/>
  <!-- Bright Yellow Sunflower (黄色) -->
  <g filter="url(#shadowHuang)">
    <!-- Stem & Leaves -->
    <path d="M 250 250 Q 240 370 250 430" stroke="#15803d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 245 350 C 170 340 160 290 245 330 Z" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
    <!-- Yellow Petals -->
    <circle cx="250" cy="150" r="35" fill="#facc15"/>
    <circle cx="320" cy="180" r="35" fill="#facc15"/>
    <circle cx="350" cy="250" r="35" fill="#facc15"/>
    <circle cx="320" cy="320" r="35" fill="#facc15"/>
    <circle cx="250" cy="350" r="35" fill="#facc15"/>
    <circle cx="180" cy="320" r="35" fill="#facc15"/>
    <circle cx="150" cy="250" r="35" fill="#facc15"/>
    <circle cx="180" cy="180" r="35" fill="#facc15"/>
    <!-- Brown Seed Center -->
    <circle cx="250" cy="250" r="65" fill="#78350f" stroke="#b45309" stroke-width="4"/>
    <circle cx="235" cy="240" r="5" fill="#fde68a"/>
    <circle cx="265" cy="240" r="5" fill="#fde68a"/>
    <path d="M 242 258 Q 250 266 258 258" stroke="#fde68a" stroke-width="3" fill="none"/>
  </g>
</svg>