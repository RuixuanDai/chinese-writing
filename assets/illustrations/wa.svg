<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="shadowWa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgWa)"/>
  <!-- Giant Lily Pad -->
  <ellipse cx="250" cy="410" rx="210" ry="55" fill="#16a34a"/>
  <polygon points="250,410 430,380 430,440" fill="#bbf7d0"/>
  <g filter="url(#shadowWa)">
    <!-- Back Folded Legs -->
    <ellipse cx="140" cy="350" rx="55" ry="40" fill="#22c55e" transform="rotate(-20 140 350)"/>
    <ellipse cx="360" cy="350" rx="55" ry="40" fill="#22c55e" transform="rotate(20 360 350)"/>
    <ellipse cx="110" cy="390" rx="35" ry="15" fill="#15803d"/>
    <ellipse cx="390" cy="390" rx="35" ry="15" fill="#15803d"/>
    <!-- Body -->
    <ellipse cx="250" cy="320" rx="100" ry="85" fill="#4ade80"/>
    <!-- Cream Belly -->
    <ellipse cx="250" cy="335" rx="65" ry="55" fill="#fef08a"/>
    <!-- Front Feet -->
    <ellipse cx="205" cy="385" rx="20" ry="12" fill="#22c55e"/>
    <ellipse cx="295" cy="385" rx="20" ry="12" fill="#22c55e"/>
    <!-- Bulging Eyes Socket -->
    <circle cx="180" cy="180" r="45" fill="#4ade80"/>
    <circle cx="320" cy="180" r="45" fill="#4ade80"/>
    <!-- Big Eyes -->
    <circle cx="180" cy="180" r="30" fill="#ffffff"/>
    <circle cx="320" cy="180" r="30" fill="#ffffff"/>
    <circle cx="185" cy="180" r="16" fill="#1e293b"/>
    <circle cx="315" cy="180" r="16" fill="#1e293b"/>
    <circle cx="180" cy="173" r="6" fill="#ffffff"/>
    <circle cx="310" cy="173" r="6" fill="#ffffff"/>
    <!-- Big Happy Smile -->
    <path d="M 180 250 Q 250 310 320 250" stroke="#166534" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Pink Cheeks -->
    <circle cx="170" cy="255" r="14" fill="#f43f5e" opacity="0.35"/>
    <circle cx="330" cy="255" r="14" fill="#f43f5e" opacity="0.35"/>
    <!-- Nostrils -->
    <circle cx="235" cy="230" r="3" fill="#166534"/>
    <circle cx="265" cy="230" r="3" fill="#166534"/>
  </g>
</svg>