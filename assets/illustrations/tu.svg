<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowTu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgTu)"/>
  <!-- Soil Mound with Fresh Sprout (泥土) -->
  <g filter="url(#shadowTu)">
    <!-- Soil Mound -->
    <ellipse cx="250" cy="380" rx="170" ry="70" fill="#78350f"/>
    <ellipse cx="250" cy="360" rx="130" ry="50" fill="#92400e"/>
    <!-- Fresh Green Seedling sprouting from soil -->
    <path d="M 250 360 Q 248 240 250 200" stroke="#22c55e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M 250 220 C 180 200 180 150 250 170 Z" fill="#4ade80" stroke="#16a34a" stroke-width="3"/>
    <!-- Right Leaf -->
    <path d="M 250 190 C 320 170 320 120 250 140 Z" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
    <!-- Sparkling dew drop -->
    <circle cx="215" cy="180" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>