<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGao" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadowGao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgGao)"/>
  <ellipse cx="250" cy="435" rx="170" ry="25" fill="#93c5fd" opacity="0.5"/>
  <g filter="url(#shadowGao)">
    <!-- Tall Soaring Peak -->
    <polygon points="250,80 110,420 390,420" fill="#0284c7"/>
    <!-- Shaded side -->
    <polygon points="250,80 250,420 390,420" fill="#0369a1"/>
    <!-- Snowcap -->
    <polygon points="250,80 200,190 225,180 250,200 275,180 300,190" fill="#ffffff"/>
    <!-- Clouds floating midway -->
    <ellipse cx="170" cy="260" rx="60" ry="24" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="320" cy="290" rx="70" ry="26" fill="#ffffff" opacity="0.85"/>
    <!-- Upward arrow indicator -->
    <polygon points="250,30 230,65 242,65 242,100 258,100 258,65 270,65" fill="#f59e0b"/>
  </g>
</svg>