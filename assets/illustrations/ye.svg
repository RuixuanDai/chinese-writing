<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <filter id="shadowYe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYe)"/>
  <g filter="url(#shadowYe)">
    <!-- Gracefully Curved Leaf Body -->
    <path d="M 120 410 C 90 250 180 110 380 90 C 400 290 280 430 120 410 Z" fill="url(#leafGrad)"/>
    <!-- Petiole / Stem -->
    <path d="M 120 410 Q 90 440 70 450" stroke="#15803d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Main Center Vein -->
    <path d="M 120 410 Q 250 250 380 90" stroke="#fef08a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Lateral Secondary Veins -->
    <path d="M 180 340 Q 240 320 280 340" stroke="#bbf7d0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 230 280 Q 290 250 340 270" stroke="#bbf7d0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 290 210 Q 330 180 370 200" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 190 320 Q 170 250 160 210" stroke="#bbf7d0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 250 250 Q 220 180 220 140" stroke="#bbf7d0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 310 170 Q 280 120 290 105" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Dewdrop on leaf -->
    <circle cx="300" cy="220" r="14" fill="#38bdf8" opacity="0.8"/>
    <circle cx="296" cy="216" r="4" fill="#ffffff"/>
  </g>
</svg>