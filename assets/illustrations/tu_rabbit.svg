  <circle cx="112" cy="96" r="4" fill="#e11d48"/><circle cx="111" cy="94.5" r="1.5" fill="#fff"/>
  <circle cx="80" cy="104" r="5" fill="#fda4af" opacity="0.65"/>
  <circle cx="120" cy="104" r="5" fill="#fda4af" opacity="0.65"/>
