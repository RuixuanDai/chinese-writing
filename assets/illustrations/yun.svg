<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgYun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadowYun" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYun)"/>
  <!-- Cheerful Smiling White Cloud (白云) -->
  <g filter="url(#shadowYun)">
    <path d="M 150 290 
             A 60 60 0 0 1 210 200 
             A 80 80 0 0 1 350 210 
             A 65 65 0 0 1 400 290 
             A 50 50 0 0 1 360 360 
             L 150 360 
             A 50 50 0 0 1 150 290 Z" 
          fill="#ffffff"/>
    <!-- Cute Eyes -->
    <circle cx="240" cy="285" r="5" fill="#0f172a"/>
    <circle cx="310" cy="285" r="5" fill="#0f172a"/>
    <circle cx="242" cy="283" r="1.8" fill="#ffffff"/>
    <circle cx="312" cy="283" r="1.8" fill="#ffffff"/>
    <!-- Rosy Cheeks -->
    <ellipse cx="220" cy="298" rx="10" ry="6" fill="#f43f5e" opacity="0.5"/>
    <ellipse cx="330" cy="298" rx="10" ry="6" fill="#f43f5e" opacity="0.5"/>
    <!-- Sweet Smile -->
    <path d="M 265 295 Q 275 306 285 295" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>