<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWang" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadowWang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgWang)"/>
  <!-- Starry Sky with Bright Full Moon -->
  <circle cx="370" cy="120" r="50" fill="#fef08a"/>
  <circle cx="350" cy="110" r="10" fill="#fde047" opacity="0.6"/>
  <circle cx="100" cy="80" r="4" fill="#ffffff"/>
  <circle cx="160" cy="130" r="5" fill="#facc15"/>
  <circle cx="240" cy="70" r="3" fill="#ffffff"/>
  <!-- Astronomical Telescope Genders upward toward moon (仰望) -->
  <g filter="url(#shadowWang)">
    <!-- Tripod Legs -->
    <line x1="200" y1="280" x2="130" y2="440" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="200" y2="440" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="270" y2="440" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Telescope Mount -->
    <circle cx="200" cy="280" r="16" fill="#f59e0b"/>
    <!-- Telescope Tube Angled up to Moon -->
    <polygon points="140,320 155,300 300,180 315,200" fill="#38bdf8"/>
    <!-- Lens Cap Rim -->
    <rect x="300" y="170" width="22" height="40" rx="4" fill="#0284c7" transform="rotate(-38 310 190)"/>
    <!-- Eyepiece -->
    <rect x="130" y="315" width="20" height="16" rx="4" fill="#0284c7" transform="rotate(-38 140 323)"/>
  </g>
</svg>