<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_num8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_num8)"/>

  <!-- Left Hand (5 fingers) -->
  <g transform="translate(22, 26)">
    <!-- Thumb extended left -->
    <rect x="2" y="34" width="13" height="26" rx="6.5" transform="rotate(-32 8 46)" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <!-- 4 fingers extended up -->
    <rect x="14" y="8" width="12" height="38" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="28" y="3" width="12" height="43" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="42" y="6" width="12" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="56" y="14" width="11" height="32" rx="5.5" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Palm -->
    <rect x="12" y="36" width="56" height="42" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Cuff -->
    <rect x="20" y="76" width="40" height="10" rx="5" fill="#3b82f6"/>
  </g>
  <!-- Right Hand (3 fingers up, thumb + 1 folded) -->
  <g transform="translate(106, 26)">
    <rect x="12" y="8" width="12" height="38" rx="6.0" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><rect x="26" y="3" width="12" height="43" rx="6.0" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><rect x="40" y="6" width="12" height="40" rx="6.0" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Palm -->
    <rect x="10" y="36" width="56" height="42" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Folded fingers -->
    <rect x="54" y="34" width="11" height="20" rx="5.5" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Folded thumb across palm -->
    <rect x="8" y="48" width="26" height="13" rx="6.5" transform="rotate(15 20 54)" fill="#fdba74" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Cuff -->
    <rect x="18" y="76" width="40" height="10" rx="5" fill="#3b82f6"/>
  </g>
  <rect x="26" y="124" width="148" height="58" rx="14" fill="#ffffff" opacity="0.92" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="52" cy="142" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="49" cy="139" r="2.5" fill="#fff" opacity="0.8"/><circle cx="76" cy="142" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="73" cy="139" r="2.5" fill="#fff" opacity="0.8"/><circle cx="100" cy="142" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="97" cy="139" r="2.5" fill="#fff" opacity="0.8"/><circle cx="124" cy="142" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="121" cy="139" r="2.5" fill="#fff" opacity="0.8"/><circle cx="148" cy="142" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="145" cy="139" r="2.5" fill="#fff" opacity="0.8"/><circle cx="52" cy="166" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="49" cy="163" r="2.5" fill="#fff" opacity="0.8"/><circle cx="76" cy="166" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="73" cy="163" r="2.5" fill="#fff" opacity="0.8"/><circle cx="100" cy="166" r="9" fill="#ea580c" stroke="#fff" stroke-width="2"/><circle cx="97" cy="163" r="2.5" fill="#fff" opacity="0.8"/>
