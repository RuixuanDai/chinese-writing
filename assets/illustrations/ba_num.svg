<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBaNum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowBaNum" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBaNum)"/>
  <g filter="url(#shadowBaNum)">
    <!-- 8 Golden Coins in a circle -->
    <g fill="#facc15" stroke="#ca8a04" stroke-width="4">
      <circle cx="250" cy="110" r="32"/>
      <circle cx="349" cy="151" r="32"/>
      <circle cx="390" cy="250" r="32"/>
      <circle cx="349" cy="349" r="32"/>
      <circle cx="250" cy="390" r="32"/>
      <circle cx="151" cy="349" r="32"/>
      <circle cx="110" cy="250" r="32"/>
      <circle cx="151" cy="151" r="32"/>
    </g>
    <!-- Square Holes in Coins -->
    <g fill="#fef3c7">
      <rect x="238" y="98" width="24" height="24" rx="3"/>
      <rect x="337" y="139" width="24" height="24" rx="3"/>
      <rect x="378" y="238" width="24" height="24" rx="3"/>
      <rect x="337" y="337" width="24" height="24" rx="3"/>
      <rect x="238" y="378" width="24" height="24" rx="3"/>
      <rect x="139" y="337" width="24" height="24" rx="3"/>
      <rect x="98" y="238" width="24" height="24" rx="3"/>
      <rect x="139" y="139" width="24" height="24" rx="3"/>
    </g>
    <!-- Center Number 8 -->
    <text x="250" y="278" font-family="'Arial Rounded MT Bold', sans-serif" font-size="95" font-weight="bold" fill="#ea580c" text-anchor="middle">8</text>
  </g>
</svg>