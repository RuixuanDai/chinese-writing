<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgShiRec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </radialGradient>
    <filter id="shadowShiRec" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0e7490" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShiRec)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#a5f3fc" opacity="0.6"/>
  <!-- Card with Hanzi -->
  <g filter="url(#shadowShiRec)">
    <rect x="100" y="110" width="260" height="260" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <text x="230" y="270" font-family="'KaiTi', serif" font-size="130" font-weight="bold" fill="#0284c7">字</text>
    <!-- Big Magnifying Glass focused on card -->
    <circle cx="260" cy="220" r="110" fill="#38bdf8" opacity="0.3" stroke="#f59e0b" stroke-width="16"/>
    <!-- Glass Highlight -->
    <path d="M 200 150 A 80 80 0 0 1 320 180" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Handle -->
    <polygon points="340,300 420,380 390,410 310,330" fill="#b45309"/>
  </g>
</svg>