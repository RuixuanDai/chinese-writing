<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_kan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_kan)"/>

  <!-- Child face on left -->
  <circle cx="72" cy="112" r="28" fill="#fed7aa"/>
  <path d="M44 106 Q72 72 100 106" fill="#451a03"/>
  <!-- Big bright eyes looking right -->
  <circle cx="66" cy="112" r="5.5" fill="#ffffff"/><circle cx="68" cy="112" r="3" fill="#1e293b"/>
  <circle cx="86" cy="112" r="5.5" fill="#ffffff"/><circle cx="88" cy="112" r="3" fill="#1e293b"/>
  <path d="M70 125 Q78 131 86 125" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 178 Q46 138 72 138 Q98 138 100 178 Z" fill="#3b82f6"/>
  <!-- Hand raised cleanly above forehead (手搭凉棚 = 看) -->
  <path d="M48 144 Q26 108 56 88 L94 88" fill="none" stroke="#fdba74" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dotted line of sight from eyes to colorful butterfly on right -->
  <line x1="102" y1="108" x2="144" y2="78" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5,5"/>
  <g transform="translate(156, 68)">
    <ellipse cx="-8" cy="-6" rx="10" ry="12" fill="#f43f5e"/>
    <ellipse cx="8" cy="-6" rx="10" ry="12" fill="#f43f5e"/>
    <ellipse cx="-6" cy="8" rx="7" ry="9" fill="#facc15"/>
    <ellipse cx="6" cy="8" rx="7" ry="9" fill="#facc15"/>
    <rect x="-2" y="-12" width="4" height="24" rx="2" fill="#1e293b"/>
  </g>

</svg>
