<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowKan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgKan)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#bfdbfe" opacity="0.6"/>
  <!-- Distant Birds in Sky -->
  <path d="M 120 120 Q 135 110 150 120 Q 165 110 180 120" stroke="#0284c7" stroke-width="4" fill="none"/>
  <path d="M 330 100 Q 345 90 360 100 Q 375 90 390 100" stroke="#0284c7" stroke-width="4" fill="none"/>
  <!-- Big Friendly Binoculars -->
  <g filter="url(#shadowKan)">
    <!-- Bridge connecting lenses -->
    <rect x="220" y="240" width="60" height="24" rx="6" fill="#475569"/>
    <!-- Left Barrel -->
    <rect x="130" y="190" width="90" height="150" rx="20" fill="#3b82f6"/>
    <circle cx="175" cy="330" r="50" fill="#1d4ed8"/>
    <circle cx="175" cy="330" r="38" fill="#38bdf8"/>
    <circle cx="160" cy="315" r="10" fill="#ffffff" opacity="0.8"/>
    <!-- Right Barrel -->
    <rect x="280" y="190" width="90" height="150" rx="20" fill="#3b82f6"/>
    <circle cx="325" cy="330" r="50" fill="#1d4ed8"/>
    <circle cx="325" cy="330" r="38" fill="#38bdf8"/>
    <circle cx="310" cy="315" r="10" fill="#ffffff" opacity="0.8"/>
    <!-- Focus Wheel -->
    <rect x="235" y="210" width="30" height="22" rx="4" fill="#f59e0b"/>
  </g>
</svg>