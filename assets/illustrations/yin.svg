<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadowYin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#475569" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYin)"/>
  <g filter="url(#shadowYin)">
    <!-- Hidden Sun Peeking from Behind Cloud -->
    <circle cx="190" cy="180" r="60" fill="#fde047"/>
    <!-- Big Cozy Overcast Clouds Layer -->
    <circle cx="210" cy="270" r="70" fill="#94a3b8"/>
    <circle cx="320" cy="270" r="75" fill="#94a3b8"/>
    <circle cx="270" cy="210" r="85" fill="#cbd5e1"/>
    <!-- Front Cloud Surface -->
    <ellipse cx="260" cy="290" rx="140" ry="60" fill="#e2e8f0"/>
    <circle cx="200" cy="265" r="60" fill="#f1f5f9"/>
    <circle cx="310" cy="265" r="65" fill="#f1f5f9"/>
    <circle cx="260" cy="215" r="70" fill="#ffffff"/>
  </g>
</svg>