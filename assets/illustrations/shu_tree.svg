    <circle cx="180" cy="160" r="11" fill="#ef4444"/>
    <circle cx="280" cy="165" r="11" fill="#ef4444"/>
    <circle cx="230" cy="220" r="11" fill="#ef4444"/>
    <circle cx="320" cy="210" r="11" fill="#ef4444"/>
    <!-- Foliage Highlights -->
    <circle cx="230" cy="120" r="25" fill="#86efac" opacity="0.4"/>
