<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowJian" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#166534" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJian)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#bbf7d0" opacity="0.6"/>
  <!-- Room Walls and Window -->
  <g filter="url(#shadowJian)">
    <rect x="100" y="100" width="300" height="300" rx="16" fill="#fef08a" stroke="#ca8a04" stroke-width="8"/>
    <!-- Window in between -->
    <rect x="150" y="140" width="200" height="180" rx="12" fill="#bae6fd"/>
    <!-- Outside view from window: rainbow and cloud -->
    <circle cx="250" cy="220" r="26" fill="#fbbf24"/>
    <ellipse cx="200" cy="240" rx="35" ry="18" fill="#ffffff" opacity="0.8"/>
    <!-- Window Frame -->
    <line x1="250" y1="140" x2="250" y2="320" stroke="#ca8a04" stroke-width="6"/>
    <line x1="150" y1="230" x2="350" y2="230" stroke="#ca8a04" stroke-width="6"/>
    <!-- Cozy plant pot on windowsill -->
    <rect x="220" y="320" width="60" height="40" rx="6" fill="#f97316"/>
    <circle cx="235" cy="305" r="16" fill="#22c55e"/>
    <circle cx="265" cy="305" r="16" fill="#16a34a"/>
    <circle cx="250" cy="290" r="18" fill="#4ade80"/>
  </g>
</svg>