<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </radialGradient>
    <filter id="shadowLing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0891b2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLing)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#a5f3fc" opacity="0.6"/>
  <!-- Clock Body -->
  <g filter="url(#shadowLing)">
    <circle cx="250" cy="250" r="160" fill="#06b6d4" stroke="#0891b2" stroke-width="12"/>
    <circle cx="250" cy="250" r="135" fill="#ffffff"/>
    <!-- Big 0 in center with cute eyes -->
    <ellipse cx="250" cy="250" rx="70" ry="95" fill="none" stroke="#0284c7" stroke-width="26"/>
    <circle cx="225" cy="235" r="10" fill="#0369a1"/>
    <circle cx="275" cy="235" r="10" fill="#0369a1"/>
    <circle cx="228" cy="232" r="3" fill="#ffffff"/>
    <circle cx="278" cy="232" r="3" fill="#ffffff"/>
    <path d="M 240 260 Q 250 270 260 260" stroke="#0369a1" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>