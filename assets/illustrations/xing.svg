<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glowXing" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#facc15" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXing)"/>
  <!-- Twinkling background stars -->
  <circle cx="80" cy="90" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="120" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="400" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="400" cy="380" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- Big Golden Star with cute smile (星星) -->
  <g filter="url(#glowXing)">
    <polygon points="250,90 285,190 395,190 305,255 340,360 250,295 160,360 195,255 105,190 215,190" fill="#facc15" stroke="#f59e0b" stroke-width="6"/>
    <!-- Cute Eyes -->
    <circle cx="225" cy="225" r="7" fill="#0f172a"/>
    <circle cx="275" cy="225" r="7" fill="#0f172a"/>
    <circle cx="223" cy="222" r="2.5" fill="#ffffff"/>
    <circle cx="273" cy="222" r="2.5" fill="#ffffff"/>
    <!-- Rosy Cheeks -->
    <ellipse cx="205" cy="245" rx="10" ry="6" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="295" cy="245" rx="10" ry="6" fill="#f43f5e" opacity="0.6"/>
    <!-- Sweet Smile -->
    <path d="M 238 245 Q 250 258 262 245" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>