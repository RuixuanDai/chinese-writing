<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLiStd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowLiStd" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLiStd)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#bfdbfe" opacity="0.6"/>
  <!-- Podium Stand -->
  <rect x="150" y="380" width="200" height="45" rx="10" fill="#3b82f6"/>
  <!-- Child Standing Tall and Upright (立正) -->
  <g filter="url(#shadowLiStd)">
    <!-- Head -->
    <circle cx="250" cy="140" r="45" fill="#fed7aa"/>
    <path d="M 210 130 C 210 80 290 80 290 130 C 275 115 225 115 210 130 Z" fill="#18181b"/>
    <circle cx="235" cy="140" r="5" fill="#18181b"/>
    <circle cx="265" cy="140" r="5" fill="#18181b"/>
    <path d="M 240 155 Q 250 162 260 155" stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Upright Body (Red Shirt) -->
    <rect x="210" y="185" width="80" height="110" rx="14" fill="#ef4444"/>
    <!-- Straight Arms at side -->
    <rect x="185" y="195" width="22" height="95" rx="10" fill="#ef4444"/>
    <circle cx="196" cy="300" r="11" fill="#fed7aa"/>
    <rect x="293" y="195" width="22" height="95" rx="10" fill="#ef4444"/>
    <circle cx="304" cy="300" r="11" fill="#fed7aa"/>
    <!-- Straight Legs (Navy Pants) -->
    <rect x="215" y="295" width="32" height="90" rx="8" fill="#1e293b"/>
    <rect x="253" y="295" width="32" height="90" rx="8" fill="#1e293b"/>
  </g>
</svg>