<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </radialGradient>
    <filter id="shadowLi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#86198f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLi)"/>
  <ellipse cx="250" cy="425" rx="180" ry="35" fill="#e9d5ff" opacity="0.6"/>
  <g filter="url(#shadowLi)">
    <!-- Striped Tail -->
    <path d="M 330 330 C 430 330 430 240 370 230" stroke="#71717a" stroke-width="32" stroke-linecap="round" fill="none"/>
    <path d="M 360 300 L 375 315" stroke="#27272a" stroke-width="12" stroke-linecap="round"/>
    <path d="M 390 270 L 405 285" stroke="#27272a" stroke-width="12" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="250" cy="320" rx="95" ry="90" fill="#a1a1aa"/>
    <ellipse cx="250" cy="335" rx="60" ry="60" fill="#f4f4f5"/>
    <!-- Paws -->
    <ellipse cx="195" cy="405" rx="25" ry="18" fill="#3f3f46"/>
    <ellipse cx="305" cy="405" rx="25" ry="18" fill="#3f3f46"/>
    <!-- Round Ears -->
    <circle cx="170" cy="145" r="28" fill="#52525b"/>
    <circle cx="170" cy="145" r="16" fill="#f4f4f5"/>
    <circle cx="330" cy="145" r="28" fill="#52525b"/>
    <circle cx="330" cy="145" r="16" fill="#f4f4f5"/>
    <!-- Head -->
    <ellipse cx="250" cy="205" rx="90" ry="75" fill="#d4d4d8"/>
    <!-- Tanuki Dark Eye Mask -->
    <ellipse cx="195" cy="200" rx="30" ry="22" fill="#3f3f46" transform="rotate(-15 195 200)"/>
    <ellipse cx="305" cy="200" rx="30" ry="22" fill="#3f3f46" transform="rotate(15 305 200)"/>
    <!-- White Eye Circles -->
    <circle cx="195" cy="200" r="15" fill="#ffffff"/>
    <circle cx="305" cy="200" r="15" fill="#ffffff"/>
    <circle cx="195" cy="200" r="9" fill="#18181b"/>
    <circle cx="305" cy="200" r="9" fill="#18181b"/>
    <circle cx="192" cy="196" r="3" fill="#ffffff"/>
    <circle cx="302" cy="196" r="3" fill="#ffffff"/>
    <!-- Snout & Nose -->
    <ellipse cx="250" cy="235" rx="30" ry="20" fill="#ffffff"/>
    <polygon points="250,225 240,215 260,215" fill="#18181b"/>
    <path d="M 242 235 Q 250 245 258 235" stroke="#18181b" stroke-width="2.5" fill="none"/>
    <!-- Cheeks -->
    <circle cx="180" cy="235" r="9" fill="#f43f5e" opacity="0.3"/>
    <circle cx="320" cy="235" r="9" fill="#f43f5e" opacity="0.3"/>
  </g>
</svg>