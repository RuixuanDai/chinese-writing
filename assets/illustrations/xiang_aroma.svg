<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiangAroma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowXiangAroma" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#d97706" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXiangAroma)"/>
  <ellipse cx="250" cy="425" rx="180" ry="35" fill="#fde68a" opacity="0.6"/>
  <!-- Aroma Swirl Lines -->
  <path d="M 180 160 Q 210 110 190 70 M 250 150 Q 280 100 250 60 M 320 160 Q 350 110 320 70" stroke="#ea580c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <g filter="url(#shadowXiangAroma)">
    <!-- Golden Crispy Bread Loaf / Croissant -->
    <ellipse cx="250" cy="310" rx="130" ry="75" fill="#d97706"/>
    <ellipse cx="250" cy="300" rx="115" ry="60" fill="#f59e0b"/>
    <!-- Crust cuts / slashes -->
    <ellipse cx="190" cy="285" rx="15" ry="35" fill="#b45309" transform="rotate(-25 190 285)"/>
    <ellipse cx="250" cy="280" rx="15" ry="35" fill="#b45309"/>
    <ellipse cx="310" cy="285" rx="15" ry="35" fill="#b45309" transform="rotate(25 310 285)"/>
    <!-- Sesame sprinkles -->
    <ellipse cx="220" cy="320" rx="2" ry="5" fill="#fffbeb" transform="rotate(30 220 320)"/>
    <ellipse cx="260" cy="325" rx="2" ry="5" fill="#fffbeb" transform="rotate(-20 260 325)"/>
    <ellipse cx="290" cy="315" rx="2" ry="5" fill="#fffbeb" transform="rotate(15 290 315)"/>
  </g>
</svg>