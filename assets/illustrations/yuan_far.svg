<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgYuan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadowYuan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#047857" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYuan)"/>
  <!-- Distant purple mountains -->
  <polygon points="350,170 230,300 470,300" fill="#a855f7" opacity="0.6"/>
  <polygon points="180,200 70,310 290,310" fill="#c084fc" opacity="0.6"/>
  <!-- Distant Lighthouse on hill -->
  <polygon points="350,150 340,220 360,220" fill="#ef4444"/>
  <circle cx="350" cy="145" r="10" fill="#fef08a"/>
  <!-- Light beam extending into the distance -->
  <polygon points="350,145 100,80 100,160" fill="#fef08a" opacity="0.35"/>
  <!-- Winding Path leading into the far distance -->
  <path d="M 80 470 Q 200 400 240 340 Q 260 300 345 220 L 355 220 Q 275 300 255 350 Q 220 410 160 470 Z" fill="#f59e0b"/>
</svg>