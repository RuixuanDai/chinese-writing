<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXia" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </radialGradient>
    <filter id="shadowXia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXia)"/>

  <!-- Brilliant Blazing Summer Sun (盛夏艳阳) -->
  <g transform="translate(130, 130)">
    <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-65" x2="0" y2="-90"/>
      <line x1="0" y1="65" x2="0" y2="90"/>
      <line x1="-65" y1="0" x2="-90" y2="0"/>
      <line x1="65" y1="0" x2="90" y2="0"/>
      <line x1="-46" y1="-46" x2="-65" y2="-65"/>
      <line x1="46" y1="46" x2="65" y2="65"/>
      <line x1="46" y1="-46" x2="65" y2="-65"/>
      <line x1="-46" y1="46" x2="-65" y2="65"/>
    </g>
    <!-- Sun wearing cool sunglasses (夏日阳光) -->
    <circle cx="0" cy="0" r="54" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
    <!-- Cool dark Sunglasses -->
    <path d="M -36 -12 C -36 8 -10 8 -8 -12 Z" fill="#0f172a"/>
    <path d="M 8 -12 C 10 8 36 8 36 -12 Z" fill="#0f172a"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#0f172a" stroke-width="5"/>
    <!-- Sunglass white reflection glints -->
    <line x1="-30" y1="-6" x2="-22" y2="2" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="-6" x2="22" y2="2" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Big joyful smile -->
    <path d="M -16 16 Q 0 32 16 16" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="-28" cy="16" r="6" fill="#f87171" opacity="0.6"/>
    <circle cx="28" cy="16" r="6" fill="#f87171" opacity="0.6"/>
  </g>

  <!-- Colorful Summer Beach Sun-Umbrella (遮阳伞) -->
  <g filter="url(#shadowXia)">
    <!-- Umbrella Pole -->
    <line x1="330" y1="200" x2="280" y2="430" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Umbrella Canopy Fan -->
    <!-- Segment 1 (Red) -->
    <path d="M 330 200 L 220 280 A 130 65 0 0 1 270 295 Z" fill="#ef4444"/>
    <!-- Segment 2 (Yellow) -->
    <path d="M 330 200 L 270 295 A 130 65 0 0 1 330 300 Z" fill="#facc15"/>
    <!-- Segment 3 (Cyan/Blue) -->
    <path d="M 330 200 L 330 300 A 130 65 0 0 1 390 295 Z" fill="#38bdf8"/>
    <!-- Segment 4 (Green) -->
    <path d="M 330 200 L 390 295 A 130 65 0 0 1 440 280 Z" fill="#4ade80"/>
    <!-- Scalloped rim -->
    <path d="M 220 280 Q 245 295 270 295 Q 300 305 330 300 Q 360 305 390 295 Q 415 295 440 280" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="330" cy="200" r="10" fill="#f59e0b"/>
  </g>

  <!-- Blooming Golden Sunflower (向日葵 / 夏日之花) -->
  <g transform="translate(130, 360)" filter="url(#shadowXia)">
    <!-- Stem & green leaves -->
    <path d="M 0 50 Q -5 90 -20 120" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M -8 80 Q -40 70 -50 95 Q -25 105 -12 88" fill="#22c55e"/>
    <!-- Petals -->
    <g fill="#f59e0b" stroke="#d97706" stroke-width="2">
      <ellipse cx="0" cy="-45" rx="14" ry="24"/>
      <ellipse cx="0" cy="45" rx="14" ry="24"/>
      <ellipse cx="-45" cy="0" rx="24" ry="14"/>
      <ellipse cx="45" cy="0" rx="24" ry="14"/>
      <ellipse cx="-32" cy="-32" rx="14" ry="24" transform="rotate(-45 -32 -32)"/>
      <ellipse cx="32" cy="32" rx="14" ry="24" transform="rotate(-45 32 32)"/>
      <ellipse cx="32" cy="-32" rx="14" ry="24" transform="rotate(45 32 -32)"/>
      <ellipse cx="-32" cy="32" rx="14" ry="24" transform="rotate(45 -32 32)"/>
    </g>
    <!-- Seed Center -->
    <circle cx="0" cy="0" r="32" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <circle cx="0" cy="0" r="26" fill="#92400e"/>
  </g>
</svg>