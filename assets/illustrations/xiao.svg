<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiao" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <filter id="softShadowXiao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="url(#bgXiao)"/>

  <!-- Tiny Cute Baby Chick (小鸡) -->
  <g filter="url(#softShadowXiao)">
    <!-- Body -->
    <ellipse cx="250" cy="270" rx="100" ry="110" fill="#facc15"/>

    <!-- Tiny Head Feathers -->
    <path d="M 245 160 Q 250 130 255 160" stroke="#eab308" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Tiny Fluffy Wings -->
    <ellipse cx="165" cy="285" rx="30" ry="40" fill="#eab308" transform="rotate(-15, 165, 285)"/>
    <ellipse cx="335" cy="285" rx="30" ry="40" fill="#eab308" transform="rotate(15, 335, 285)"/>

    <!-- Cute Big Sparkling Eyes -->
    <circle cx="215" cy="245" r="10" fill="#1e293b"/>
    <circle cx="285" cy="245" r="10" fill="#1e293b"/>
    <circle cx="212" cy="241" r="3.5" fill="#ffffff"/>
    <circle cx="282" cy="241" r="3.5" fill="#ffffff"/>

    <!-- Tiny Orange Beak -->
    <polygon points="250,265 240,255 260,255" fill="#f97316"/>

    <!-- Rosy Cheeks -->
    <circle cx="195" cy="265" r="9" fill="#f87171" opacity="0.6"/>
    <circle cx="305" cy="265" r="9" fill="#f87171" opacity="0.6"/>

    <!-- Tiny Feet -->
    <path d="M 220 375 L 220 405 M 210 405 L 230 405" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <path d="M 280 375 L 280 405 M 270 405 L 290 405" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Ground -->
  <ellipse cx="250" cy="425" rx="130" ry="14" fill="#fde047" opacity="0.6"/>
</svg>
