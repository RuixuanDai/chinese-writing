<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiong" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <filter id="shadowXiong" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXiong)"/>
  <!-- Cuddly Brown Bear (大熊) -->
  <g filter="url(#shadowXiong)">
    <!-- Round Ears -->
    <circle cx="180" cy="160" r="32" fill="#78350f"/>
    <circle cx="180" cy="160" r="18" fill="#d97706"/>
    <circle cx="320" cy="160" r="32" fill="#78350f"/>
    <circle cx="320" cy="160" r="18" fill="#d97706"/>
    <!-- Body -->
    <ellipse cx="250" cy="340" rx="100" ry="110" fill="#78350f"/>
    <ellipse cx="250" cy="355" rx="60" ry="70" fill="#fde68a" opacity="0.4"/>
    <!-- Head -->
    <circle cx="250" cy="225" r="80" fill="#78350f"/>
    <!-- Snout & Nose -->
    <ellipse cx="250" cy="245" rx="40" ry="30" fill="#fde68a"/>
    <ellipse cx="250" cy="235" rx="16" ry="10" fill="#0f172a"/>
    <path d="M 242 250 Q 250 258 258 250" stroke="#0f172a" stroke-width="3" fill="none"/>
    <!-- Eyes -->
    <circle cx="215" cy="210" r="7" fill="#0f172a"/>
    <circle cx="285" cy="210" r="7" fill="#0f172a"/>
    <circle cx="213" cy="208" r="2.5" fill="#ffffff"/>
    <circle cx="283" cy="208" r="2.5" fill="#ffffff"/>
  </g>
</svg>