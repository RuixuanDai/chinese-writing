<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYeGrandpa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowYeGrandpa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYeGrandpa)"/>
  <g filter="url(#shadowYeGrandpa)">
    <!-- Cheerful Vest & Shoulders -->
    <path d="M 130 440 C 130 330 370 330 370 440 Z" fill="#b45309"/>
    <polygon points="210,340 250,380 290,340" fill="#ffffff"/>
    <!-- Head -->
    <circle cx="250" cy="220" r="90" fill="#fed7aa"/>
    <!-- Silver White Hair around sides -->
    <circle cx="160" cy="200" r="28" fill="#f1f5f9"/>
    <circle cx="340" cy="200" r="28" fill="#f1f5f9"/>
    <!-- Cute White Mustache -->
    <path d="M 210 255 Q 235 245 250 260 Q 265 245 290 255 Q 250 280 210 255 Z" fill="#ffffff"/>
    <!-- Warm Smiling Crescent Eyes -->
    <path d="M 195 210 Q 215 195 230 210" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 270 210 Q 285 195 305 210" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Happy Cheeks -->
    <circle cx="180" cy="240" r="14" fill="#f43f5e" opacity="0.35"/>
    <circle cx="320" cy="240" r="14" fill="#f43f5e" opacity="0.35"/>
