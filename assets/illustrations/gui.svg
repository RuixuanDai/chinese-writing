<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGui" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </radialGradient>
    <filter id="shadowGui" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0e7490" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgGui)"/>
  <!-- Cute Green Turtle (乌龟) -->
  <g filter="url(#shadowGui)">
    <!-- 4 Flippers -->
    <ellipse cx="170" cy="210" rx="35" ry="20" fill="#4ade80" transform="rotate(-30, 170, 210)"/>
    <ellipse cx="330" cy="210" rx="35" ry="20" fill="#4ade80" transform="rotate(30, 330, 210)"/>
    <ellipse cx="180" cy="330" rx="30" ry="18" fill="#4ade80" transform="rotate(30, 180, 330)"/>
    <ellipse cx="320" cy="330" rx="30" ry="18" fill="#4ade80" transform="rotate(-30, 320, 330)"/>
    <!-- Head -->
    <circle cx="250" cy="160" r="40" fill="#4ade80"/>
    <circle cx="235" cy="150" r="5" fill="#0f172a"/>
    <circle cx="265" cy="150" r="5" fill="#0f172a"/>
    <circle cx="233" cy="148" r="1.5" fill="#ffffff"/>
    <circle cx="263" cy="148" r="1.5" fill="#ffffff"/>
    <path d="M 243 170 Q 250 176 257 170" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <!-- Round Shell -->
    <ellipse cx="250" cy="270" rx="100" ry="90" fill="#15803d" stroke="#166534" stroke-width="5"/>
    <ellipse cx="250" cy="270" rx="60" ry="50" fill="#22c55e"/>
    <circle cx="250" cy="270" r="25" fill="#86efac"/>
  </g>
</svg>