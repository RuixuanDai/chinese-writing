<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLiu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </radialGradient>
    <filter id="shadowLiu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLiu)"/>
  <g filter="url(#shadowLiu)">
    <!-- Strings gathered at bottom -->
    <path d="M 250 430 L 140 220 M 250 430 L 210 150 M 250 430 L 290 150 M 250 430 L 360 220 M 250 430 L 190 280 M 250 430 L 310 280" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="250" cy="430" r="10" fill="#e11d48"/>
    <!-- 6 Colorful Shiny Balloons -->
    <!-- 1. Red -->
    <ellipse cx="210" cy="140" rx="42" ry="52" fill="#ef4444"/>
    <ellipse cx="198" cy="125" rx="8" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 198 125)"/>
    <!-- 2. Orange -->
    <ellipse cx="290" cy="140" rx="42" ry="52" fill="#f97316"/>
    <ellipse cx="278" cy="125" rx="8" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 278 125)"/>
    <!-- 3. Yellow -->
    <ellipse cx="140" cy="210" rx="42" ry="52" fill="#facc15"/>
    <ellipse cx="128" cy="195" rx="8" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 128 195)"/>
    <!-- 4. Green -->
    <ellipse cx="360" cy="210" rx="42" ry="52" fill="#22c55e"/>
    <ellipse cx="348" cy="195" rx="8" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 348 195)"/>
    <!-- 5. Blue -->
    <ellipse cx="190" cy="280" rx="42" ry="52" fill="#3b82f6"/>
    <ellipse cx="178" cy="265" rx="8" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 178 265)"/>
    <!-- 6. Purple -->
    <ellipse cx="310" cy="280" rx="42" ry="52" fill="#a855f7"/>
    <ellipse cx="298" cy="265" rx="8" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 298 265)"/>
  </g>
</svg>