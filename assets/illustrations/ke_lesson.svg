<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="shadowKe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgKe)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#cbd5e1" opacity="0.6"/>
  <g filter="url(#shadowKe)">
    <!-- Classroom Blackboard Frame -->
    <rect x="80" y="110" width="340" height="240" rx="14" fill="#78350f"/>
    <!-- Green Board -->
    <rect x="95" y="125" width="310" height="210" rx="8" fill="#14532d"/>
    <!-- Blackboard Contents -->
    <text x="140" y="185" font-family="sans-serif" font-size="34" font-weight="bold" fill="#facc15">ABC</text>
    <text x="250" y="185" font-family="sans-serif" font-size="34" font-weight="bold" fill="#38bdf8">1 2 3</text>
    <text x="170" y="260" font-family="'KaiTi', serif" font-size="44" font-weight="bold" fill="#ffffff">上课啦</text>
    <!-- Chalk Tray -->
    <rect x="80" y="345" width="340" height="15" rx="4" fill="#92400e"/>
    <rect x="130" y="340" width="30" height="8" rx="2" fill="#ffffff"/>
    <rect x="170" y="340" width="30" height="8" rx="2" fill="#facc15"/>
    <!-- Red Apple on podium -->
    <circle cx="360" cy="335" r="22" fill="#ef4444"/>
    <path d="M 360 315 Q 365 300 375 305" stroke="#15803d" stroke-width="4" fill="none"/>
  </g>
</svg>