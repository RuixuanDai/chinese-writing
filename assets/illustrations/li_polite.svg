<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLiPol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </radialGradient>
    <filter id="shadowLiPol" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#86198f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLiPol)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#f5d0fe" opacity="0.6"/>
  <!-- Cute Boy Bowing with Cupped Hands (作揖施礼) -->
  <g filter="url(#shadowLiPol)">
    <!-- Child Head -->
    <circle cx="250" cy="180" r="55" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 195 170 C 195 110 305 110 305 170 C 290 150 210 150 195 170 Z" fill="#18181b"/>
    <!-- Smiling Eyes (Bowing respectfully) -->
    <path d="M 220 185 Q 230 195 240 185" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 260 185 Q 270 195 280 185" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="215" cy="195" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="285" cy="195" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <!-- Chinese Tang Suit (Red Robe) -->
    <path d="M 180 250 L 320 250 L 340 380 L 160 380 Z" fill="#ef4444"/>
    <!-- Cupped Hands together (拱手礼) -->
    <rect x="220" y="270" width="60" height="40" rx="16" fill="#fcd34d"/>
    <path d="M 180 250 Q 210 290 230 290" stroke="#dc2626" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 320 250 Q 290 290 270 290" stroke="#dc2626" stroke-width="24" stroke-linecap="round" fill="none"/>
  </g>
</svg>