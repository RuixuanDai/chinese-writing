<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Bottom booklet (green) -->
      <g transform="translate(104, 110) rotate(8)">
        <rect x="-46" y="-52" width="92" height="112" rx="8" fill="#10b981" stroke="#047857" stroke-width="2.5"/>
        <rect x="-42" y="-48" width="84" height="104" rx="5" fill="#ffffff"/>
        <rect x="-46" y="-52" width="84" height="108" rx="7" fill="#34d399" stroke="#047857" stroke-width="2.5"/>
      </g>
      <!-- Top booklet (amber/orange with traditional spine binding) -->
      <g transform="translate(94, 102) rotate(-6)">
        <rect x="-46" y="-54" width="92" height="114" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
        <rect x="-46" y="-54" width="84" height="110" rx="7" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
        <!-- Spine binding & stitched cords -->
        <rect x="-46" y="-54" width="16" height="110" rx="5" fill="#1e3a8a"/>
        <line x1="-46" y1="-34" x2="-26" y2="-34" stroke="#fef3c7" stroke-width="2.5"/><line x1="-46" y1="-12" x2="-26" y2="-12" stroke="#fef3c7" stroke-width="2.5"/><line x1="-46" y1="10" x2="-26" y2="10" stroke="#fef3c7" stroke-width="2.5"/><line x1="-46" y1="32" x2="-26" y2="32" stroke="#fef3c7" stroke-width="2.5"/>
        <!-- Clean cover label plaque (no text) -->
        <rect x="-14" y="-32" width="34" height="56" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
        <circle cx="3" cy="-4" r="9" fill="#fbbf24"/>
      </g>
    
</svg>