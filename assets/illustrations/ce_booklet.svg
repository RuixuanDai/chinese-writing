<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowCe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgCe)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fde68a" opacity="0.6"/>
  <!-- Bamboo Slips (Classical Chinese Ce 册) -->
  <g filter="url(#shadowCe)">
    <rect x="110" y="110" width="40" height="280" rx="6" fill="#ca8a04"/>
    <rect x="160" y="110" width="40" height="280" rx="6" fill="#d97706"/>
    <rect x="210" y="110" width="40" height="280" rx="6" fill="#ca8a04"/>
    <rect x="260" y="110" width="40" height="280" rx="6" fill="#d97706"/>
    <rect x="310" y="110" width="40" height="280" rx="6" fill="#ca8a04"/>
    <rect x="360" y="110" width="40" height="280" rx="6" fill="#d97706"/>
    <!-- Connecting Strings (Horizontal) -->
    <rect x="95" y="170" width="320" height="14" rx="4" fill="#dc2626"/>
    <rect x="95" y="320" width="320" height="14" rx="4" fill="#dc2626"/>
    <!-- Characters on Bamboo -->
    <line x1="130" y1="210" x2="130" y2="280" stroke="#451a03" stroke-width="4"/>
    <line x1="180" y1="210" x2="180" y2="280" stroke="#451a03" stroke-width="4"/>
    <line x1="230" y1="210" x2="230" y2="280" stroke="#451a03" stroke-width="4"/>
    <line x1="280" y1="210" x2="280" y2="280" stroke="#451a03" stroke-width="4"/>
    <line x1="330" y1="210" x2="330" y2="280" stroke="#451a03" stroke-width="4"/>
    <line x1="380" y1="210" x2="380" y2="280" stroke="#451a03" stroke-width="4"/>
  </g>
</svg>