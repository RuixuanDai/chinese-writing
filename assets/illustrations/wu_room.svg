<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWuRoom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadowWuRoom" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgWuRoom)"/>
  <g filter="url(#shadowWuRoom)">
    <!-- Cozy Wallpaper & Floor -->
    <rect x="90" y="90" width="320" height="320" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="6"/>
    <line x1="90" y1="330" x2="410" y2="330" stroke="#b45309" stroke-width="6"/>
    <!-- Window showing moon & stars -->
    <rect x="130" y="130" width="80" height="90" rx="8" fill="#1e1b4b"/>
    <circle cx="170" cy="165" r="14" fill="#fef08a"/>
    <!-- Bed with pillow and blanket -->
    <rect x="230" y="260" width="160" height="70" rx="10" fill="#38bdf8"/>
    <rect x="230" y="280" width="160" height="50" rx="6" fill="#ec4899"/>
    <ellipse cx="260" cy="275" rx="20" ry="12" fill="#ffffff"/>
    <!-- Nightstand & lamp -->
    <rect x="130" y="270" width="60" height="60" rx="6" fill="#d97706"/>
    <polygon points="160,220 140,260 180,260" fill="#facc15"/>
  </g>
</svg>