<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Cottage roof & room walls -->
      <polygon points="20,76 100,24 180,76" fill="#ef4444" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
      <rect x="34" y="74" width="132" height="96" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="4"/>
      <rect x="34" y="154" width="132" height="16" fill="#d97706"/>
      <!-- Window with sky & curtains -->
      <rect x="50" y="88" width="38" height="36" rx="4" fill="#bae6fd" stroke="#92400e" stroke-width="3"/>
      <line x1="69" y1="88" x2="69" y2="124" stroke="#92400e" stroke-width="2.5"/>
      <line x1="50" y1="106" x2="88" y2="106" stroke="#92400e" stroke-width="2.5"/>
      <!-- Cozy bed with headboard, pillow, and quilt -->
      <rect x="84" y="122" width="72" height="32" rx="4" fill="#fb7185" stroke="#be123c" stroke-width="2.5"/>
      <rect x="132" y="114" width="20" height="12" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="152" y="106" width="6" height="48" rx="3" fill="#92400e"/>
      <!-- Warm bedside lamp -->
      <rect x="54" y="138" width="18" height="16" fill="#b45309"/>
      <line x1="63" y1="128" x2="63" y2="138" stroke="#78350f" stroke-width="3"/>
      <polygon points="53,128 73,128 69,116 57,116" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    
</svg>