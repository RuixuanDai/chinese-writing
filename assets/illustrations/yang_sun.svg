<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYangSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="shadowYangSun" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYangSun)"/>
  <g filter="url(#shadowYangSun)">
    <!-- Sun Rays -->
    <g fill="#f59e0b">
      <polygon points="250,50 235,110 265,110"/>
      <polygon points="250,450 235,390 265,390"/>
      <polygon points="50,250 110,235 110,265"/>
      <polygon points="450,250 390,235 390,265"/>
      <polygon points="108,108 160,135 135,160"/>
      <polygon points="392,392 340,365 365,340"/>
      <polygon points="108,392 135,340 160,365"/>
      <polygon points="392,108 365,160 340,135"/>
    </g>
    <!-- Radiant Golden Sun Disc -->
    <circle cx="250" cy="250" r="120" fill="#facc15"/>
    <circle cx="250" cy="250" r="105" fill="#fef08a"/>
    <!-- Smiling Happy Eyes -->
    <ellipse cx="205" cy="235" rx="12" ry="16" fill="#78350f"/>
    <circle cx="202" cy="229" r="5" fill="#ffffff"/>
    <ellipse cx="295" cy="235" rx="12" ry="16" fill="#78350f"/>
    <circle cx="292" cy="229" r="5" fill="#ffffff"/>
    <!-- Rosy Cheeks -->
    <circle cx="185" cy="265" r="15" fill="#f43f5e" opacity="0.4"/>
    <circle cx="315" cy="265" r="15" fill="#f43f5e" opacity="0.4"/>
    <!-- Big Joyful Smile -->
    <path d="M 215 270 Q 250 310 285 270" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>