<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShang" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadowShang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShang)"/>
  <!-- Ladder / Steps leading UP -->
  <g filter="url(#shadowShang)">
    <!-- Wooden Steps -->
    <rect x="130" y="380" width="240" height="28" rx="8" fill="#d97706"/>
    <rect x="160" y="300" width="180" height="28" rx="8" fill="#f59e0b"/>
    <rect x="190" y="220" width="120" height="28" rx="8" fill="#fbbf24"/>
    <!-- Big Bold Arrow Pointing UP (向上) -->
    <path d="M 250 80 L 310 160 L 275 160 L 275 220 L 225 220 L 225 160 L 190 160 Z" fill="#10b981" stroke="#047857" stroke-width="4" stroke-linejoin="round"/>
    <!-- Golden Star at top -->
    <polygon points="250,55 258,72 277,72 262,83 268,101 250,90 232,101 238,83 223,72 242,72" fill="#facc15" stroke="#eab308" stroke-width="2"/>
  </g>
</svg>