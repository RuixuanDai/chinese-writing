      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Wooden steps -->
