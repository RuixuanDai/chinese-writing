<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_dong" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_dong)"/>

  <!-- Rising sun glow on the right (East) -->
  <circle cx="164" cy="100" r="26" fill="#facc15" opacity="0.85"/>
  <circle cx="164" cy="100" r="18" fill="#f97316" opacity="0.7"/>
  <!-- Compass dial -->
  <circle cx="92" cy="100" r="56" fill="#ffffff" stroke="#3b82f6" stroke-width="5"/>
  <circle cx="92" cy="100" r="48" fill="none" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Tick marks (No characters to avoid leaking answer) -->
  <line x1="92" y1="46" x2="92" y2="56" stroke="#94a3b8" stroke-width="3"/>
  <line x1="92" y1="144" x2="92" y2="154" stroke="#94a3b8" stroke-width="3"/>
  <line x1="38" y1="100" x2="48" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <line x1="136" y1="100" x2="148" y2="100" stroke="#ef4444" stroke-width="5"/>
  <!-- Needle: grey left, BRIGHT RED RIGHT (East) -->
  <polygon points="92,92 54,100 92,108" fill="#94a3b8"/>
  <polygon points="92,90 138,100 92,110" fill="#ef4444"/>
  <circle cx="92" cy="100" r="6" fill="#1e293b"/>
  <!-- Big red arrow pointing East (right) -->
  <polygon points="158,100 144,90 144,110" fill="#ef4444"/>

</svg>
