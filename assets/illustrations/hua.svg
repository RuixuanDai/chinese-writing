<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </radialGradient>
    <filter id="shadowHua" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHua)"/>
  <!-- Blooming Pink Flower (鲜花) -->
  <g filter="url(#shadowHua)">
    <!-- Stem & Leaves -->
    <path d="M 250 250 Q 240 370 250 430" stroke="#15803d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 245 350 C 170 330 160 280 245 320 Z" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
    <path d="M 250 320 C 330 300 340 250 250 290 Z" fill="#16a34a" stroke="#15803d" stroke-width="3"/>
    <!-- Petals -->
    <circle cx="250" cy="170" r="50" fill="#fda4af"/>
    <circle cx="310" cy="205" r="50" fill="#fda4af"/>
    <circle cx="295" cy="275" r="50" fill="#fda4af"/>
    <circle cx="205" cy="275" r="50" fill="#fda4af"/>
    <circle cx="190" cy="205" r="50" fill="#fda4af"/>
    <!-- Golden Center -->
    <circle cx="250" cy="225" r="42" fill="#facc15" stroke="#f59e0b" stroke-width="3"/>
    <!-- Smiling Face on Center -->
    <circle cx="236" cy="218" r="4" fill="#78350f"/>
    <circle cx="264" cy="218" r="4" fill="#78350f"/>
    <path d="M 243 232 Q 250 240 257 232" stroke="#78350f" stroke-width="2.5" fill="none"/>
  </g>
</svg>