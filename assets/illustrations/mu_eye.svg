<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowMu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgMu)"/>
  <g filter="url(#shadowMu)">
    <!-- Eye Outer Contour -->
    <path d="M 70 250 Q 250 110 430 250 Q 250 390 70 250 Z" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
    <!-- Beautiful Sparkling Iris -->
    <circle cx="250" cy="250" r="85" fill="#3b82f6"/>
    <circle cx="250" cy="250" r="75" fill="#1d4ed8"/>
    <!-- Pupil -->
    <circle cx="250" cy="250" r="45" fill="#0f172a"/>
    <!-- Eye Gleam Sparkles -->
    <circle cx="225" cy="225" r="22" fill="#ffffff"/>
    <circle cx="275" cy="275" r="10" fill="#ffffff"/>
    <!-- Eyelashes -->
    <path d="M 180 160 L 160 120 M 250 145 L 250 100 M 320 160 L 340 120" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>