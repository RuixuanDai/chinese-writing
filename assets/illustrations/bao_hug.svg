<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBaoH" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowBaoH" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#be123c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBaoH)"/>
  <ellipse cx="250" cy="450" rx="170" ry="24" fill="#fecdd3" opacity="0.6"/>

  <!-- Warm Human Hug: Parent & Child Embracing (温暖拥抱) -->
  <g filter="url(#shadowBaoH)">
    <!-- Floating Warm Hearts of Love -->
    <g fill="#f43f5e">
      <!-- Big center heart above -->
      <path d="M 250 85 C 250 70 230 70 230 85 C 230 100 250 115 250 125 C 250 115 270 100 270 85 C 270 70 250 70 250 85 Z" transform="scale(1.5) translate(-83 -30)"/>
      <!-- Smaller hearts -->
      <path d="M 120 160 C 120 150 105 150 105 160 C 105 170 120 180 120 188 C 120 180 135 170 135 160 C 135 150 120 150 120 160 Z"/>
      <path d="M 370 170 C 370 160 355 160 355 170 C 355 180 370 190 370 198 C 370 190 385 180 385 170 C 385 160 370 160 370 170 Z"/>
    </g>

    <!-- Parent Figure (Left, taller, gentle blue sweater) -->
    <path d="M 110 450 C 110 320 230 320 230 450 Z" fill="#3b82f6"/>
    <!-- Parent Head -->
    <circle cx="180" cy="220" r="62" fill="#fed7aa"/>
    <!-- Parent Hair -->
    <path d="M 125 210 C 120 130 240 130 235 210 C 220 165 145 165 125 210 Z" fill="#3b1f13"/>
    <!-- Parent Kind closed smiling eyes -->
    <path d="M 160 215 Q 172 205 184 215" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 170 235 Q 180 245 190 235" stroke="#be123c" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Child Figure (Right, smaller, cozy yellow/pink shirt) -->
    <path d="M 230 450 C 230 340 350 340 350 450 Z" fill="#fbbf24"/>
    <!-- Child Head leaning gently onto parent's shoulder -->
    <circle cx="280" cy="250" r="52" fill="#fed7aa"/>
    <!-- Child cute pigtails/hair -->
    <path d="M 235 240 C 230 175 330 175 325 240 C 315 200 250 200 235 240 Z" fill="#451a03"/>
    <circle cx="330" cy="245" r="16" fill="#451a03"/>
    <!-- Child closed blissful smiling eyes & rosy cheek -->
    <path d="M 265 248 Q 275 240 285 248" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="260" cy="260" r="10" fill="#fda4af" opacity="0.8"/>
    <path d="M 270 268 Q 278 276 286 268" stroke="#be123c" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Big Loving Arms Wrapping Around Each Other in a Tight Hug (双臂紧紧拥抱) -->
    <!-- Parent's long arm wrapping all the way around child's back -->
    <path d="M 135 340 C 160 380 270 410 330 360" stroke="#2563eb" stroke-width="36" stroke-linecap="round" fill="none"/>
    <circle cx="330" cy="360" r="20" fill="#fed7aa"/>
    <!-- Child's little arm wrapping around parent's neck -->
    <path d="M 290 350 C 270 330 200 310 180 330" stroke="#f59e0b" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="178" cy="330" r="15" fill="#fed7aa"/>
  </g>
</svg>