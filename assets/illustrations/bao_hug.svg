<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBao" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </radialGradient>
    <filter id="shadowBao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9a3412" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBao)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#fed7aa" opacity="0.6"/>
  <!-- Mother Bear Hugging Baby Bear warmly -->
  <g filter="url(#shadowBao)">
    <!-- Mother Bear Body -->
    <circle cx="220" cy="270" r="110" fill="#92400e"/>
    <!-- Mother Bear Ears & Head -->
    <circle cx="150" cy="140" r="26" fill="#78350f"/>
    <circle cx="230" cy="130" r="26" fill="#78350f"/>
    <circle cx="190" cy="180" r="70" fill="#92400e"/>
    <ellipse cx="170" cy="195" rx="25" ry="18" fill="#fed7aa"/>
    <ellipse cx="165" cy="190" rx="8" ry="6" fill="#451a03"/>
    <circle cx="185" cy="170" r="6" fill="#18181b"/>
    <!-- Baby Bear being Hugged in Arms -->
    <circle cx="280" cy="280" r="65" fill="#d97706"/>
    <circle cx="320" cy="220" r="18" fill="#b45309"/>
    <circle cx="270" cy="210" r="18" fill="#b45309"/>
    <circle cx="295" cy="240" r="45" fill="#d97706"/>
    <ellipse cx="305" cy="250" rx="16" ry="12" fill="#fde68a"/>
    <ellipse cx="310" cy="248" rx="5" ry="4" fill="#451a03"/>
    <circle cx="290" cy="235" r="4" fill="#18181b"/>
    <!-- Mother's Arm wrapping all around baby bear -->
    <path d="M 140 270 Q 200 370 330 330" stroke="#78350f" stroke-width="40" stroke-linecap="round" fill="none"/>
    <!-- Warm Hearts around them -->
    <path d="M 360 160 C 360 145 345 145 345 160 C 345 175 360 185 360 195 C 360 185 375 175 375 160 C 375 145 360 145 360 160 Z" fill="#ef4444"/>
  </g>
</svg>