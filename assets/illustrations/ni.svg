<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Big irregular brown mud puddle -->
      <ellipse cx="100" cy="148" rx="74" ry="26" fill="#78350f"/>
      <ellipse cx="96" cy="146" rx="58" ry="18" fill="#92400e"/>
      <!-- Mud splashes & flying droplets -->
      <path d="M44 138 Q30 116 24 122 M156 138 Q170 114 176 120" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="30" cy="108" r="5.5" fill="#78350f"/>
      <circle cx="168" cy="104" r="6" fill="#78350f"/>
      <circle cx="52" cy="100" r="4" fill="#92400e"/>
      <circle cx="148" cy="96" r="4.5" fill="#92400e"/>
      <!-- Pair of cute yellow rainboots splashing in mud -->
      <g transform="translate(68, 72)">
        <rect x="0" y="0" width="22" height="54" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
        <rect x="-2" y="0" width="26" height="8" rx="4" fill="#ef4444"/>
        <path d="M0 44 L22 44 L22 62 L-12 62 Q-16 50 0 44 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
        <!-- Mud spots on boot -->
        <circle cx="8" cy="54" r="3.5" fill="#78350f"/>
      </g>
      <g transform="translate(108, 68)">
        <rect x="0" y="0" width="22" height="56" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
        <rect x="-2" y="0" width="26" height="8" rx="4" fill="#ef4444"/>
        <path d="M0 46 L22 46 L34 64 L0 64 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
        <circle cx="16" cy="56" r="4" fill="#78350f"/>
      </g>
      <!-- Mud ripple ring over boot soles -->
      <path d="M52 142 Q100 156 148 142" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    
</svg>