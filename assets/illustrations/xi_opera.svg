<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiOpera" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <filter id="shadowXiOpera" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXiOpera)"/>
  <g filter="url(#shadowXiOpera)">
    <!-- Peking Opera Mask Oval -->
    <ellipse cx="250" cy="250" rx="140" ry="170" fill="#dc2626"/>
    <!-- White Eye Patches -->
    <ellipse cx="190" cy="220" rx="40" ry="50" fill="#ffffff" transform="rotate(-15 190 220)"/>
    <ellipse cx="310" cy="220" rx="40" ry="50" fill="#ffffff" transform="rotate(15 310 220)"/>
    <!-- Black Eyebrows and Eye lines -->
    <ellipse cx="190" cy="225" rx="18" ry="18" fill="#1e293b"/>
    <circle cx="185" cy="220" r="5" fill="#ffffff"/>
    <ellipse cx="310" cy="225" rx="18" ry="18" fill="#1e293b"/>
    <circle cx="305" cy="220" r="5" fill="#ffffff"/>
    <!-- Black arched heroic eyebrows -->
    <path d="M 140 180 Q 200 130 240 170" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 360 180 Q 300 130 260 170" stroke="#1e293b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Forehead decoration & beard -->
    <polygon points="250,110 235,160 265,160" fill="#facc15"/>
    <path d="M 220 330 Q 250 360 280 330" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</svg>