<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowMian" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgMian)"/>
  <ellipse cx="250" cy="430" rx="180" ry="35" fill="#fecdd3" opacity="0.6"/>
  <!-- Steam clouds -->
  <path d="M 210 130 Q 230 100 210 70 M 250 140 Q 270 110 250 80 M 290 130 Q 310 100 290 70" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <g filter="url(#shadowMian)">
    <!-- Ceramic Bowl -->
    <path d="M 110 260 C 110 400 390 400 390 260 Z" fill="#ef4444"/>
    <ellipse cx="250" cy="260" rx="140" ry="40" fill="#dc2626"/>
    <!-- Bowl decorative white rim -->
    <path d="M 120 265 Q 250 295 380 265" stroke="#ffffff" stroke-width="6" fill="none"/>
    <!-- Delicious Broth -->
    <ellipse cx="250" cy="260" rx="130" ry="32" fill="#f59e0b"/>
    <!-- Swirling Noodles in bowl -->
    <path d="M 160 260 Q 200 240 240 265 Q 280 290 320 260" stroke="#fef08a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 180 270 Q 220 285 260 255 Q 300 245 340 270" stroke="#fef08a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Soft Boiled Egg Half -->
    <ellipse cx="210" cy="255" rx="25" ry="18" fill="#ffffff"/>
    <circle cx="210" cy="255" r="11" fill="#f97316"/>
    <!-- Green Veggie & Scallions -->
    <ellipse cx="290" cy="260" rx="22" ry="12" fill="#22c55e" transform="rotate(-15 290 260)"/>
    <circle cx="250" cy="275" r="5" fill="#15803d"/>
    <circle cx="270" cy="270" r="5" fill="#15803d"/>
    <!-- Chopsticks Lifting Noodles -->
    <line x1="220" y1="120" x2="380" y2="100" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <line x1="210" y1="130" x2="380" y2="115" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <!-- Noodles hanging from chopsticks -->
    <path d="M 230 130 Q 230 200 240 260 M 245 125 Q 260 190 255 260 M 260 120 Q 275 180 270 260" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>