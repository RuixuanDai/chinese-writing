<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowXin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXin)"/>
  <!-- Glowing Warm Heart (爱心) -->
  <g filter="url(#shadowXin)">
    <path d="M 250 160 C 210 90 120 100 120 200 C 120 280 210 360 250 400 C 290 360 380 280 380 200 C 380 100 290 90 250 160 Z" fill="#f43f5e" stroke="#e11d48" stroke-width="4"/>
    <ellipse cx="180" cy="180" rx="20" ry="40" fill="#ffffff" opacity="0.4" transform="rotate(-35, 180, 180)"/>
  </g>
</svg>