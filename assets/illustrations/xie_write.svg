<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowXie" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXie)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fde68a" opacity="0.6"/>
  <g filter="url(#shadowXie)">
    <!-- Paper Sheet -->
    <rect x="90" y="110" width="320" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <!-- Red Rice-grid (Mi Zi Ge) -->
    <rect x="140" y="150" width="160" height="160" fill="none" stroke="#fca5a5" stroke-width="3"/>
    <line x1="220" y1="150" x2="220" y2="310" stroke="#fca5a5" stroke-dasharray="4,4" stroke-width="2"/>
    <line x1="140" y1="230" x2="300" y2="230" stroke="#fca5a5" stroke-dasharray="4,4" stroke-width="2"/>
    <line x1="140" y1="150" x2="300" y2="310" stroke="#fca5a5" stroke-dasharray="4,4" stroke-width="1.5"/>
    <line x1="300" y1="150" x2="140" y2="310" stroke="#fca5a5" stroke-dasharray="4,4" stroke-width="1.5"/>
    <!-- Ink Stroke Written -->
    <path d="M 170 230 Q 220 220 270 230" stroke="#18181b" stroke-width="14" stroke-linecap="round"/>
    <!-- Calligraphy Brush writing -->
    <polygon points="270,225 350,110 370,125 285,235" fill="#92400e"/>
    <polygon points="350,110 390,55 405,65 370,125" fill="#b45309"/>
    <polygon points="270,225 285,235 260,245" fill="#18181b"/>
  </g>
</svg>