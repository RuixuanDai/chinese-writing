<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLv" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowLv" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#16a34a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLv)"/>
  <!-- Vibrant Green Four-Leaf Clover (绿色) -->
  <g filter="url(#shadowLv)">
    <path d="M 250 250 Q 240 380 230 420" stroke="#15803d" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- 4 Heart-shaped Clover Leaves -->
    <path d="M 250 250 C 210 150 290 150 250 250 Z" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <circle cx="230" cy="170" r="30" fill="#22c55e"/>
    <circle cx="270" cy="170" r="30" fill="#22c55e"/>

    <path d="M 250 250 C 350 210 350 290 250 250 Z" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <circle cx="330" cy="230" r="30" fill="#16a34a"/>
    <circle cx="330" cy="270" r="30" fill="#16a34a"/>

    <path d="M 250 250 C 290 350 210 350 250 250 Z" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <circle cx="270" cy="330" r="30" fill="#22c55e"/>
    <circle cx="230" cy="330" r="30" fill="#22c55e"/>

    <path d="M 250 250 C 150 290 150 210 250 250 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <circle cx="170" cy="270" r="30" fill="#4ade80"/>
    <circle cx="170" cy="230" r="30" fill="#4ade80"/>
    <!-- Dew drop -->
    <circle cx="260" cy="180" r="6" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>