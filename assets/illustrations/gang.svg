<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Blue harbor water -->
      <rect x="0" y="108" width="200" height="92" fill="#0284c7"/>
      <!-- Red-and-white lighthouse on right breakwater -->
      <polygon points="154,114 160,52 172,52 178,114" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <rect x="157" y="68" width="18" height="12" fill="#ef4444"/>
      <rect x="155" y="92" width="22" height="12" fill="#ef4444"/>
      <polygon points="158,52 166,40 174,52" fill="#dc2626"/>
      <polygon points="158,48 112,38 112,58" fill="#fef08a" opacity="0.55"/>
      <!-- Cargo/passenger ship moored in harbor -->
      <rect x="58" y="84" width="46" height="18" rx="3" fill="#ffffff" stroke="#475569" stroke-width="2"/>
      <rect x="74" y="70" width="14" height="14" fill="#f97316"/>
