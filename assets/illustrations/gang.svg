      <line x1="52" y1="112" x2="110" y2="112" stroke="#ef4444" stroke-width="4"/>
      <!-- Foreground stone harbor pier & mooring bollard -->
      <rect x="0" y="138" width="136" height="24" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
      <rect x="98" y="126" width="12" height="14" rx="3" fill="#334155"/>
      <path d="M58 108 Q80 132 104 130" fill="none" stroke="#fde047" stroke-width="2.8"/>
    
