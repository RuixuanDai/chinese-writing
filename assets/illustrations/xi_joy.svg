<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiJoy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <filter id="shadowXiJoy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXiJoy)"/>
  <g filter="url(#shadowXiJoy)">
    <!-- Red Festive Medallion -->
    <circle cx="250" cy="250" r="150" fill="#dc2626"/>
    <circle cx="250" cy="250" r="135" fill="none" stroke="#facc15" stroke-width="6"/>
    <!-- Golden Character "囍" / "喜" -->
    <text x="250" y="295" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="140" font-weight="bold" fill="#fef08a" text-anchor="middle">喜</text>
  </g>
</svg>