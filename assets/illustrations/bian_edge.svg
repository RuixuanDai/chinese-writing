<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_bian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_bian)"/>

  <!-- Blue water on left, green lawn on right -->
  <path d="M0 0 L92 0 Q128 100 84 200 L0 200 Z" fill="#38bdf8"/>
  <!-- Golden stone shoreline / bank edge (河边/岸边) -->
  <path d="M92 0 Q128 100 84 200" fill="none" stroke="#f59e0b" stroke-width="14"/>
  <path d="M92 0 Q128 100 84 200" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="7,5"/>
  <!-- Red arrow pointing directly to the edge -->
  <path d="M156 96 L118 96" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <polygon points="110,96 124,86 124,106" fill="#ef4444"/>
  <!-- Cute flower growing right on the edge -->
  <line x1="106" y1="138" x2="106" y2="116" stroke="#15803d" stroke-width="3.5"/>
  <circle cx="106" cy="112" r="8" fill="#f43f5e"/>
  <circle cx="106" cy="112" r="3.5" fill="#fde047"/>

</svg>
