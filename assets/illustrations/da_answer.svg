<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowDa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDa)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#bbf7d0" opacity="0.6"/>
  <g filter="url(#shadowDa)">
    <!-- Quiz Card in background -->
    <rect x="110" y="100" width="280" height="280" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="150" y1="160" x2="250" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="200" x2="350" y2="200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <!-- Bright Green Stamp "Correct Answer" -->
    <circle cx="280" cy="270" r="65" fill="#22c55e" stroke="#16a34a" stroke-width="6"/>
    <path d="M 245 270 L 270 295 L 320 240" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>