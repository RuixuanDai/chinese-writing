<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgShan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowShan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#be123c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShan)"/>
  <ellipse cx="250" cy="435" rx="160" ry="24" fill="#fecdd3" opacity="0.6"/>
  <g filter="url(#shadowShan)">
    <!-- Big Glowing Red/Pink Heart in Center -->
    <path d="M 250 160 C 250 100 160 100 160 180 C 160 250 250 300 250 330 C 250 300 340 250 340 180 C 340 100 250 100 250 160 Z" fill="#f43f5e"/>
    <!-- Gentle Caring Hands Supporting Below -->
    <path d="M 120 380 Q 180 320 230 350 Q 250 365 210 400 L 120 400 Z" fill="#fcd34d"/>
    <path d="M 380 380 Q 320 320 270 350 Q 250 365 290 400 L 380 400 Z" fill="#fcd34d"/>
    <!-- White Peace Dove in Heart -->
    <circle cx="250" cy="200" r="22" fill="#ffffff"/>
    <path d="M 230 200 Q 180 180 200 230 Q 230 215 250 220 Z" fill="#ffffff"/>
    <path d="M 270 200 Q 320 180 300 230 Q 270 215 250 220 Z" fill="#ffffff"/>
    <!-- Golden Sparkles -->
    <circle cx="160" cy="120" r="8" fill="#facc15"/>
    <circle cx="340" cy="120" r="8" fill="#facc15"/>
  </g>
</svg>