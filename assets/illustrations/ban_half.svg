<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </radialGradient>
    <filter id="shadowBan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#86198f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBan)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#f5d0fe" opacity="0.6"/>
  <g filter="url(#shadowBan)">
    <!-- Half Watermelon (Semicircle) -->
    <!-- Green Rind -->
    <path d="M 90 240 A 160 160 0 0 0 410 240 Z" fill="#15803d"/>
    <!-- Light Green Inner Rind -->
    <path d="M 105 240 A 145 145 0 0 0 395 240 Z" fill="#bbf7d0"/>
    <!-- Red Sweet Flesh -->
    <path d="M 120 240 A 130 130 0 0 0 380 240 Z" fill="#ef4444"/>
    <!-- Seeds -->
    <ellipse cx="200" cy="280" rx="6" ry="10" fill="#18181b" transform="rotate(-20 200 280)"/>
    <ellipse cx="250" cy="300" rx="6" ry="10" fill="#18181b"/>
    <ellipse cx="300" cy="280" rx="6" ry="10" fill="#18181b" transform="rotate(20 300 280)"/>
    <ellipse cx="170" cy="255" rx="5" ry="9" fill="#18181b" transform="rotate(-30 170 255)"/>
    <ellipse cx="330" cy="255" rx="5" ry="9" fill="#18181b" transform="rotate(30 330 255)"/>
    <ellipse cx="225" cy="330" rx="5" ry="9" fill="#18181b" transform="rotate(-15 225 330)"/>
    <ellipse cx="275" cy="330" rx="5" ry="9" fill="#18181b" transform="rotate(15 275 330)"/>
  </g>
</svg>