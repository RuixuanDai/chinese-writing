<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_yuan_yd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_yuan_yd)"/>

  <!-- Tree & house roof inside the courtyard -->
  <circle cx="56" cy="66" r="24" fill="#22c55e"/>
  <rect x="52" y="84" width="8" height="28" fill="#78350f"/>
  <polygon points="118,52 78,86 158,86" fill="#475569"/>
  <rect x="88" y="86" width="60" height="32" fill="#f8fafc"/>
  <!-- Courtyard enclosing wall (院墙) with grey tiled top -->
  <rect x="24" y="106" width="152" height="54" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <rect x="20" y="100" width="160" height="8" rx="3" fill="#334155"/>
  <!-- Wooden courtyard double gate in center -->
  <rect x="80" y="114" width="40" height="46" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2.5"/>
  <line x1="100" y1="114" x2="100" y2="160" stroke="#78350f" stroke-width="2"/>
  <circle cx="94" cy="136" r="3" fill="#facc15"/><circle cx="106" cy="136" r="3" fill="#facc15"/>
  <!-- Stepping stones leading out of courtyard gate -->
  <ellipse cx="100" cy="170" rx="14" ry="5" fill="#94a3b8"/>
  <ellipse cx="100" cy="182" rx="16" ry="5" fill="#94a3b8"/>

</svg>
