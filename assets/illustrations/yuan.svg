<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYuan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="shadowYuan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYuan)"/>
  <g filter="url(#shadowYuan)">
    <!-- White Courtyard Wall with Grey Tile Roof -->
    <rect x="90" y="220" width="320" height="180" fill="#f8fafc"/>
    <path d="M 80 220 L 420 220 L 400 200 L 100 200 Z" fill="#475569"/>
    <!-- Moon Gate (月亮门) -->
    <circle cx="250" cy="330" r="75" fill="#22c55e"/>
    <path d="M 175 330 A 75 75 0 0 1 325 330 L 325 400 L 175 400 Z" fill="#bbf7d0"/>
    <!-- Stone path leading through gate -->
    <ellipse cx="250" cy="385" rx="30" ry="12" fill="#94a3b8"/>
    <!-- Flowering Tree Branch peeking over wall -->
    <path d="M 130 200 Q 150 140 180 120" stroke="#78350f" stroke-width="6" fill="none"/>
    <circle cx="160" cy="140" r="12" fill="#f472b6"/>
    <circle cx="180" cy="120" r="14" fill="#f472b6"/>
    <circle cx="200" cy="130" r="10" fill="#f472b6"/>
  </g>
</svg>