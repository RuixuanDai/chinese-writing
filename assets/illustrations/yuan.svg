<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Blooming tree & house roof peeking inside the courtyard -->
      <polygon points="62,74 100,48 138,74" fill="#64748b"/>
      <rect x="74" y="74" width="52" height="32" fill="#f8fafc"/>
      <path d="M52 104 Q48 72 68 62" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="56" cy="66" r="14" fill="#f9a8d4"/><circle cx="70" cy="58" r="11" fill="#f472b6"/>
      <!-- White courtyard wall with grey roof tiles -->
      <rect x="20" y="96" width="160" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <rect x="16" y="90" width="168" height="9" rx="4" fill="#475569"/>
      <!-- Open double red-brown courtyard gate -->
      <rect x="74" y="104" width="52" height="50" fill="#dcfce7"/>
      <rect x="72" y="104" width="16" height="50" fill="#b45309" stroke="#78350f" stroke-width="2"/>
      <rect x="112" y="104" width="16" height="50" fill="#b45309" stroke="#78350f" stroke-width="2"/>
      <circle cx="83" cy="128" r="2.2" fill="#facc15"/><circle cx="117" cy="128" r="2.2" fill="#facc15"/>
      <!-- Stepping stone path leading out -->
      <ellipse cx="100" cy="164" rx="14" ry="5" fill="#94a3b8"/>
      <ellipse cx="100" cy="178" rx="18" ry="6" fill="#94a3b8"/>
    
</svg>