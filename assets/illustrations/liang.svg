<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLiang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowLiang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#d97706" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLiang)"/>
  <ellipse cx="250" cy="430" rx="180" ry="35" fill="#fde68a" opacity="0.6"/>
  <g filter="url(#shadowLiang)">
    <!-- Burlap Sack Body -->
    <path d="M 140 220 C 110 330 130 420 250 420 C 370 420 390 330 360 220 Z" fill="#d97706"/>
    <!-- Tied Neck of the Sack -->
    <ellipse cx="250" cy="210" rx="75" ry="25" fill="#b45309"/>
    <path d="M 200 200 Q 250 225 300 200" stroke="#fef08a" stroke-width="12" fill="none"/>
    <!-- Sack Top Ruffles -->
    <polygon points="180,180 200,205 220,175 250,205 280,175 300,205 320,180 250,210" fill="#b45309"/>
    <!-- Chinese Character "粮" Badge on sack -->
    <circle cx="250" cy="320" r="45" fill="#ef4444"/>
    <text x="250" y="338" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="50" font-weight="bold" fill="#fef08a" text-anchor="middle">粮</text>
    <!-- Spilled Golden Grains at base -->
    <circle cx="160" cy="415" r="5" fill="#facc15"/>
    <circle cx="180" cy="425" r="6" fill="#facc15"/>
    <circle cx="330" cy="420" r="5" fill="#facc15"/>
    <circle cx="350" cy="415" r="6" fill="#facc15"/>
  </g>
</svg>