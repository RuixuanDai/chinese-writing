<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowCat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgCat)"/>
  <!-- Cute Orange Tabby Cat (小猫) -->
  <g filter="url(#shadowCat)">
    <!-- Pointy Ears -->
    <polygon points="180,180 150,110 220,150" fill="#f97316"/>
    <polygon points="175,170 160,130 205,155" fill="#fda4af"/>
    <polygon points="320,180 350,110 280,150" fill="#f97316"/>
    <polygon points="325,170 340,130 295,155" fill="#fda4af"/>
    <!-- Cat Head -->
    <circle cx="250" cy="220" r="80" fill="#fb923c"/>
    <!-- Cat Body -->
    <ellipse cx="250" cy="340" rx="80" ry="85" fill="#fb923c"/>
    <ellipse cx="250" cy="350" rx="50" ry="60" fill="#ffedd5"/>
    <!-- Eyes -->
    <circle cx="215" cy="210" r="9" fill="#15803d"/>
    <circle cx="285" cy="210" r="9" fill="#15803d"/>
    <circle cx="213" cy="207" r="3" fill="#ffffff"/>
    <circle cx="283" cy="207" r="3" fill="#ffffff"/>
    <!-- Nose & Mouth -->
    <polygon points="250,230 244,224 256,224" fill="#f43f5e"/>
    <path d="M 242 235 Q 250 242 258 235" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <!-- Whiskers -->
    <line x1="160" y1="225" x2="200" y2="230" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="245" x2="200" y2="240" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="225" x2="300" y2="230" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="245" x2="300" y2="240" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>