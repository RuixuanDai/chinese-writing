<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="shadowSi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgSi)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fef08a" opacity="0.6"/>
  <!-- Glowing Idea Lightbulb -->
  <g filter="url(#shadowSi)">
    <!-- Rays -->
    <line x1="250" y1="60" x2="250" y2="95" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="110" x2="165" y2="135" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <line x1="360" y1="110" x2="335" y2="135" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="210" x2="135" y2="210" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <line x1="400" y1="210" x2="365" y2="210" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Bulb Glass -->
    <path d="M 180 250 C 140 180 180 120 250 120 C 320 120 360 180 320 250 C 310 270 295 285 295 310 L 205 310 C 205 285 190 270 180 250 Z" fill="url(#bulbGlow)"/>
    <!-- Filament -->
    <path d="M 230 250 L 230 200 L 245 220 L 255 220 L 270 200 L 270 250" stroke="#ea580c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Screw Base -->
    <rect x="215" y="310" width="70" height="14" rx="4" fill="#94a3b8"/>
    <rect x="220" y="328" width="60" height="14" rx="4" fill="#94a3b8"/>
    <ellipse cx="250" cy="346" rx="20" ry="8" fill="#475569"/>
  </g>
</svg>