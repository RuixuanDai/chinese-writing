<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowZhu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#f43f5e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhu)"/>
  <!-- Cute Pink Piglet (小猪) -->
  <g filter="url(#shadowZhu)">
    <!-- Legs -->
    <rect x="180" y="330" width="22" height="70" rx="10" fill="#f43f5e"/>
    <rect x="230" y="335" width="22" height="65" rx="10" fill="#fda4af"/>
    <rect x="280" y="330" width="22" height="70" rx="10" fill="#f43f5e"/>
    <rect x="330" y="335" width="22" height="65" rx="10" fill="#fda4af"/>
    <!-- Body -->
    <ellipse cx="270" cy="285" rx="110" ry="90" fill="#fbcfe8"/>
    <!-- Curly Tail -->
    <path d="M 375 270 Q 410 250 405 275 Q 400 295 425 285" stroke="#f43f5e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="175" cy="245" r="70" fill="#fbcfe8"/>
    <!-- Ears -->
    <polygon points="140,190 120,135 170,170" fill="#f43f5e"/>
    <polygon points="205,190 220,135 180,170" fill="#f43f5e"/>
    <!-- Snout (大鼻孔) -->
    <ellipse cx="140" cy="260" rx="30" ry="22" fill="#f43f5e"/>
    <ellipse cx="130" cy="260" rx="6" ry="9" fill="#881337"/>
    <ellipse cx="150" cy="260" rx="6" ry="9" fill="#881337"/>
    <!-- Eyes -->
    <circle cx="150" cy="220" r="6" fill="#0f172a"/>
    <circle cx="190" cy="220" r="6" fill="#0f172a"/>
    <circle cx="148" cy="218" r="2" fill="#ffffff"/>
    <circle cx="188" cy="218" r="2" fill="#ffffff"/>
    <circle cx="195" cy="245" r="8" fill="#fb7185" opacity="0.6"/>
  </g>
</svg>