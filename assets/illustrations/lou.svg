<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLou" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowLou" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLou)"/>
  <g filter="url(#shadowLou)">
    <!-- Tall Skyscraper Building -->
    <rect x="160" y="90" width="180" height="340" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="6"/>
    <!-- Grid of Glowing Windows -->
    <g fill="#fef08a">
      <rect x="180" y="120" width="25" height="25" rx="3"/>
      <rect x="235" y="120" width="25" height="25" rx="3"/>
      <rect x="290" y="120" width="25" height="25" rx="3"/>
      <rect x="180" y="170" width="25" height="25" rx="3"/>
      <rect x="235" y="170" width="25" height="25" rx="3"/>
      <rect x="290" y="170" width="25" height="25" rx="3"/>
      <rect x="180" y="220" width="25" height="25" rx="3"/>
      <rect x="235" y="220" width="25" height="25" rx="3"/>
      <rect x="290" y="220" width="25" height="25" rx="3"/>
      <rect x="180" y="270" width="25" height="25" rx="3"/>
      <rect x="235" y="270" width="25" height="25" rx="3"/>
      <rect x="290" y="270" width="25" height="25" rx="3"/>
      <rect x="180" y="320" width="25" height="25" rx="3"/>
      <rect x="235" y="320" width="25" height="25" rx="3"/>
      <rect x="290" y="320" width="25" height="25" rx="3"/>
    </g>
    <!-- Entrance Doors -->
    <rect x="225" y="375" width="50" height="55" rx="4" fill="#1e293b"/>
  </g>
</svg>