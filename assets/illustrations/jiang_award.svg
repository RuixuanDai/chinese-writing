<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJiang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadowJiang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJiang)"/>
  <ellipse cx="250" cy="435" rx="170" ry="25" fill="#fde047" opacity="0.6"/>
  <!-- Golden Champion Trophy -->
  <g filter="url(#shadowJiang)">
    <!-- Trophy Cup Base -->
    <rect x="180" y="370" width="140" height="35" rx="8" fill="#78350f"/>
    <polygon points="210,370 290,370 270,320 230,320" fill="url(#goldTrophy)"/>
    <!-- Cup Body -->
    <path d="M 170 140 L 330 140 C 330 250 290 280 250 320 C 210 280 170 250 170 140 Z" fill="url(#goldTrophy)"/>
    <!-- Handles Left & Right -->
    <path d="M 170 160 C 110 160 110 240 185 240" stroke="url(#goldTrophy)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 330 160 C 390 160 390 240 315 240" stroke="url(#goldTrophy)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Big Star on Trophy -->
    <polygon points="250,180 257,205 282,205 261,220 269,245 250,230 231,245 239,220 218,205 243,205" fill="#ffffff"/>
    <!-- Sparkles -->
    <circle cx="160" cy="110" r="8" fill="#facc15"/>
    <circle cx="340" cy="110" r="8" fill="#facc15"/>
  </g>
</svg>