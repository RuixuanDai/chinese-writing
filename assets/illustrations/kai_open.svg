<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Doorway frame -->
      <rect x="44" y="34" width="112" height="136" rx="6" fill="#38bdf8" stroke="#92400e" stroke-width="6"/>
      <!-- Bright outdoor scene revealed inside open doorway -->
      <circle cx="100" cy="66" r="12" fill="#fde047"/>
      <path d="M47 132 Q100 116 153 132 L153 167 L47 167 Z" fill="#4ade80"/>
      <!-- Left door panel swung open outward in perspective -->
      <polygon points="44,34 18,48 18,158 44,170" fill="#d97706" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="26" cy="104" r="3.5" fill="#fde047"/>
      <!-- Right door panel swung open outward in perspective -->
      <polygon points="156,34 182,48 182,158 156,170" fill="#d97706" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="174" cy="104" r="3.5" fill="#fde047"/>
      <!-- Outward opening motion arrows -->
      <path d="M84 98 L58 98 M66 90 L56 98 L66 106" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M116 98 L142 98 M134 90 L144 98 L134 106" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
</svg>