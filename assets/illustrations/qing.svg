<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowQing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQing)"/>
  <!-- Rolling Green Meadow at base -->
  <ellipse cx="250" cy="460" rx="220" ry="60" fill="#4ade80"/>
  <g filter="url(#shadowQing)">
    <!-- Brilliant Golden Sun in Clear Sky -->
    <circle cx="180" cy="180" r="75" fill="#facc15"/>
    <circle cx="180" cy="180" r="60" fill="#fef08a"/>
    <!-- Sun Rays -->
    <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
      <line x1="180" y1="80" x2="180" y2="50"/>
      <line x1="180" y1="280" x2="180" y2="310"/>
      <line x1="80" y1="180" x2="50" y2="180"/>
      <line x1="280" y1="180" x2="310" y2="180"/>
      <line x1="109" y1="109" x2="88" y2="88"/>
      <line x1="251" y1="251" x2="272" y2="272"/>
      <line x1="109" y1="251" x2="88" y2="272"/>
      <line x1="251" y1="109" x2="272" y2="88"/>
    </g>
    <!-- Pure White Puffy Cloud in Distance -->
    <ellipse cx="360" cy="240" rx="70" ry="40" fill="#ffffff"/>
    <circle cx="330" cy="225" r="35" fill="#ffffff"/>
    <circle cx="390" cy="225" r="35" fill="#ffffff"/>
  </g>
</svg>