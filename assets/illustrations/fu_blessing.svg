<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgFuBless" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <filter id="shadowFuBless" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgFuBless)"/>
  <g filter="url(#shadowFuBless)">
    <!-- Diamond-shaped Red Square Paper (福字斗方) -->
    <rect x="120" y="120" width="260" height="260" rx="12" fill="#dc2626" stroke="#ca8a04" stroke-width="8" transform="rotate(45 250 250)"/>
    <!-- Golden Character "福" in Calligraphy -->
    <text x="250" y="305" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="160" font-weight="bold" fill="#fef08a" text-anchor="middle">福</text>
  </g>
</svg>