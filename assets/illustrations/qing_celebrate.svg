<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQingCel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowQingCel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQingCel)"/>
  <g filter="url(#shadowQingCel)">
    <!-- Party Popper Horn -->
    <polygon points="120,380 180,350 290,240 260,210" fill="#ef4444"/>
    <polygon points="260,210 290,240 320,210 290,180" fill="#facc15"/>
    <!-- Confetti explosion bursting forth -->
    <path d="M 290 190 Q 360 140 430 110" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 310 220 Q 390 200 450 220" stroke="#ec4899" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 300 240 Q 370 290 410 350" stroke="#22c55e" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Confetti dots and stars -->
    <circle cx="370" cy="120" r="10" fill="#ef4444"/>
    <circle cx="430" cy="180" r="12" fill="#facc15"/>
    <circle cx="360" cy="270" r="10" fill="#a855f7"/>
    <circle cx="410" cy="300" r="12" fill="#38bdf8"/>
  </g>
</svg>