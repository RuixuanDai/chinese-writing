<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLianCouplet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <filter id="shadowLianCouplet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLianCouplet)"/>
  <g filter="url(#shadowLianCouplet)">
    <!-- Horizontal Scroll on Top (横批) -->
    <rect x="150" y="70" width="200" height="60" rx="6" fill="#dc2626" stroke="#ca8a04" stroke-width="4"/>
    <text x="250" y="112" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="34" font-weight="bold" fill="#fef08a" text-anchor="middle">吉祥如意</text>
    <!-- Left Vertical Couplet (上联) -->
    <rect x="100" y="150" width="70" height="290" rx="6" fill="#dc2626" stroke="#ca8a04" stroke-width="4"/>
    <text x="135" y="210" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">春</text>
    <text x="135" y="270" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">回</text>
    <text x="135" y="330" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">大</text>
    <text x="135" y="390" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">地</text>
    <!-- Right Vertical Couplet (下联) -->
    <rect x="330" y="150" width="70" height="290" rx="6" fill="#dc2626" stroke="#ca8a04" stroke-width="4"/>
    <text x="365" y="210" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">福</text>
    <text x="365" y="270" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">满</text>
    <text x="365" y="330" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">人</text>
    <text x="365" y="390" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="36" font-weight="bold" fill="#fef08a" text-anchor="middle">间</text>
  </g>
</svg>