<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXia" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <filter id="shadowXia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXia)"/>
  <!-- Distant mountain silhouette in sunset -->
  <polygon points="0,480 150,390 280,480" fill="#4c1d95" opacity="0.7"/>
  <polygon points="200,480 360,370 500,480" fill="#3b0764" opacity="0.8"/>
  <g filter="url(#shadowXia)">
    <!-- Golden Setting Sun on horizon -->
    <circle cx="250" cy="380" r="70" fill="#fef08a"/>
    <!-- Rosy Glowing Evening Clouds (晚霞) -->
    <ellipse cx="160" cy="230" rx="100" ry="32" fill="#f43f5e" opacity="0.8"/>
    <ellipse cx="340" cy="200" rx="110" ry="35" fill="#f97316" opacity="0.8"/>
    <ellipse cx="240" cy="290" rx="130" ry="38" fill="#fbbf24" opacity="0.85"/>
  </g>
</svg>