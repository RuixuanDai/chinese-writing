<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowJi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJi)"/>
  <!-- Proud Colorful Rooster (大公鸡) -->
  <g filter="url(#shadowJi)">
    <!-- Legs -->
    <line x1="230" y1="340" x2="225" y2="410" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <line x1="265" y1="340" x2="265" y2="410" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="250" cy="285" rx="85" ry="70" fill="#f59e0b"/>
    <!-- Colorful Wing -->
    <path d="M 215 260 C 265 240 280 320 220 330 Z" fill="#dc2626"/>
    <!-- Tail Plumes -->
    <path d="M 175 280 C 110 220 110 140 160 170 C 130 190 145 250 180 270 Z" fill="#047857"/>
    <path d="M 165 290 C 100 250 90 180 140 200 Z" fill="#1d4ed8"/>
    <!-- Neck & Head -->
    <path d="M 290 285 Q 315 220 325 180 Q 300 180 275 250 Z" fill="#f59e0b"/>
    <circle cx="315" cy="180" r="32" fill="#f59e0b"/>
    <!-- Red Comb (冠) -->
    <path d="M 295 160 Q 305 130 320 150 Q 335 125 345 155 Q 355 140 350 170 Z" fill="#ef4444"/>
    <!-- Wattle -->
    <ellipse cx="330" cy="210" rx="10" ry="16" fill="#ef4444"/>
    <!-- Beak -->
    <polygon points="340,175 375,185 340,195" fill="#f97316"/>
    <!-- Eye -->
    <circle cx="320" cy="175" r="5" fill="#0f172a"/>
    <circle cx="318" cy="173" r="1.8" fill="#ffffff"/>
  </g>
</svg>