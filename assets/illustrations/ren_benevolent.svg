<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowRen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgRen)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#bbf7d0" opacity="0.6"/>
  <!-- Big Umbrella shielding little chick from rain -->
  <g filter="url(#shadowRen)">
    <!-- Raindrops outside -->
    <line x1="80" y1="120" x2="70" y2="160" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="180" x2="110" y2="220" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="390" y1="140" x2="380" y2="180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="420" y1="210" x2="410" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Umbrella Dome -->
    <path d="M 110 260 C 110 130 390 130 390 260 Z" fill="#3b82f6"/>
    <!-- Umbrella Panels -->
    <path d="M 180 260 C 180 160 320 160 320 260 Z" fill="#60a5fa"/>
    <line x1="250" y1="130" x2="250" y2="390" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
    <!-- Umbrella Handle Curve -->
    <path d="M 250 390 C 250 420 220 420 220 400" stroke="#d97706" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Cozy Little Yellow Chick safe underneath -->
    <circle cx="285" cy="350" r="32" fill="#facc15"/>
    <circle cx="280" cy="340" r="5" fill="#18181b"/>
    <polygon points="265,348 250,352 265,356" fill="#f97316"/>
  </g>
</svg>