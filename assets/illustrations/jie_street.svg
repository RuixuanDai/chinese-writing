<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJieStreet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowJieStreet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJieStreet)"/>
  <g filter="url(#shadowJieStreet)">
    <!-- Buildings on both sides -->
    <rect x="60" y="140" width="100" height="270" fill="#f87171"/>
    <rect x="340" y="160" width="100" height="250" fill="#60a5fa"/>
    <!-- Street Highway Vanishing into distance -->
    <polygon points="160,450 340,450 270,220 230,220" fill="#475569"/>
    <!-- White Dashed Center Line -->
    <line x1="250" y1="230" x2="250" y2="450" stroke="#facc15" stroke-width="8" stroke-dasharray="20 15"/>
    <!-- Streetlamp -->
    <line x1="180" y1="360" x2="180" y2="240" stroke="#1e293b" stroke-width="5"/>
    <circle cx="180" cy="235" r="12" fill="#fef08a"/>
  </g>
</svg>