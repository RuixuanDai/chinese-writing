<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgZhu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowZhu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgZhu)"/>
  <ellipse cx="250" cy="440" rx="180" ry="35" fill="#86efac" opacity="0.6"/>
  <g filter="url(#shadowZhu)">
    <!-- Bamboo Stalk 1 (Left, thicker) -->
    <rect x="180" y="320" width="35" height="110" rx="4" fill="#22c55e"/>
    <line x1="175" y1="320" x2="220" y2="320" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <rect x="182" y="200" width="31" height="115" rx="4" fill="#22c55e"/>
    <line x1="177" y1="200" x2="218" y2="200" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <rect x="184" y="80" width="27" height="115" rx="4" fill="#22c55e"/>
    <line x1="180" y1="80" x2="215" y2="80" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <!-- Bamboo Stalk 2 (Right, slender) -->
    <rect x="290" y="290" width="28" height="140" rx="4" fill="#16a34a"/>
    <line x1="286" y1="290" x2="322" y2="290" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
    <rect x="292" y="150" width="24" height="135" rx="4" fill="#16a34a"/>
    <line x1="288" y1="150" x2="320" y2="150" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
    <!-- Bamboo Leaves Clusters (竹叶) -->
    <!-- Left cluster -->
    <path d="M 180 200 C 130 190 90 220 80 250 C 110 240 150 220 180 200 Z" fill="#15803d"/>
    <path d="M 180 200 C 120 220 100 270 95 300 C 120 270 155 240 180 200 Z" fill="#22c55e"/>
    <!-- Right cluster -->
    <path d="M 320 150 C 370 140 410 170 425 200 C 390 190 350 170 320 150 Z" fill="#15803d"/>
    <path d="M 320 150 C 380 170 400 220 405 250 C 380 220 345 190 320 150 Z" fill="#22c55e"/>
    <!-- Top delicate shoots -->
    <path d="M 210 80 C 240 50 270 60 290 80 C 260 80 230 80 210 80 Z" fill="#4ade80"/>
  </g>
</svg>