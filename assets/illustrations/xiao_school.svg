<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiaoSchool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowXiaoSchool" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXiaoSchool)"/>
  <ellipse cx="250" cy="440" rx="190" ry="35" fill="#86efac" opacity="0.8"/>
  <g filter="url(#shadowXiaoSchool)">
    <!-- School Main Building Base -->
    <rect x="110" y="220" width="280" height="190" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="6"/>
    <!-- Clock Tower in center -->
    <rect x="210" y="120" width="80" height="100" fill="#fef3c7" stroke="#d97706" stroke-width="6"/>
    <polygon points="250,50 195,120 305,120" fill="#dc2626"/>
    <!-- Golden School Bell in tower -->
    <circle cx="250" cy="165" r="22" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
    <circle cx="250" cy="165" r="3" fill="#1e293b"/>
    <line x1="250" y1="165" x2="250" y2="152" stroke="#1e293b" stroke-width="3"/>
    <line x1="250" y1="165" x2="260" y2="165" stroke="#1e293b" stroke-width="3"/>
    <!-- Red Roofs on wings -->
    <polygon points="100,220 215,220 180,180 120,180" fill="#ef4444"/>
    <polygon points="390,220 285,220 320,180 380,180" fill="#ef4444"/>
    <!-- Classroom Windows -->
    <rect x="140" y="245" width="45" height="50" rx="4" fill="#38bdf8"/>
    <rect x="315" y="245" width="45" height="50" rx="4" fill="#38bdf8"/>
    <rect x="140" y="325" width="45" height="50" rx="4" fill="#38bdf8"/>
    <rect x="315" y="325" width="45" height="50" rx="4" fill="#38bdf8"/>
    <!-- Double Entrance Doors -->
    <rect x="225" y="310" width="50" height="100" rx="4" fill="#b45309"/>
    <line x1="250" y1="310" x2="250" y2="410" stroke="#78350f" stroke-width="3"/>
  </g>
</svg>