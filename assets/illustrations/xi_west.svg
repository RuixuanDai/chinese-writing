<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_xi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_xi)"/>

  <!-- Setting sun glow on the left (West) -->
  <circle cx="36" cy="100" r="26" fill="#fb923c" opacity="0.85"/>
  <circle cx="36" cy="100" r="18" fill="#ef4444" opacity="0.7"/>
  <!-- Compass dial -->
  <circle cx="108" cy="100" r="56" fill="#ffffff" stroke="#f97316" stroke-width="5"/>
  <circle cx="108" cy="100" r="48" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Tick marks -->
  <line x1="108" y1="46" x2="108" y2="56" stroke="#94a3b8" stroke-width="3"/>
  <line x1="108" y1="144" x2="108" y2="154" stroke="#94a3b8" stroke-width="3"/>
  <line x1="152" y1="100" x2="162" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <line x1="52" y1="100" x2="64" y2="100" stroke="#ef4444" stroke-width="5"/>
  <!-- Needle: grey right, BRIGHT RED LEFT (West) -->
  <polygon points="108,92 146,100 108,108" fill="#94a3b8"/>
  <polygon points="108,90 62,100 108,110" fill="#ef4444"/>
  <circle cx="108" cy="100" r="6" fill="#1e293b"/>
  <!-- Big red arrow pointing West (left) -->
  <polygon points="42,100 56,90 56,110" fill="#ef4444"/>

</svg>
