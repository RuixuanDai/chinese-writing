<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowDian" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDian)"/>
  <g filter="url(#shadowDian)">
    <!-- Lightning Flash Aura -->
    <polygon points="270,60 140,250 250,250 210,440 370,220 260,220" fill="#fbbf24" opacity="0.4" transform="scale(1.08) translate(-15 -15)"/>
    <!-- Core Bright Electric Lightning Bolt -->
    <polygon points="270,60 140,250 250,250 210,440 370,220 260,220" fill="#facc15"/>
    <polygon points="265,80 160,240 250,240 225,410 345,230 265,230" fill="#fef08a"/>
    <!-- Sparkles -->
    <circle cx="120" cy="220" r="6" fill="#f59e0b"/>
    <circle cx="380" cy="200" r="7" fill="#f59e0b"/>
    <circle cx="180" cy="400" r="5" fill="#f59e0b"/>
  </g>
</svg>