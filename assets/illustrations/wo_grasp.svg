<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowWo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgWo)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#fde68a" opacity="0.6"/>
  <!-- Two Friendly Hands Shaking Warmly -->
  <g filter="url(#shadowWo)">
    <!-- Left Hand / Cuff (Blue shirt) -->
    <rect x="70" y="210" width="90" height="80" rx="14" fill="#3b82f6"/>
    <path d="M 150 230 L 250 250 L 260 280 L 150 270 Z" fill="#fcd34d"/>
    <!-- Right Hand / Cuff (Red shirt) -->
    <rect x="340" y="210" width="90" height="80" rx="14" fill="#ef4444"/>
    <path d="M 350 230 L 250 250 L 240 280 L 350 270 Z" fill="#f59e0b"/>
    <!-- Clasped Fingers (握手) -->
    <ellipse cx="250" cy="265" rx="45" ry="32" fill="#d97706"/>
    <circle cx="235" cy="265" r="10" fill="#fcd34d"/>
    <circle cx="265" cy="265" r="10" fill="#fcd34d"/>
    <!-- Golden Friendship Sparks -->
    <circle cx="250" cy="180" r="10" fill="#facc15"/>
    <circle cx="220" cy="195" r="6" fill="#facc15"/>
    <circle cx="280" cy="195" r="6" fill="#facc15"/>
  </g>
</svg>