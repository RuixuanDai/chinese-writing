<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_wo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_wo)"/>

  <!-- Pencil being grasped firmly -->
  <g transform="rotate(28 100 100)">
    <rect x="92" y="22" width="16" height="128" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="92" y="18" width="16" height="12" rx="3" fill="#f43f5e"/>
    <polygon points="92,150 108,150 100,174" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <polygon points="97,165 103,165 100,174" fill="#1e293b"/>
  </g>
  <!-- Hand & fingers wrapping around the pencil (握笔) -->
  <path d="M42 108 Q58 84 88 86 L108 86 Q120 86 120 98 Q120 110 104 110 L76 112" fill="#fed7aa" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <rect x="78" y="96" width="38" height="15" rx="7.5" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="74" y="110" width="36" height="15" rx="7.5" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="70" y="124" width="32" height="14" rx="7" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
  <!-- Grip emphasis rays -->
  <line x1="134" y1="84" x2="146" y2="78" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="138" y1="100" x2="152" y2="100" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

</svg>
