<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowYa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYa)"/>
  <!-- Cute Yellow Duckling on Water (小鸭) -->
  <g filter="url(#shadowYa)">
    <!-- Water ripples -->
    <ellipse cx="250" cy="370" rx="160" ry="22" fill="#7dd3fc" opacity="0.6"/>
    <ellipse cx="250" cy="370" rx="110" ry="14" fill="#38bdf8" opacity="0.4"/>
    <!-- Body -->
    <ellipse cx="240" cy="310" rx="90" ry="65" fill="#facc15"/>
    <path d="M 160 280 C 130 260 140 310 180 320 Z" fill="#eab308"/>
    <!-- Wing -->
    <ellipse cx="240" cy="310" rx="45" ry="30" fill="#eab308" transform="rotate(-10, 240, 310)"/>
    <!-- Head -->
    <circle cx="310" cy="220" r="50" fill="#facc15"/>
    <!-- Eye -->
    <circle cx="325" cy="205" r="7" fill="#0f172a"/>
    <circle cx="323" cy="202" r="2.5" fill="#ffffff"/>
    <circle cx="310" cy="225" r="8" fill="#f43f5e" opacity="0.5"/>
    <!-- Flat Orange Duck Bill -->
    <path d="M 345 220 Q 395 225 385 240 Q 345 245 340 235 Z" fill="#f97316"/>
  </g>
</svg>