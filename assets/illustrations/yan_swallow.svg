<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSwallow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </radialGradient>
    <filter id="shadowSwallow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0891b2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgSwallow)"/>
  <!-- Willow branch in spring -->
  <path d="M 40 30 Q 150 90 200 60" stroke="#15803d" stroke-width="4" fill="none"/>
  <ellipse cx="80" cy="60" rx="6" ry="16" fill="#4ade80" transform="rotate(30 80 60)"/>
  <ellipse cx="130" cy="85" rx="6" ry="18" fill="#4ade80" transform="rotate(40 130 85)"/>
  <ellipse cx="180" cy="75" rx="6" ry="16" fill="#4ade80" transform="rotate(20 180 75)"/>
  <g filter="url(#shadowSwallow)">
    <!-- Scissor Forked Tail (剪刀尾巴) -->
    <polygon points="310,310 440,380 340,330" fill="#0f172a"/>
    <polygon points="310,310 390,440 330,340" fill="#0f172a"/>
    <!-- Long Pointed Wings -->
    <path d="M 230 220 C 180 90 90 70 70 80 C 120 130 180 200 230 220 Z" fill="#1e293b"/>
    <path d="M 260 250 C 350 250 430 190 440 180 C 380 220 310 250 260 250 Z" fill="#1e293b"/>
    <!-- Body -->
    <ellipse cx="250" cy="250" rx="75" ry="42" fill="#0f172a" transform="rotate(30 250 250)"/>
    <!-- White Belly -->
    <ellipse cx="245" cy="265" rx="45" ry="25" fill="#f8fafc" transform="rotate(30 245 265)"/>
    <!-- Rufous / Chestnut Chin -->
    <ellipse cx="195" cy="210" rx="18" ry="14" fill="#dc2626"/>
    <!-- Head -->
    <circle cx="185" cy="195" r="28" fill="#0f172a"/>
    <!-- Tiny sharp beak -->
    <polygon points="160,195 130,200 160,205" fill="#f59e0b"/>
    <!-- Sparkling Eye -->
    <circle cx="180" cy="190" r="5" fill="#ffffff"/>
    <circle cx="179" cy="189" r="3" fill="#000000"/>
    <circle cx="178" cy="188" r="1" fill="#ffffff"/>
  </g>
</svg>