      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadowTian" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgTian)"/>
  <ellipse cx="250" cy="430" rx="170" ry="30" fill="#fbcfe8" opacity="0.6"/>
