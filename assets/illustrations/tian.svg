    <path d="M 250 180 M 250 95 A 85 85 0 0 1 335 180" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Cute Honey Pot beside -->
    <ellipse cx="360" cy="380" rx="45" ry="35" fill="#f59e0b"/>
    <ellipse cx="360" cy="350" rx="30" ry="12" fill="#d97706"/>
