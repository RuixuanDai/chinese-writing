<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_lian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_lian)"/>

  <!-- Head -->
  <circle cx="100" cy="100" r="48" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <path d="M52 94 Q100 46 148 94 Q124 76 100 78 Q76 76 52 94 Z" fill="#451a03"/>
  <!-- Happy curved eyes -->
  <path d="M74 94 Q82 86 90 94" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 94 Q118 86 126 94" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Prominent rosy cheeks (脸蛋) highlighted with dashed circles -->
  <circle cx="70" cy="114" r="13" fill="#fb7185" opacity="0.65"/>
  <circle cx="70" cy="114" r="16" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="130" cy="114" r="13" fill="#fb7185" opacity="0.65"/>
  <circle cx="130" cy="114" r="16" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="4,3"/>
  <!-- Big smile -->
  <path d="M86 118 Q100 132 114 118" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Two little hands cupping the cheeks -->
  <path d="M46 124 Q52 146 72 144" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/>
  <path d="M154 124 Q148 146 128 144" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/>
  <!-- Left & right red arrows pointing to the cheeks -->
  <path d="M18 114 L46 114" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
  <polygon points="50,114 40,107 40,121" fill="#e11d48"/>
  <path d="M182 114 L154 114" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
  <polygon points="150,114 160,107 160,121" fill="#e11d48"/>

</svg>
