<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHongRainbow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <filter id="shadowHongRainbow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHongRainbow)"/>
  <!-- Green Rolling Hills at base -->
  <ellipse cx="140" cy="460" rx="180" ry="60" fill="#86efac"/>
  <ellipse cx="360" cy="460" rx="180" ry="60" fill="#4ade80"/>
  <g filter="url(#shadowHongRainbow)">
    <!-- Magnificent 7-Color Rainbow Arch -->
    <path d="M 60 420 A 190 190 0 0 1 440 420" stroke="#ef4444" stroke-width="16" fill="none"/>
    <path d="M 76 420 A 174 174 0 0 1 424 420" stroke="#f97316" stroke-width="16" fill="none"/>
    <path d="M 92 420 A 158 158 0 0 1 408 420" stroke="#facc15" stroke-width="16" fill="none"/>
    <path d="M 108 420 A 142 142 0 0 1 392 420" stroke="#22c55e" stroke-width="16" fill="none"/>
    <path d="M 124 420 A 126 126 0 0 1 376 420" stroke="#38bdf8" stroke-width="16" fill="none"/>
    <path d="M 140 420 A 110 110 0 0 1 360 420" stroke="#6366f1" stroke-width="16" fill="none"/>
    <path d="M 156 420 A 94 94 0 0 1 344 420" stroke="#a855f7" stroke-width="16" fill="none"/>
    <!-- Fluffy Clouds at Rainbow Bases -->
    <ellipse cx="90" cy="410" rx="45" ry="30" fill="#ffffff"/>
    <circle cx="70" cy="390" r="28" fill="#ffffff"/>
    <circle cx="110" cy="390" r="28" fill="#ffffff"/>
    <ellipse cx="410" cy="410" rx="45" ry="30" fill="#ffffff"/>
    <circle cx="390" cy="390" r="28" fill="#ffffff"/>
    <circle cx="430" cy="390" r="28" fill="#ffffff"/>
  </g>
</svg>