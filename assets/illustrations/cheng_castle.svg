<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgChengCastle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowChengCastle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgChengCastle)"/>
  <ellipse cx="250" cy="440" rx="190" ry="35" fill="#86efac" opacity="0.7"/>
  <g filter="url(#shadowChengCastle)">
    <!-- Great City Wall (城墙) -->
    <rect x="100" y="240" width="300" height="170" fill="#64748b"/>
    <!-- Battlements / Crenels -->
    <rect x="100" y="200" width="40" height="40" fill="#64748b"/>
    <rect x="165" y="200" width="40" height="40" fill="#64748b"/>
    <rect x="230" y="200" width="40" height="40" fill="#64748b"/>
    <rect x="295" y="200" width="40" height="40" fill="#64748b"/>
    <rect x="360" y="200" width="40" height="40" fill="#64748b"/>
    <!-- Arched City Gate -->
    <path d="M 200 410 L 200 310 C 200 270 300 270 300 310 L 300 410 Z" fill="#b45309"/>
    <!-- Red Flying Banner on tower -->
    <line x1="250" y1="200" x2="250" y2="120" stroke="#78350f" stroke-width="6"/>
    <polygon points="250,120 320,140 250,160" fill="#ef4444"/>
  </g>
</svg>