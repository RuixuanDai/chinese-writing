<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowTa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgTa)"/>
  <ellipse cx="250" cy="450" rx="180" ry="30" fill="#86efac" opacity="0.7"/>
  <g filter="url(#shadowTa)">
    <!-- Tier 1 (Base) -->
    <rect x="180" y="360" width="140" height="70" fill="#b45309"/>
    <polygon points="250,330 140,360 360,360" fill="#dc2626"/>
    <!-- Tier 2 -->
    <rect x="200" y="270" width="100" height="60" fill="#b45309"/>
    <polygon points="250,240 160,270 340,270" fill="#dc2626"/>
    <!-- Tier 3 -->
    <rect x="215" y="180" width="70" height="60" fill="#b45309"/>
    <polygon points="250,150 180,180 320,180" fill="#dc2626"/>
    <!-- Spire on Top -->
    <polygon points="250,70 240,150 260,150" fill="#facc15"/>
    <circle cx="250" cy="70" r="8" fill="#facc15"/>
  </g>
</svg>