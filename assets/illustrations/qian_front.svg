    <circle cx="190" cy="340" r="12" fill="#94a3b8"/>
    <circle cx="310" cy="340" r="26" fill="#1e293b"/>
    <circle cx="310" cy="340" r="12" fill="#94a3b8"/>
    <!-- Headlight beam pointing forward (right) -->
