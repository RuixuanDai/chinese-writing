<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_di_earth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_di_earth)"/>

  <!-- Distant rolling green hills -->
  <path d="M0 112 Q52 84 114 106 T200 96 L200 200 L0 200 Z" fill="#4ade80"/>
  <!-- Foreground rich earth & fields -->
  <path d="M0 132 Q80 112 200 136 L200 200 L0 200 Z" fill="#16a34a"/>
  <path d="M0 156 Q100 142 200 160 L200 200 L0 200 Z" fill="#92400e"/>
  <!-- Winding path & furrow lines across the land -->
  <path d="M92 122 Q74 148 54 200 L118 200 Q110 148 104 122 Z" fill="#fde047" opacity="0.65"/>
  <!-- Little flowers & grass tufts on the land -->
  <circle cx="38" cy="136" r="4" fill="#fef08a"/><circle cx="154" cy="142" r="4" fill="#f43f5e"/>
  <!-- Red arrow pointing down to the vast ground/earth -->
  <path d="M100 46 L100 84" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <polygon points="100,92 90,78 110,78" fill="#ef4444"/>

</svg>
