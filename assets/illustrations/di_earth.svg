<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDiEarth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowDiEarth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDiEarth)"/>
  <g filter="url(#shadowDiEarth)">
    <!-- Earth Soil Layers -->
    <path d="M 0 320 Q 250 280 500 320 L 500 500 L 0 500 Z" fill="#92400e"/>
    <path d="M 0 360 Q 250 330 500 360 L 500 500 L 0 500 Z" fill="#78350f"/>
    <!-- Green Grass Top Surface -->
    <path d="M 0 320 Q 250 280 500 320 L 500 340 Q 250 300 0 340 Z" fill="#22c55e"/>
    <!-- Vibrant Green Sprout Emerging -->
    <path d="M 250 300 Q 250 220 230 190 C 200 170 180 200 200 220 C 220 240 240 220 250 300 Z" fill="#4ade80"/>
    <path d="M 250 250 Q 280 200 310 210 C 320 230 300 250 270 250 Z" fill="#22c55e"/>
    <!-- Little Wildflowers -->
    <circle cx="140" cy="300" r="10" fill="#f43f5e"/>
    <circle cx="140" cy="300" r="4" fill="#fef08a"/>
    <circle cx="380" cy="305" r="10" fill="#38bdf8"/>
    <circle cx="380" cy="305" r="4" fill="#fef08a"/>
  </g>
</svg>