<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJieFest" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <filter id="shadowJieFest" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJieFest)"/>
  <g filter="url(#shadowJieFest)">
    <!-- Swag Strings with Colorful Triangular Bunting Flags -->
    <path d="M 50 140 Q 250 230 450 140" stroke="#ca8a04" stroke-width="4" fill="none"/>
    <polygon points="90,160 120,220 150,175" fill="#ef4444"/>
    <polygon points="160,180 190,240 220,195" fill="#facc15"/>
    <polygon points="230,200 260,255 290,200" fill="#22c55e"/>
    <polygon points="300,195 330,240 360,180" fill="#3b82f6"/>
    <polygon points="370,175 400,220 430,160" fill="#a855f7"/>
    <!-- Second bunting strand -->
    <path d="M 70 250 Q 250 330 430 250" stroke="#ca8a04" stroke-width="4" fill="none"/>
    <polygon points="120,270 150,330 180,285" fill="#ec4899"/>
    <polygon points="200,295 230,350 260,300" fill="#38bdf8"/>
    <polygon points="280,300 310,350 340,295" fill="#f97316"/>
    <!-- Confetti & Sparkles -->
    <circle cx="150" cy="110" r="8" fill="#f43f5e"/>
    <circle cx="340" cy="110" r="8" fill="#eab308"/>
    <circle cx="250" cy="380" r="10" fill="#3b82f6"/>
  </g>
</svg>