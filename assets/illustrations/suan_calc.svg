<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSuan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </radialGradient>
    <filter id="shadowSuan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#44403c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgSuan)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#e7e5e4" opacity="0.6"/>
  <!-- Wooden Abacus Frame -->
  <g filter="url(#shadowSuan)">
    <rect x="80" y="140" width="340" height="230" rx="12" fill="#78350f" stroke="#451a03" stroke-width="8"/>
    <!-- Middle beam -->
    <rect x="80" y="210" width="340" height="16" fill="#451a03"/>
    <!-- Rods -->
    <line x1="140" y1="140" x2="140" y2="370" stroke="#d6d3d1" stroke-width="4"/>
    <line x1="195" y1="140" x2="195" y2="370" stroke="#d6d3d1" stroke-width="4"/>
    <line x1="250" y1="140" x2="250" y2="370" stroke="#d6d3d1" stroke-width="4"/>
    <line x1="305" y1="140" x2="305" y2="370" stroke="#d6d3d1" stroke-width="4"/>
    <line x1="360" y1="140" x2="360" y2="370" stroke="#d6d3d1" stroke-width="4"/>
    <!-- Upper Beads (1 per rod) -->
    <ellipse cx="140" cy="180" rx="18" ry="12" fill="#ea580c"/>
    <ellipse cx="195" cy="195" rx="18" ry="12" fill="#ea580c"/>
    <ellipse cx="250" cy="180" rx="18" ry="12" fill="#ea580c"/>
    <ellipse cx="305" cy="195" rx="18" ry="12" fill="#ea580c"/>
    <ellipse cx="360" cy="180" rx="18" ry="12" fill="#ea580c"/>
    <!-- Lower Beads (4 per rod) -->
    <ellipse cx="140" cy="245" rx="18" ry="12" fill="#0284c7"/>
    <ellipse cx="140" cy="275" rx="18" ry="12" fill="#0284c7"/>
    <ellipse cx="250" cy="245" rx="18" ry="12" fill="#0284c7"/>
    <ellipse cx="305" cy="245" rx="18" ry="12" fill="#0284c7"/>
    <ellipse cx="305" cy="275" rx="18" ry="12" fill="#0284c7"/>
    <ellipse cx="305" cy="305" rx="18" ry="12" fill="#0284c7"/>
  </g>
</svg>