<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDaoRoad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <filter id="shadowDaoRoad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDaoRoad)"/>
  <!-- Rolling Green Hills -->
  <polygon points="0,320 180,180 340,320" fill="#4ade80"/>
  <polygon points="180,320 360,160 500,320" fill="#22c55e"/>
  <g filter="url(#shadowDaoRoad)">
    <!-- Winding Country Road S-Curve -->
    <path d="M 80 470 C 180 430 380 370 280 280 C 220 230 240 180 260 160 L 290 160 C 270 180 250 230 320 280 C 430 370 260 430 180 470 Z" fill="#64748b"/>
    <!-- Yellow Dashed Line on Road -->
    <path d="M 130 470 Q 320 380 270 280 Q 240 210 275 160" stroke="#facc15" stroke-width="6" stroke-dasharray="16 14" fill="none"/>
  </g>
</svg>