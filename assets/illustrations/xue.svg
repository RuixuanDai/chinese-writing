<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowXue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXue)"/>
  <!-- Snowy hills -->
  <path d="M 0 420 Q 150 360 300 410 T 500 390 L 500 500 L 0 500 Z" fill="#ffffff"/>
  <path d="M 120 440 Q 250 400 450 450" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <g filter="url(#shadowXue)">
    <!-- Main Beautiful 6-Fold Snowflake -->
    <g stroke="#38bdf8" stroke-width="10" stroke-linecap="round">
      <line x1="250" y1="90" x2="250" y2="370"/>
      <line x1="128" y1="160" x2="372" y2="300"/>
      <line x1="128" y1="300" x2="372" y2="160"/>
    </g>
    <!-- Snowflake Crystals / Branches -->
    <g stroke="#0284c7" stroke-width="6" stroke-linecap="round">
      <!-- Vertical branch details -->
      <line x1="250" y1="130" x2="225" y2="105"/>
      <line x1="250" y1="130" x2="275" y2="105"/>
      <line x1="250" y1="330" x2="225" y2="355"/>
      <line x1="250" y1="330" x2="275" y2="355"/>
      <!-- Diagonal 1 -->
      <line x1="165" y1="180" x2="140" y2="160"/>
      <line x1="165" y1="180" x2="160" y2="210"/>
      <line x1="335" y1="280" x2="360" y2="300"/>
      <line x1="335" y1="280" x2="340" y2="250"/>
      <!-- Diagonal 2 -->
      <line x1="165" y1="280" x2="140" y2="300"/>
      <line x1="165" y1="280" x2="160" y2="250"/>
      <line x1="335" y1="180" x2="360" y2="160"/>
      <line x1="335" y1="180" x2="340" y2="210"/>
    </g>
    <!-- Center Crystal Core -->
    <circle cx="250" cy="230" r="18" fill="#ffffff" stroke="#0284c7" stroke-width="5"/>
    <circle cx="250" cy="230" r="7" fill="#38bdf8"/>
    <!-- Cute Snowman in background -->
    <circle cx="390" cy="380" r="32" fill="#ffffff"/>
    <circle cx="390" cy="335" r="22" fill="#ffffff"/>
    <polygon points="385,335 360,338 385,342" fill="#f97316"/>
  </g>
</svg>