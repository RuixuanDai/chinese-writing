<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Soft spring hills -->
      <path d="M0 164 Q65 142 135 158 Q172 148 200 160 L200 200 L0 200 Z" fill="#86efac"/>
      <!-- Swaying green willow twigs on right -->
      <path d="M168 16 Q152 62 160 108" fill="none" stroke="#65a30d" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M184 18 Q170 68 176 118" fill="none" stroke="#65a30d" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="158" cy="44" rx="6" ry="3" transform="rotate(-30 158 44)" fill="#4ade80"/><ellipse cx="156" cy="68" rx="6" ry="3" transform="rotate(-30 156 68)" fill="#4ade80"/><ellipse cx="158" cy="92" rx="6" ry="3" transform="rotate(-30 158 92)" fill="#4ade80"/><ellipse cx="175" cy="50" rx="6" ry="3" transform="rotate(-30 175 50)" fill="#4ade80"/><ellipse cx="173" cy="76" rx="6" ry="3" transform="rotate(-30 173 76)" fill="#4ade80"/><ellipse cx="175" cy="100" rx="6" ry="3" transform="rotate(-30 175 100)" fill="#4ade80"/>
      <!-- Blooming peach branch on left -->
      <path d="M10 46 Q56 58 106 40" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      
        <g transform="translate(44, 50)">
          <circle cx="9" cy="0" r="7.5" fill="#f472b6"/><circle cx="2.781152949374527" cy="8.559508646656381" r="7.5" fill="#f472b6"/><circle cx="-7.281152949374526" cy="5.290067270632259" r="7.5" fill="#f472b6"/><circle cx="-7.281152949374527" cy="-5.290067270632258" r="7.5" fill="#f472b6"/><circle cx="2.7811529493745253" cy="-8.559508646656383" r="7.5" fill="#f472b6"/>
          <circle cx="0" cy="0" r="5" fill="#fde047"/>
        </g>
        <g transform="translate(82, 44)">
          <circle cx="9" cy="0" r="7.5" fill="#f472b6"/><circle cx="2.781152949374527" cy="8.559508646656381" r="7.5" fill="#f472b6"/><circle cx="-7.281152949374526" cy="5.290067270632259" r="7.5" fill="#f472b6"/><circle cx="-7.281152949374527" cy="-5.290067270632258" r="7.5" fill="#f472b6"/><circle cx="2.7811529493745253" cy="-8.559508646656383" r="7.5" fill="#f472b6"/>
          <circle cx="0" cy="0" r="5" fill="#fde047"/>
        </g>
      <!-- Complete cute spring swallow (燕子) flying gracefully -->
      <g transform="translate(108, 118) rotate(-14)">
        <!-- Scissor tail -->
        <path d="M-22 2 L-48 -10 L-32 2 L-48 14 L-22 4 Z" fill="#1e293b"/>
        <!-- Back wing -->
        <path d="M-4 -4 Q8 -36 28 -30 Q16 -8 6 0 Z" fill="#334155"/>
        <!-- Body & white belly -->
        <ellipse cx="0" cy="2" rx="24" ry="10" fill="#1e293b"/>
        <ellipse cx="2" cy="6" rx="16" ry="6" fill="#ffffff"/>
        <!-- Head, chestnut throat, beak, eye -->
        <circle cx="20" cy="0" r="9" fill="#1e293b"/>
        <circle cx="24" cy="3" r="4.5" fill="#ef4444"/>
        <polygon points="28,-1 36,1 28,4" fill="#f59e0b"/>
        <circle cx="22" cy="-2" r="2" fill="#ffffff"/>
        <!-- Front wing -->
        <path d="M-2 2 Q-12 30 -30 26 Q-14 8 -4 4 Z" fill="#0f172a"/>
      </g>
    
</svg>