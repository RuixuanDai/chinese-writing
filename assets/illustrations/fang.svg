<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_fang" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_fang)"/>

  <ellipse cx="100" cy="172" rx="78" ry="10" fill="#84cc16" opacity="0.45"/>
  <!-- Chimney -->
  <rect x="132" y="34" width="16" height="32" rx="3" fill="#b45309"/>
  <!-- Main house walls -->
  <rect x="42" y="78" width="116" height="90" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <!-- Pitched tiled roof -->
  <polygon points="100,30 28,82 172,82" fill="#ea580c" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/>
  <!-- Attic round window -->
  <circle cx="100" cy="62" r="11" fill="#bae6fd" stroke="#9a3412" stroke-width="2.5"/>
  <line x1="89" y1="62" x2="111" y2="62" stroke="#9a3412" stroke-width="2"/>
  <line x1="100" y1="51" x2="100" y2="73" stroke="#9a3412" stroke-width="2"/>
  <!-- Front door (left) & window with flowerbox (right) -->
  <rect x="58" y="112" width="32" height="56" rx="4" fill="#92400e"/>
  <circle cx="83" cy="140" r="3" fill="#facc15"/>
  <rect x="104" y="102" width="38" height="34" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="123" y1="102" x2="123" y2="136" stroke="#0284c7" stroke-width="2"/>
  <line x1="104" y1="119" x2="142" y2="119" stroke="#0284c7" stroke-width="2"/>
  <rect x="102" y="136" width="42" height="7" rx="3" fill="#16a34a"/>

</svg>
