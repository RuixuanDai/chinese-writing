<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDuo" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadowDuo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ea580c" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDuo)"/>
  <!-- Overflowing pile of many bright red apples & stars -->
  <g filter="url(#shadowDuo)">
    <!-- Back row of apples -->
    <circle cx="155" cy="215" r="44" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <circle cx="250" cy="185" r="46" fill="#f87171" stroke="#dc2626" stroke-width="3"/>
    <circle cx="345" cy="215" r="44" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <!-- Middle row of apples -->
    <circle cx="125" cy="285" r="45" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <circle cx="210" cy="265" r="46" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <circle cx="295" cy="265" r="46" fill="#f87171" stroke="#dc2626" stroke-width="3"/>
    <circle cx="375" cy="285" r="45" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <!-- Leaves on top -->
    <ellipse cx="258" cy="136" rx="16" ry="8" transform="rotate(-25 258 136)" fill="#22c55e"/>
    <ellipse cx="162" cy="166" rx="15" ry="7" transform="rotate(-20 162 166)" fill="#22c55e"/>
    <ellipse cx="352" cy="166" rx="15" ry="7" transform="rotate(20 352 166)" fill="#22c55e"/>
    <!-- Wooden Basket -->
    <path d="M 85 305 L 415 305 L 375 425 Q 250 440 125 425 Z" fill="#d97706" stroke="#92400e" stroke-width="5" stroke-linejoin="round"/>
    <rect x="75" y="295" width="350" height="24" rx="12" fill="#f59e0b" stroke="#92400e" stroke-width="4"/>
    <!-- Sparkle stars indicating MANY -->
    <circle cx="105" cy="125" r="10" fill="#facc15"/>
    <circle cx="395" cy="125" r="10" fill="#facc15"/>
    <circle cx="250" cy="95" r="12" fill="#facc15"/>
  </g>
</svg>
