<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <filter id="shadowYan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgYan)"/>
  <!-- Sunset Glow & Clouds -->
  <circle cx="410" cy="140" r="60" fill="#fb923c" opacity="0.4"/>
  <!-- Tiny V-formation geese in background -->
  <path d="M 330 110 L 340 100 L 350 110 M 355 125 L 365 115 L 375 125 M 380 140 L 390 130 L 400 140" stroke="#9a3412" stroke-width="3" stroke-linecap="round" fill="none"/>
  <g filter="url(#shadowYan)">
    <!-- Upper Wing -->
    <path d="M 230 240 C 230 130 180 80 120 70 C 160 120 200 190 230 240 Z" fill="#78350f"/>
    <path d="M 120 70 C 150 100 170 140 170 170 Z" fill="#451a03"/>
    <!-- Lower Wing -->
    <path d="M 260 270 C 310 320 370 380 430 400 C 380 340 330 280 260 270 Z" fill="#92400e"/>
    <!-- Streamlined Body -->
    <ellipse cx="250" cy="250" rx="90" ry="38" fill="#b45309" transform="rotate(25 250 250)"/>
    <!-- White chin strap / neck ring -->
    <ellipse cx="195" cy="225" rx="14" ry="25" fill="#f8fafc" transform="rotate(25 195 225)"/>
    <!-- Head & Neck stretched forward -->
    <path d="M 210 235 L 140 195" stroke="#451a03" stroke-width="26" stroke-linecap="round"/>
    <ellipse cx="130" cy="190" rx="20" ry="16" fill="#451a03"/>
    <!-- Bill -->
    <polygon points="120,185 85,185 120,198" fill="#f97316"/>
    <!-- Eye & Sparkle -->
    <circle cx="135" cy="186" r="4.5" fill="#ffffff"/>
    <circle cx="135" cy="186" r="2.5" fill="#000000"/>
    <!-- Tail Feathers -->
    <polygon points="325,290 380,315 340,325" fill="#451a03"/>
  </g>
</svg>