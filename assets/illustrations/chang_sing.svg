<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgChang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowChang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgChang)"/>
  <ellipse cx="250" cy="450" rx="160" ry="20" fill="#fde68a" opacity="0.6"/>

  <!-- Cheerful child singing with microphone and music notes (唱歌) -->
  <g filter="url(#shadowChang)">
    <!-- Body & Shirt -->
    <path d="M 170 450 C 170 360 330 360 330 450 Z" fill="#3b82f6"/>
    <!-- Collar -->
    <polygon points="220,380 250,405 280,380 260,370 240,370" fill="#ffffff"/>

    <!-- Head & Neck -->
    <rect x="235" y="320" width="30" height="60" fill="#fed7aa"/>
    <circle cx="250" cy="250" r="95" fill="#fed7aa"/>

    <!-- Hair -->
    <path d="M 155 240 C 150 140 350 140 345 240 C 320 180 180 180 155 240 Z" fill="#451a03"/>
    <path d="M 170 190 Q 210 215 250 185 Q 290 215 330 190" stroke="#451a03" stroke-width="8" fill="none"/>

    <!-- Cheerful closed eyes -->
    <path d="M 200 235 Q 215 220 230 235" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 270 235 Q 285 220 300 235" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Blushing cheeks -->
    <circle cx="195" cy="260" r="14" fill="#fda4af" opacity="0.7"/>
    <circle cx="305" cy="260" r="14" fill="#fda4af" opacity="0.7"/>

    <!-- Open singing mouth -->
    <ellipse cx="250" cy="280" rx="22" ry="28" fill="#e11d48"/>
    <path d="M 235 292 Q 250 305 265 292" fill="#fb7185"/>

    <!-- Arm & Hand holding Microphone -->
    <path d="M 190 400 Q 210 330 240 330" stroke="#fed7aa" stroke-width="32" stroke-linecap="round" fill="none"/>
    
    <!-- Microphone -->
    <rect x="235" y="310" width="18" height="45" rx="5" fill="#475569"/>
    <circle cx="244" cy="300" r="22" fill="#9333ea" stroke="#c084fc" stroke-width="3"/>
    <line x1="230" y1="300" x2="258" y2="300" stroke="#e9d5ff" stroke-width="3"/>
    <line x1="244" y1="286" x2="244" y2="314" stroke="#e9d5ff" stroke-width="3"/>

    <!-- Dynamic Colorful Musical Notes -->
    <!-- Note 1 (Red/Pink double eighth note) -->
    <g transform="translate(330, 110)">
      <ellipse cx="10" cy="40" rx="12" ry="9" fill="#f43f5e" transform="rotate(-20, 10, 40)"/>
      <ellipse cx="45" cy="30" rx="12" ry="9" fill="#f43f5e" transform="rotate(-20, 45, 30)"/>
      <line x1="20" y1="38" x2="20" y2="5" stroke="#f43f5e" stroke-width="5"/>
      <line x1="55" y1="28" x2="55" y2="-5" stroke="#f43f5e" stroke-width="5"/>
      <polygon points="18,10 57,0 57,-8 18,2" fill="#f43f5e"/>
    </g>

    <!-- Note 2 (Gold quarter note) -->
    <g transform="translate(100, 150)">
      <ellipse cx="20" cy="35" rx="12" ry="9" fill="#eab308" transform="rotate(-20, 20, 35)"/>
      <line x1="30" y1="33" x2="30" y2="5" stroke="#eab308" stroke-width="5"/>
      <path d="M 30 5 Q 48 12 40 25" stroke="#eab308" stroke-width="5" fill="none"/>
    </g>

    <!-- Note 3 (Cyan floating note) -->
    <g transform="translate(380, 220)">
      <ellipse cx="15" cy="30" rx="10" ry="8" fill="#06b6d4" transform="rotate(-20, 15, 30)"/>
      <line x1="23" y1="28" x2="23" y2="5" stroke="#06b6d4" stroke-width="4"/>
      <path d="M 23 5 Q 38 12 32 22" stroke="#06b6d4" stroke-width="4" fill="none"/>
    </g>

    <!-- Twinkle sparkle -->
    <polygon points="130,110 134,122 146,126 134,130 130,142 126,130 114,126 126,122" fill="#fbbf24"/>
    <polygon points="320,60 323,70 333,73 323,76 320,86 317,76 307,73 317,70" fill="#fbbf24"/>
  </g>
</svg>