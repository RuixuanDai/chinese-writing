<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgShiTeacher" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowShiTeacher" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShiTeacher)"/>
  <g filter="url(#shadowShiTeacher)">
    <!-- Classroom Blackboard in background -->
    <rect x="70" y="70" width="260" height="180" rx="8" fill="#14532d" stroke="#78350f" stroke-width="8"/>
    <!-- ABC 123 on board -->
    <text x="120" y="140" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="34" font-weight="bold" fill="#ffffff">春华秋实</text>
    <text x="120" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#facc15">1 + 2 = 3</text>
    <!-- Pointer Stick in hand -->
    <line x1="280" y1="280" x2="220" y2="150" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
    <!-- Teacher Figure (Right side) -->
    <path d="M 270 440 C 270 330 440 330 440 440 Z" fill="#2563eb"/>
    <circle cx="355" cy="240" r="75" fill="#fed7aa"/>
    <!-- Neat hairstyle -->
    <path d="M 285 220 C 285 130 425 130 425 220 Z" fill="#451a03"/>
    <!-- Glasses & Kind Smile -->
    <rect x="315" y="225" width="35" height="25" rx="5" fill="none" stroke="#0f172a" stroke-width="4"/>
    <rect x="365" y="225" width="35" height="25" rx="5" fill="none" stroke="#0f172a" stroke-width="4"/>
    <line x1="350" y1="237" x2="365" y2="237" stroke="#0f172a" stroke-width="4"/>
    <path d="M 345 275 Q 360 290 375 275" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>