<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowTai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgTai)"/>
  <ellipse cx="250" cy="435" rx="170" ry="24" fill="#fde68a" opacity="0.6"/>
  <!-- Two Children Lifting a heavy golden harvest basket together (齐心抬) -->
  <g filter="url(#shadowTai)">
    <!-- Long Lifting Pole across shoulders -->
    <rect x="110" y="220" width="280" height="16" rx="8" fill="#78350f"/>
    <!-- Ropes Hanging Basket -->
    <line x1="220" y1="230" x2="220" y2="300" stroke="#b45309" stroke-width="4"/>
    <line x1="280" y1="230" x2="280" y2="300" stroke="#b45309" stroke-width="4"/>
    <!-- Basket of Oranges -->
    <rect x="200" y="300" width="100" height="70" rx="12" fill="#d97706"/>
    <circle cx="230" cy="295" r="16" fill="#f97316"/>
    <circle cx="270" cy="295" r="16" fill="#f97316"/>
    <circle cx="250" cy="285" r="16" fill="#f97316"/>
    <!-- Left Child lifting -->
    <circle cx="130" cy="170" r="30" fill="#fed7aa"/>
    <rect x="115" y="200" width="45" height="90" rx="10" fill="#3b82f6"/>
    <rect x="120" y="290" width="18" height="70" rx="6" fill="#1e293b"/>
    <rect x="140" y="290" width="18" height="70" rx="6" fill="#1e293b"/>
    <!-- Right Child lifting -->
    <circle cx="370" cy="170" r="30" fill="#fed7aa"/>
    <rect x="345" y="200" width="45" height="90" rx="10" fill="#ef4444"/>
    <rect x="350" y="290" width="18" height="70" rx="6" fill="#1e293b"/>
    <rect x="370" y="290" width="18" height="70" rx="6" fill="#1e293b"/>
  </g>
</svg>