<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowDi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgDi)"/>
  <g filter="url(#shadowDi)">
    <!-- Green Romper & Overalls -->
    <path d="M 150 440 C 150 350 350 350 350 440 Z" fill="#22c55e"/>
    <!-- Head -->
    <circle cx="250" cy="240" r="90" fill="#fed7aa"/>
    <!-- Cute Toddler Hair with little sprout tuft -->
    <path d="M 170 200 C 160 120 340 120 330 200 Z" fill="#78350f"/>
    <path d="M 250 140 Q 240 100 230 90 M 250 140 Q 260 100 270 90" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Big Innocent Eyes -->
    <circle cx="215" cy="235" r="12" fill="#1e293b"/>
    <circle cx="210" cy="229" r="4.5" fill="#ffffff"/>
    <circle cx="285" cy="235" r="12" fill="#1e293b"/>
    <circle cx="280" cy="229" r="4.5" fill="#ffffff"/>
    <!-- Cute open smile -->
    <path d="M 230 270 Q 250 300 270 270 Z" fill="#f43f5e"/>
    <!-- Rosy Cheeks -->
    <circle cx="180" cy="265" r="14" fill="#f43f5e" opacity="0.4"/>
    <circle cx="320" cy="265" r="14" fill="#f43f5e" opacity="0.4"/>
  </g>
</svg>