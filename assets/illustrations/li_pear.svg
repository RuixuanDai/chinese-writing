<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPear" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <radialGradient id="pearGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="shadowPear" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgPear)"/>
  <ellipse cx="250" cy="430" rx="170" ry="35" fill="#fde047" opacity="0.6"/>
  <g filter="url(#shadowPear)">
    <!-- Stem -->
    <path d="M 250 170 Q 230 110 270 90" stroke="#78350f" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Fresh Green Leaf -->
    <path d="M 255 130 C 310 90 350 110 340 150 C 300 160 270 140 255 130 Z" fill="#22c55e"/>
    <path d="M 255 130 Q 300 135 340 150" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <!-- Classic Pear Shape -->
    <path d="M 220 190 C 180 230 200 270 160 330 C 120 400 200 440 250 440 C 300 440 380 400 340 330 C 300 270 320 230 280 190 C 260 170 240 170 220 190 Z" fill="url(#pearGrad)"/>
    <!-- Highlights & Freckles -->
    <ellipse cx="210" cy="270" rx="20" ry="40" fill="#ffffff" opacity="0.3" transform="rotate(-15 210 270)"/>
    <circle cx="210" cy="350" r="3" fill="#a16207" opacity="0.6"/>
    <circle cx="240" cy="370" r="3" fill="#a16207" opacity="0.6"/>
    <circle cx="280" cy="340" r="3" fill="#a16207" opacity="0.6"/>
    <circle cx="260" cy="390" r="3" fill="#a16207" opacity="0.6"/>
    <circle cx="300" cy="380" r="3" fill="#a16207" opacity="0.6"/>
  </g>
</svg>