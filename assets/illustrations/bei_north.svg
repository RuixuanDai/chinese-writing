<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBei" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowBei" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBei)"/>
  <g filter="url(#shadowBei)">
    <!-- Polar Star at North (Top) -->
    <polygon points="250,30 255,45 270,50 255,55 250,70 245,55 230,50 245,45" fill="#facc15"/>
    <!-- Compass Housing -->
    <circle cx="250" cy="270" r="140" fill="#ffffff" stroke="#2563eb" stroke-width="10"/>
    <circle cx="250" cy="270" r="120" fill="#f8fafc"/>
    <!-- Cardinal Letters -->
    <text x="250" y="185" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ef4444" text-anchor="middle">北</text>
    <text x="250" y="375" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#64748b" text-anchor="middle">南</text>
    <text x="160" y="280" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#64748b" text-anchor="middle">西</text>
    <text x="340" y="280" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#64748b" text-anchor="middle">东</text>
    <!-- Pointer Arrow pointing North (Up) -->
    <polygon points="235,270 250,160 265,270" fill="#ef4444"/>
    <polygon points="235,270 250,350 265,270" fill="#94a3b8"/>
    <!-- Center Pivot Pin -->
    <circle cx="250" cy="270" r="16" fill="#1e293b"/>
    <circle cx="250" cy="270" r="6" fill="#ffffff"/>
  </g>
</svg>