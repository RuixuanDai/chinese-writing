<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_wu_noon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_wu_noon)"/>

  <!-- Blazing high noon sun directly at the top center -->
  <circle cx="100" cy="48" r="26" fill="#f97316" stroke="#ea580c" stroke-width="3"/>
  <circle cx="100" cy="48" r="18" fill="#facc15"/>
  <line x1="100" y1="80" x2="100" y2="96" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-dasharray="4,4"/>
  <!-- Clock pointing straight up to 12:00 (正午十二点) -->
  <circle cx="100" cy="140" r="38" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <line x1="100" y1="140" x2="100" y2="112" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="140" r="4.5" fill="#1e293b"/>

</svg>
