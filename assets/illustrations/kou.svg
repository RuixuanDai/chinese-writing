<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    
      <clipPath id="mouthClip">
        <path d="M36 86 Q100 72 164 86 Q154 152 100 152 Q46 152 36 86 Z"/>
      </clipPath>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Outer rosy lips -->
      <path d="M26 86 Q64 58 100 72 Q136 58 174 86 Q158 164 100 164 Q42 164 26 86 Z" fill="#fb7185" stroke="#e11d48" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Inner mouth cavity -->
      <g clip-path="url(#mouthClip)">
        <rect x="30" y="70" width="140" height="90" fill="#881337"/>
        <!-- Neat white upper teeth -->
        <path d="M44 76 L156 76 L152 102 Q100 108 48 102 Z" fill="#ffffff"/>
        <!-- Cute pink tongue -->
        <ellipse cx="100" cy="146" rx="44" ry="30" fill="#fda4af"/>
        <path d="M100 122 L100 144" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Inner lip rim -->
      <path d="M36 86 Q100 72 164 86 Q154 152 100 152 Q46 152 36 86 Z" fill="none" stroke="#be123c" stroke-width="3"/>
      <!-- Lip gloss highlight -->
      <path d="M68 156 Q100 162 132 156" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
    
</svg>