<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKou" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </radialGradient>
    <filter id="softShadowKou" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#f87171" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgKou)"/>

  <!-- Round Cute Smiling Face -->
  <circle cx="250" cy="250" r="160" fill="#fff" stroke="#fca5a5" stroke-width="4" filter="url(#softShadowKou)"/>

  <!-- Happy Curved Eyes -->
  <path d="M 180 205 Q 200 185 220 205" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 280 205 Q 300 185 320 205" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="170" cy="245" rx="18" ry="12" fill="#fda4af" opacity="0.6"/>
  <ellipse cx="330" cy="245" rx="18" ry="12" fill="#fda4af" opacity="0.6"/>

  <!-- Cute Big Open Mouth (口) -->
  <path d="M 200 250 Q 250 240 300 250 C 305 315 195 315 200 250 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
  <!-- Pearly White Upper Teeth -->
  <path d="M 215 250 Q 250 245 285 250 C 285 264 215 264 215 250 Z" fill="#ffffff"/>
  <!-- Pink Tongue -->
  <path d="M 220 290 Q 250 270 280 290 Q 250 312 220 290 Z" fill="#f43f5e"/>
</svg>
