<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXueStudy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowXueStudy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXueStudy)"/>
  <ellipse cx="250" cy="440" rx="180" ry="35" fill="#93c5fd" opacity="0.6"/>
  <g filter="url(#shadowXueStudy)">
    <!-- Big Open Book at base -->
    <path d="M 80 340 Q 250 370 250 300 Q 250 370 420 340 L 400 420 Q 250 390 250 420 Q 250 390 100 420 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="6"/>
    <!-- Page lines -->
    <line x1="120" y1="360" x2="220" y2="360" stroke="#93c5fd" stroke-width="3"/>
    <line x1="120" y1="380" x2="220" y2="380" stroke="#93c5fd" stroke-width="3"/>
    <line x1="280" y1="360" x2="380" y2="360" stroke="#93c5fd" stroke-width="3"/>
    <line x1="280" y1="380" x2="380" y2="380" stroke="#93c5fd" stroke-width="3"/>
    <!-- Glowing Idea Lightbulb above -->
    <!-- Glow rays -->
    <line x1="250" y1="70" x2="250" y2="40" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="120" x2="135" y2="105" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <line x1="340" y1="120" x2="365" y2="105" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="190" x2="120" y2="190" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <line x1="350" y1="190" x2="380" y2="190" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <!-- Bulb Glass -->
    <path d="M 210 200 C 180 170 180 120 210 90 C 240 60 260 60 290 90 C 320 120 320 170 290 200 L 280 230 L 220 230 Z" fill="#fef08a" stroke="#eab308" stroke-width="6"/>
    <!-- Bulb Base screw -->
    <rect x="225" y="230" width="50" height="15" rx="3" fill="#cbd5e1"/>
    <rect x="230" y="245" width="40" height="12" rx="3" fill="#94a3b8"/>
    <!-- Filament -->
    <path d="M 235 150 Q 250 120 265 150" stroke="#ea580c" stroke-width="4" fill="none"/>
  </g>
</svg>