<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJiu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowJiu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJiu)"/>
  <g filter="url(#shadowJiu)">
    <!-- 3x3 Grid of 9 Cute Smiling Strawberries/Hearts -->
    <g fill="#ef4444">
      <circle cx="150" cy="150" r="32"/>
      <circle cx="250" cy="150" r="32"/>
      <circle cx="350" cy="150" r="32"/>
      <circle cx="150" cy="250" r="32"/>
      <circle cx="250" cy="250" r="32"/>
      <circle cx="350" cy="250" r="32"/>
      <circle cx="150" cy="350" r="32"/>
      <circle cx="250" cy="350" r="32"/>
      <circle cx="350" cy="350" r="32"/>
    </g>
    <!-- Leaf caps on all 9 -->
    <g fill="#22c55e">
      <polygon points="150,122 140,110 160,110"/>
      <polygon points="250,122 240,110 260,110"/>
      <polygon points="350,122 340,110 360,110"/>
      <polygon points="150,222 140,210 160,210"/>
      <polygon points="250,222 240,210 260,210"/>
      <polygon points="350,222 340,210 360,210"/>
      <polygon points="150,322 140,310 160,310"/>
      <polygon points="250,322 240,310 260,310"/>
      <polygon points="350,322 340,310 360,310"/>
    </g>
    <!-- Numbers 1 to 9 on them -->
    <g font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="150" y="160">1</text>
      <text x="250" y="160">2</text>
      <text x="350" y="160">3</text>
      <text x="150" y="260">4</text>
      <text x="250" y="260">5</text>
      <text x="350" y="260">6</text>
      <text x="150" y="360">7</text>
      <text x="250" y="360">8</text>
      <text x="350" y="360">9</text>
    </g>
  </g>
</svg>