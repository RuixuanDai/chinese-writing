<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgQian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="shadowQian" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgQian)"/>
  <ellipse cx="250" cy="440" rx="180" ry="35" fill="#fcd34d" opacity="0.6"/>
  <g filter="url(#shadowQian)">
    <!-- Treasure Chest Base -->
    <rect x="120" y="260" width="260" height="150" rx="14" fill="#b45309"/>
    <!-- Gold bands -->
    <rect x="160" y="260" width="20" height="150" fill="#facc15"/>
    <rect x="320" y="260" width="20" height="150" fill="#facc15"/>
    <!-- Open Curved Lid -->
    <path d="M 110 260 C 110 160 390 160 390 260 Z" fill="#92400e"/>
    <path d="M 120 250 C 120 180 380 180 380 250 Z" fill="#b45309"/>
    <!-- Overflowing Golden Coins & Jewels inside -->
    <ellipse cx="250" cy="245" rx="120" ry="30" fill="#facc15"/>
    <circle cx="210" cy="235" r="14" fill="#fef08a"/>
    <circle cx="260" cy="230" r="16" fill="#fef08a"/>
    <circle cx="300" cy="235" r="14" fill="#ef4444"/>
    <!-- Golden Lock with "1000" -->
    <rect x="220" y="280" width="60" height="60" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <text x="250" y="322" font-family="'Arial Rounded MT Bold', sans-serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">千</text>
  </g>
</svg>