<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgShi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowShi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShi)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fde68a" opacity="0.6"/>
  <g filter="url(#shadowShi)">
    <!-- Silk Scroll -->
    <rect x="110" y="90" width="280" height="300" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="5"/>
    <line x1="160" y1="120" x2="160" y2="360" stroke="#fca5a5" stroke-width="2"/>
    <line x1="200" y1="120" x2="200" y2="360" stroke="#fca5a5" stroke-width="2"/>
    <line x1="240" y1="120" x2="240" y2="360" stroke="#fca5a5" stroke-width="2"/>
    <!-- Classical Plum Branch -->
    <path d="M 390 120 Q 320 180 270 240 Q 230 300 130 340" stroke="#78350f" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Red Plum Blossoms -->
    <circle cx="340" cy="160" r="14" fill="#ef4444"/>
    <circle cx="340" cy="160" r="5" fill="#facc15"/>
    <circle cx="280" cy="225" r="15" fill="#ef4444"/>
    <circle cx="280" cy="225" r="5" fill="#facc15"/>
    <circle cx="220" cy="285" r="13" fill="#ef4444"/>
    <circle cx="220" cy="285" r="4" fill="#facc15"/>
    <circle cx="360" cy="200" r="10" fill="#f87171"/>
  </g>
</svg>