<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_shi_poem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_shi_poem)"/>

  <!-- Scroll rods top & bottom -->
  <rect x="34" y="28" width="132" height="10" rx="5" fill="#92400e"/>
  <rect x="34" y="162" width="132" height="10" rx="5" fill="#92400e"/>
  <path d="M70 28 L100 14 L130 28" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <!-- Scroll paper -->
  <rect x="44" y="38" width="112" height="124" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <!-- Subtle ink wash mountain & sun in lower left corner -->
  <circle cx="68" cy="112" r="8" fill="#fca5a5" opacity="0.7"/>
  <polygon points="46,158 68,124 92,158" fill="#94a3b8" opacity="0.45"/>
  <polygon points="72,158 92,132 112,158" fill="#64748b" opacity="0.45"/>
  <!-- Vertical poem columns (4 columns of rhythmic brush strokes on right) -->
  <g stroke="#1e293b" stroke-width="3.5" stroke-linecap="round">
    <line x1="138" y1="52" x2="138" y2="118" stroke-dasharray="6,6"/>
    <line x1="122" y1="52" x2="122" y2="118" stroke-dasharray="6,6"/>
    <line x1="106" y1="52" x2="106" y2="118" stroke-dasharray="6,6"/>
    <line x1="90" y1="52" x2="90" y2="96" stroke-dasharray="6,6"/>
  </g>
  <!-- Red seal stamp (印章) -->
  <rect x="128" y="132" width="16" height="16" rx="2" fill="#dc2626"/>

</svg>
