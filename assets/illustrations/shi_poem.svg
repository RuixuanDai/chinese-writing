<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Hanging cord -->
      <path d="M72 28 L100 14 L128 28" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
      <!-- Top & bottom wooden scroll rollers -->
      <rect x="34" y="28" width="132" height="10" rx="5" fill="#92400e"/>
      <rect x="44" y="34" width="112" height="124" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <rect x="30" y="156" width="140" height="12" rx="6" fill="#92400e"/>
      <circle cx="30" cy="162" r="5" fill="#f59e0b"/><circle cx="170" cy="162" r="5" fill="#f59e0b"/>
      <!-- Golden moon & ink-wash mountains inside scroll -->
      <circle cx="74" cy="64" r="13" fill="#fde047"/>
      <polygon points="46,146 78,102 108,146" fill="#94a3b8" opacity="0.65"/>
      <polygon points="82,146 118,92 154,146" fill="#64748b" opacity="0.75"/>
      <!-- Vertical poetic brush-line columns (decorative, zero text!) & red seal -->
      <line x1="138" y1="52" x2="138" y2="96" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
      <line x1="124" y1="56" x2="124" y2="90" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
      <rect x="120" y="102" width="10" height="10" rx="2" fill="#dc2626"/>
      <!-- Red plum blossom twig -->
      <path d="M46 86 Q66 92 80 82" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="64" cy="88" r="4.5" fill="#f43f5e"/><circle cx="78" cy="82" r="4" fill="#fb7185"/>
    
</svg>