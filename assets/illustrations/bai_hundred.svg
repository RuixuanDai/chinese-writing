<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowBai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBai)"/>
  <g filter="url(#shadowBai)">
    <!-- Red Champion Ribbon behind -->
    <polygon points="200,280 160,440 210,400 240,440" fill="#dc2626"/>
    <polygon points="300,280 260,440 290,400 340,440" fill="#b91c1c"/>
    <!-- Golden Medal Disc -->
    <circle cx="250" cy="230" r="140" fill="#facc15" stroke="#ca8a04" stroke-width="12"/>
    <circle cx="250" cy="230" r="115" fill="#fef08a"/>
    <!-- Embossed "100" -->
    <text x="250" y="265" font-family="'Arial Rounded MT Bold', sans-serif" font-size="95" font-weight="900" fill="#d97706" text-anchor="middle">100</text>
    <text x="250" y="260" font-family="'Arial Rounded MT Bold', sans-serif" font-size="95" font-weight="900" fill="#ca8a04" text-anchor="middle">100</text>
    <!-- Laurel Wreath Leaves on rim -->
    <ellipse cx="170" cy="180" rx="10" ry="20" fill="#ca8a04" transform="rotate(-30 170 180)"/>
    <ellipse cx="330" cy="180" rx="10" ry="20" fill="#ca8a04" transform="rotate(30 330 180)"/>
  </g>
</svg>