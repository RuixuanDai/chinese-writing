<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
    <filter id="shadowBa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBa)"/>
  <g filter="url(#shadowBa)">
    <!-- Blue Collar Shirt & Shoulders -->
    <path d="M 120 440 C 120 340 380 340 380 440 Z" fill="#2563eb"/>
    <polygon points="210,350 250,380 290,350 270,330 230,330" fill="#ffffff"/>
    <polygon points="240,360 260,360 255,420 245,420" fill="#dc2626"/>
    <!-- Head & Neck -->
    <rect x="225" y="280" width="50" height="60" fill="#fed7aa"/>
    <circle cx="250" cy="220" r="95" fill="#fed7aa"/>
    <!-- Dad's Hair -->
    <path d="M 155 210 C 150 110 350 110 345 210 C 320 160 180 160 155 210 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="180" y="195" width="50" height="40" rx="8" fill="none" stroke="#0f172a" stroke-width="5"/>
    <rect x="270" y="195" width="50" height="40" rx="8" fill="none" stroke="#0f172a" stroke-width="5"/>
    <line x1="230" y1="215" x2="270" y2="215" stroke="#0f172a" stroke-width="5"/>
    <!-- Warm Smiling Eyes behind glasses -->
    <path d="M 195 215 Q 205 205 215 215" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 285 215 Q 295 205 305 215" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Nose & Warm Smile -->
    <path d="M 250 225 L 245 245 L 255 245" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 225 265 Q 250 288 275 265" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>