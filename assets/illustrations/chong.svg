<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgChong" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
    <filter id="shadowChong" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#15803d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgChong)"/>
  <!-- Cute Seven-Spotted Ladybug on Leaf (小虫) -->
  <g filter="url(#shadowChong)">
    <!-- Big Leaf -->
    <path d="M 80 420 C 100 220 220 100 420 80 C 400 280 280 400 80 420 Z" fill="#4ade80" stroke="#16a34a" stroke-width="4"/>
    <path d="M 80 420 Q 250 250 420 80" stroke="#15803d" stroke-width="3" fill="none"/>
    <!-- Ladybug Body -->
    <circle cx="260" cy="240" r="85" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <!-- Black Head -->
    <path d="M 315 200 A 45 45 0 0 1 315 280 Z" fill="#0f172a"/>
    <!-- Antennae -->
    <path d="M 330 220 Q 365 205 375 190" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="375" cy="190" r="5" fill="#0f172a"/>
    <path d="M 330 260 Q 365 275 375 290" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="375" cy="290" r="5" fill="#0f172a"/>
    <!-- Center Dividing Line -->
    <line x1="175" y1="240" x2="315" y2="240" stroke="#0f172a" stroke-width="4"/>
    <!-- Black Spots -->
    <circle cx="220" cy="195" r="14" fill="#0f172a"/>
    <circle cx="265" cy="180" r="14" fill="#0f172a"/>
    <circle cx="220" cy="285" r="14" fill="#0f172a"/>
    <circle cx="265" cy="300" r="14" fill="#0f172a"/>
    <circle cx="200" cy="240" r="12" fill="#0f172a"/>
  </g>
</svg>