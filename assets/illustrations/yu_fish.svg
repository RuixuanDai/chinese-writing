<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgFish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </radialGradient>
    <filter id="shadowFish" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0891b2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgFish)"/>
  <!-- Cheerful Goldfish (小金鱼) -->
  <g filter="url(#shadowFish)">
    <!-- Water Bubbles -->
    <circle cx="380" cy="160" r="14" fill="#ffffff" opacity="0.6"/>
    <circle cx="415" cy="115" r="9" fill="#ffffff" opacity="0.6"/>
    <circle cx="360" cy="95" r="6" fill="#ffffff" opacity="0.6"/>
    <!-- Fish Tail Fin -->
    <path d="M 170 260 C 100 180 80 230 110 260 C 80 290 100 340 170 260 Z" fill="#fb923c"/>
    <path d="M 160 260 C 110 210 95 240 125 260 C 95 280 110 310 160 260 Z" fill="#ea580c"/>
    <!-- Fish Body -->
    <ellipse cx="260" cy="260" rx="100" ry="75" fill="#f97316"/>
    <!-- Belly Highlight -->
    <ellipse cx="270" cy="285" rx="70" ry="40" fill="#fdba74" opacity="0.6"/>
    <!-- Dorsal Fin -->
    <path d="M 230 188 Q 270 150 300 190 Z" fill="#ea580c"/>
    <!-- Pectoral Fin -->
    <ellipse cx="270" cy="275" rx="28" ry="16" fill="#ea580c" transform="rotate(25, 270, 275)"/>
    <!-- Big Cute Eye -->
    <circle cx="320" cy="235" r="14" fill="#ffffff"/>
    <circle cx="324" cy="235" r="8" fill="#0f172a"/>
    <circle cx="322" cy="232" r="3" fill="#ffffff"/>
    <!-- Sweet Fish Mouth -->
    <path d="M 358 260 Q 365 265 358 270" stroke="#c2410c" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>