<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_mo_ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_mo_ink)"/>

  <!-- Inkstone (砚台) with pool of glossy black ink -->
  <ellipse cx="100" cy="134" rx="64" ry="34" fill="#334155" stroke="#0f172a" stroke-width="4"/>
  <ellipse cx="100" cy="130" rx="48" ry="22" fill="#0f172a"/>
  <ellipse cx="86" cy="124" rx="14" ry="5" fill="#475569"/>
  <!-- Rectangular inkstick (墨条) grinding upright -->
  <g transform="translate(116, 86) rotate(20)">
    <rect x="-12" y="-44" width="24" height="72" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="-6" y="-32" width="12" height="36" rx="2" fill="#facc15" opacity="0.8"/>
  </g>
  <!-- Black ink droplets -->
  <circle cx="52" cy="84" r="6" fill="#0f172a"/><circle cx="66" cy="68" r="4" fill="#0f172a"/>

</svg>
