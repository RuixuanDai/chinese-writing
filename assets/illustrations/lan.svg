<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </radialGradient>
    <filter id="shadowLan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgLan)"/>
  <!-- Deep Blue Ocean Waves & Bluebird (蓝色) -->
  <g filter="url(#shadowLan)">
    <!-- Swirling Blue Wave -->
    <path d="M 80 340 C 180 200 320 200 420 340 C 350 370 200 370 80 340 Z" fill="#0284c7"/>
    <path d="M 120 345 C 200 230 300 230 380 345" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Blue Dolphin -->
    <path d="M 180 240 C 230 160 310 180 340 240 C 300 210 250 210 180 240 Z" fill="#0369a1"/>
    <polygon points="340,240 370,225 358,255" fill="#0369a1"/>
    <!-- Droplets -->
    <circle cx="210" cy="180" r="8" fill="#38bdf8"/>
    <circle cx="280" cy="150" r="10" fill="#0284c7"/>
    <circle cx="340" cy="170" r="7" fill="#38bdf8"/>
  </g>
</svg>