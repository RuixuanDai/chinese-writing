<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <filter id="shadowJing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJing)"/>
  <!-- Ocean Waves -->
  <path d="M 40 400 Q 140 375 250 400 T 460 400 L 460 470 L 40 470 Z" fill="#0284c7" opacity="0.6"/>
  <path d="M 60 430 Q 160 410 260 430 T 480 430 L 480 480 L 60 480 Z" fill="#0369a1" opacity="0.8"/>
  <g filter="url(#shadowJing)">
    <!-- Water Fountain Spout -->
    <path d="M 210 210 Q 190 120 150 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="110" r="8" fill="#38bdf8"/>
    <path d="M 215 210 Q 220 100 220 80" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="220" cy="75" r="9" fill="#38bdf8"/>
    <path d="M 220 210 Q 240 120 280 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="285" cy="110" r="8" fill="#38bdf8"/>
    <!-- Tail Fluke -->
    <polygon points="380,310 440,240 415,310" fill="#0284c7"/>
    <polygon points="380,310 445,370 415,310" fill="#0284c7"/>
    <!-- Whale Body -->
    <path d="M 120 300 C 120 210 280 210 390 310 C 350 380 200 400 120 300 Z" fill="#0284c7"/>
    <!-- Cream White Belly -->
    <path d="M 120 300 C 130 370 240 390 320 350 C 230 330 160 320 120 300 Z" fill="#f8fafc"/>
    <!-- Belly Ridges -->
    <path d="M 160 340 Q 210 365 260 355" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M 180 355 Q 220 375 270 365" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <!-- Flipper Fin -->
    <ellipse cx="230" cy="330" rx="35" ry="18" fill="#0369a1" transform="rotate(25 230 330)"/>
    <!-- Smiling Mouth -->
    <path d="M 135 305 Q 165 325 195 305" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Friendly Eye & Sparkle -->
    <circle cx="160" cy="275" r="9" fill="#0f172a"/>
    <circle cx="157" cy="272" r="3" fill="#ffffff"/>
    <!-- Rosy Cheek -->
    <circle cx="185" cy="290" r="10" fill="#f43f5e" opacity="0.4"/>
  </g>
</svg>