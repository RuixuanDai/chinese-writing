<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Soft face context -->
      <circle cx="100" cy="104" r="66" fill="#fed7aa"/>
      <!-- Soft eyes & gentle smile -->
      <circle cx="74" cy="82" r="5" fill="#475569" opacity="0.55"/>
      <circle cx="126" cy="82" r="5" fill="#475569" opacity="0.55"/>
      <path d="M86 142 Q100 150 114 142" fill="none" stroke="#c2410c" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
      <!-- Highlight ring focusing on the nose -->
      <circle cx="100" cy="108" r="26" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 5"/>
      <!-- Clear cute 3D nose in center -->
      <path d="M97 86 L92 110 C86 114 88 122 95 121 Q100 124 105 121 C112 122 114 114 108 110 L103 86" fill="#fdba74" stroke="#c2410c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="95" cy="117" r="2.3" fill="#9a3412"/>
      <circle cx="105" cy="117" r="2.3" fill="#9a3412"/>
      <!-- Small red pointer arrow pointing right at nose -->
      <polygon points="134,108 152,99 152,117" fill="#ef4444"/>
      <line x1="148" y1="108" x2="170" y2="108" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    
</svg>