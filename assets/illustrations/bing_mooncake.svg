<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBingMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="shadowBingMoon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgBingMoon)"/>
  <ellipse cx="250" cy="430" rx="180" ry="35" fill="#fcd34d" opacity="0.6"/>
  <g filter="url(#shadowBingMoon)">
    <!-- Golden Baked Mooncake (月饼) -->
    <!-- Scalloped Edges Pattern -->
    <circle cx="250" cy="260" r="140" fill="#b45309"/>
    <circle cx="250" cy="260" r="130" fill="#d97706"/>
    <!-- Inner Pattern Ring -->
    <circle cx="250" cy="260" r="105" fill="#f59e0b"/>
    <!-- Traditional Floral Stamp in center -->
    <circle cx="250" cy="260" r="70" fill="#d97706"/>
    <text x="250" y="285" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="70" font-weight="bold" fill="#fef3c7" text-anchor="middle">月</text>
  </g>
</svg>