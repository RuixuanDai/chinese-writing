<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgJianFr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </radialGradient>
    <filter id="shadowJianFr" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#be123c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgJianFr)"/>
  <ellipse cx="250" cy="430" rx="170" ry="25" fill="#fecdd3" opacity="0.6"/>
  <!-- Cute Pink Piggy Bank -->
  <g filter="url(#shadowJianFr)">
    <!-- Little Legs -->
    <rect x="180" y="340" width="30" height="40" rx="12" fill="#f43f5e"/>
    <rect x="290" y="340" width="30" height="40" rx="12" fill="#f43f5e"/>
    <!-- Piggy Body -->
    <ellipse cx="250" cy="280" rx="120" ry="90" fill="#fb7185"/>
    <!-- Piggy Snout -->
    <ellipse cx="140" cy="285" rx="32" ry="24" fill="#f43f5e"/>
    <circle cx="132" cy="285" r="6" fill="#be123c"/>
    <circle cx="148" cy="285" r="6" fill="#be123c"/>
    <!-- Happy Eyes -->
    <path d="M 180 250 Q 190 240 200 250" stroke="#881337" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Piggy Ears -->
    <polygon points="210,200 180,150 240,170" fill="#f43f5e"/>
    <!-- Curly Tail -->
    <path d="M 370 280 Q 405 270 395 295 Q 380 310 405 320" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Coin Slot on Top -->
    <rect x="230" y="185" width="40" height="8" rx="4" fill="#881337"/>
    <!-- Golden Coin Dropping in -->
    <circle cx="250" cy="140" r="32" fill="#facc15" stroke="#ca8a04" stroke-width="5"/>
    <rect x="240" y="130" width="20" height="20" fill="none" stroke="#ca8a04" stroke-width="4"/>
  </g>
</svg>