<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgXiStudy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowXiStudy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgXiStudy)"/>
  <g filter="url(#shadowXiStudy)">
    <!-- Traditional Tianzige (田字格) Manuscript Paper -->
    <rect x="100" y="90" width="300" height="300" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="8"/>
    <!-- Grid Cross -->
    <line x1="100" y1="240" x2="400" y2="240" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="250" y1="90" x2="250" y2="390" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"/>
    <!-- Neatly Written Character "永" or "习" -->
    <text x="250" y="295" font-family="'KaiTi', 'STKaiti', sans-serif" font-size="190" font-weight="bold" fill="#1e293b" text-anchor="middle">习</text>
    <!-- Calligraphy Brush resting -->
    <polygon points="340,360 440,240 455,255 355,375" fill="#78350f"/>
    <!-- Brush Tip (Ink) -->
    <path d="M 340 360 Q 320 400 310 420 Q 330 400 355 375 Z" fill="#0f172a"/>
  </g>
</svg>