<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Glowing golden dragon pearl on left -->
      <circle cx="38" cy="84" r="15" fill="#facc15" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="33" cy="79" r="4.5" fill="#ffffff" opacity="0.8"/>
      <!-- Golden dorsal crest spikes behind dragon body -->
      <path d="M74 78 C110 56 128 124 162 100 C180 86 174 52 152 48" fill="none" stroke="#f59e0b" stroke-width="26" stroke-linecap="round" stroke-dasharray="4 11"/>
      <!-- Sinuous emerald dragon body & golden belly stripe -->
      <path d="M74 84 C110 62 128 130 162 106 C180 92 174 56 152 52" fill="none" stroke="#10b981" stroke-width="22" stroke-linecap="round"/>
      <path d="M76 89 C110 68 128 134 160 111" fill="none" stroke="#fde047" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Little dragon legs/claws -->
      <path d="M98 96 L92 118 M86 118 L98 118 M144 116 L142 136 M135 136 L149 136" stroke="#059669" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Festive red dragon tail tuft -->
      <path d="M152 52 Q136 42 144 32 Q158 36 160 48 Z" fill="#ef4444"/>
      <!-- Dragon head with golden antlers, red mane, snout, whiskers -->
      <g transform="translate(70, 80) scale(1.12)">
        <!-- Antlers -->
        <path d="M-2 -20 L4 -38 M4 -30 L12 -34 M8 -18 L18 -34" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
        <!-- Flowing red mane -->
        <path d="M6 -18 Q24 -24 22 -6 Q28 2 14 8 Z" fill="#ef4444"/>
        <!-- Head & snout -->
        <ellipse cx="-2" cy="-4" rx="18" ry="15" fill="#10b981"/>
        <rect x="-26" y="-8" width="22" height="14" rx="7" fill="#10b981"/>
        <path d="M-22 6 Q-8 14 6 6" fill="#fde047"/>
        <!-- Whiskers -->
        <path d="M-22 -4 Q-32 -16 -36 -8" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Nostril & bright eye -->
        <circle cx="-20" cy="-3" r="2.2" fill="#064e3b"/>
        <circle cx="-4" cy="-7" r="4.5" fill="#ffffff"/><circle cx="-5" cy="-7" r="2.5" fill="#1e293b"/>
      </g>
      <!-- Soft auspicious cloud at bottom -->
      <g fill="#ffffff" opacity="0.9">
        <circle cx="84" cy="160" r="13"/><circle cx="104" cy="155" r="17"/><circle cx="124" cy="161" r="12"/>
      </g>
    
</svg>