<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Mound of pearly white uncooked rice grains -->
      <path d="M44 116 C52 72 148 72 156 116 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <!-- Individual plump rice grain ovals -->
      <ellipse cx="76" cy="94" rx="6.5" ry="3.4" transform="rotate(-20 76 94)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><ellipse cx="96" cy="86" rx="6.5" ry="3.4" transform="rotate(12 96 86)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><ellipse cx="116" cy="92" rx="6.5" ry="3.4" transform="rotate(-15 116 92)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><ellipse cx="86" cy="104" rx="6.5" ry="3.4" transform="rotate(25 86 104)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><ellipse cx="108" cy="104" rx="6.5" ry="3.4" transform="rotate(-8 108 104)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><ellipse cx="130" cy="104" rx="6.5" ry="3.4" transform="rotate(18 130 104)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><ellipse cx="66" cy="106" rx="6.5" ry="3.4" transform="rotate(-12 66 106)" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
      <!-- Traditional wooden rice measure bowl -->
      <path d="M40 114 L160 114 L146 164 Q100 172 54 164 Z" fill="#b45309" stroke="#78350f" stroke-width="3"/>
      <rect x="44" y="128" width="112" height="8" fill="#78350f" opacity="0.55"/>
      <!-- Scattered white rice grains in front -->
      <ellipse cx="74" cy="174" rx="6" ry="3" transform="rotate(14 74 174)" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <ellipse cx="92" cy="177" rx="6" ry="3" transform="rotate(-18 92 177)" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <!-- Golden rice stalk (稻穗) leaning beside -->
      <path d="M148 92 Q162 56 142 36" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="154" cy="68" rx="6" ry="3.5" transform="rotate(-30 154 68)" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/><ellipse cx="150" cy="54" rx="6" ry="3.5" transform="rotate(-30 150 54)" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/><ellipse cx="144" cy="42" rx="6" ry="3.5" transform="rotate(-30 144 42)" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/>
    
</svg>