<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_zheng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_zheng)"/>

  <!-- Upright perfectly aligned picture frame on wall -->
  <rect x="52" y="42" width="96" height="96" rx="8" fill="#ffffff" stroke="#059669" stroke-width="6"/>
  <rect x="66" y="56" width="68" height="68" rx="4" fill="#a7f3d0"/>
  <!-- Hanging cord centered at top nail -->
  <line x1="100" y1="20" x2="72" y2="42" stroke="#047857" stroke-width="3"/>
  <line x1="100" y1="20" x2="128" y2="42" stroke="#047857" stroke-width="3"/>
  <circle cx="100" cy="20" r="5" fill="#ef4444"/>
  <!-- Vertical & horizontal alignment crosshairs showing 90-degree uprightness -->
  <line x1="100" y1="28" x2="100" y2="148" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="40" y1="90" x2="160" y2="90" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Right-angle square symbol -->
  <polyline points="100,78 112,78 112,90" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Level ruler at bottom -->
  <rect x="44" y="156" width="112" height="22" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
  <line x1="60" y1="156" x2="60" y2="165" stroke="#854d0e" stroke-width="2"/>
  <line x1="80" y1="156" x2="80" y2="168" stroke="#854d0e" stroke-width="2"/>
  <line x1="100" y1="156" x2="100" y2="170" stroke="#ef4444" stroke-width="3"/>
  <line x1="120" y1="156" x2="120" y2="168" stroke="#854d0e" stroke-width="2"/>
  <line x1="140" y1="156" x2="140" y2="165" stroke="#854d0e" stroke-width="2"/>

</svg>
