<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShao" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadowShao" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgShao)"/>
  <!-- Empty plate/basket with just ONE small apple (少) -->
  <g filter="url(#shadowShao)">
    <!-- Plate -->
    <ellipse cx="250" cy="360" rx="165" ry="42" fill="#ffffff" stroke="#94a3b8" stroke-width="5"/>
    <ellipse cx="250" cy="356" rx="125" ry="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Just ONE small red fruit in the middle -->
    <circle cx="250" cy="318" r="34" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <path d="M 250 284 Q 255 268 265 264" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="268" cy="272" rx="14" ry="7" transform="rotate(-20 268 272)" fill="#22c55e"/>
  </g>
</svg>
