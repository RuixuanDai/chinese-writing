<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_jing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_jing)"/>

  <!-- Neck connecting head and body properly -->
  <rect x="92" y="92" width="16" height="18" fill="#fed7aa"/>
  <!-- Head & hair -->
  <circle cx="100" cy="72" r="24" fill="#fed7aa"/>
  <path d="M76 66 Q100 38 124 66" fill="#1e293b"/>
  <circle cx="91" cy="72" r="2.8" fill="#1e293b"/><circle cx="109" cy="72" r="2.8" fill="#1e293b"/>
  <path d="M93 82 Q100 87 107 82" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm straight down at side -->
  <line x1="126" y1="114" x2="134" y2="154" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="135" cy="158" r="6.5" fill="#fed7aa"/>
  <!-- White shirt torso -->
  <path d="M70 174 L74 106 L126 106 L130 174 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <!-- Red scarf (红领巾) -->
  <polygon points="82,106 118,106 100,128" fill="#ef4444"/>
  <polygon points="96,124 88,150 100,146" fill="#dc2626"/>
  <polygon points="104,124 112,150 100,146" fill="#ef4444"/>
  <!-- Right arm raised in a crisp salute above right temple -->
  <polyline points="74,114 48,88 74,54" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="74,114 48,88 74,54" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="78" cy="50" rx="9" ry="5" transform="rotate(-30 78 50)" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>

</svg>
