<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgNai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadowNai" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#db2777" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgNai)"/>
  <g filter="url(#shadowNai)">
    <!-- Cozy Cardigan -->
    <path d="M 130 440 C 130 330 370 330 370 440 Z" fill="#db2777"/>
    <!-- Head -->
    <circle cx="250" cy="230" r="85" fill="#fed7aa"/>
    <!-- Silver Bun on top of head -->
    <circle cx="250" cy="110" r="38" fill="#e2e8f0"/>
    <path d="M 165 210 C 160 120 340 120 335 210 Z" fill="#cbd5e1"/>
    <!-- Round Spectacles -->
    <circle cx="215" cy="215" r="22" fill="none" stroke="#d97706" stroke-width="4"/>
    <circle cx="285" cy="215" r="22" fill="none" stroke="#d97706" stroke-width="4"/>
    <line x1="237" y1="215" x2="263" y2="215" stroke="#d97706" stroke-width="4"/>
    <!-- Sweet gentle smile -->
    <path d="M 225 265 Q 250 288 275 265" stroke="#be185d" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="185" cy="255" r="12" fill="#f43f5e" opacity="0.35"/>
    <circle cx="315" cy="255" r="12" fill="#f43f5e" opacity="0.35"/>
  </g>
</svg>