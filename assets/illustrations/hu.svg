<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHuLake" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </radialGradient>
    <filter id="shadowHuLake" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHuLake)"/>
  <!-- Mountain reflections in back -->
  <polygon points="60,240 180,140 300,240" fill="#93c5fd" opacity="0.6"/>
  <polygon points="220,240 340,120 460,240" fill="#60a5fa" opacity="0.5"/>
  <g filter="url(#shadowHuLake)">
    <!-- Calm Round Mirror-like Lake -->
    <ellipse cx="250" cy="340" rx="190" ry="95" fill="#0284c7"/>
    <ellipse cx="250" cy="340" rx="170" ry="80" fill="#38bdf8"/>
    <!-- Gentle Water Highlights -->
    <ellipse cx="230" cy="320" rx="70" ry="12" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="280" cy="360" rx="60" ry="10" fill="#ffffff" opacity="0.5"/>
    <!-- Water Lily on lake surface -->
    <ellipse cx="170" cy="360" rx="25" ry="12" fill="#15803d"/>
    <polygon points="170,355 160,345 170,340 180,345" fill="#f472b6"/>
  </g>
</svg>