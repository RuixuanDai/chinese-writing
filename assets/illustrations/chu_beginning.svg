<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <filter id="shadowChu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#c2410c" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgChu)"/>
  <!-- Sun Rising from Horizon -->
  <g filter="url(#shadowChu)">
    <!-- Sun -->
    <circle cx="250" cy="260" r="90" fill="#f97316"/>
    <!-- Sun Rays -->
    <path d="M 250 120 L 250 150" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 150 160 L 175 185" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 350 160 L 325 185" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 110 260 L 140 260" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 390 260 L 360 260" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <!-- Hills in front of rising sun -->
    <circle cx="130" cy="380" r="160" fill="#65a30d"/>
    <circle cx="370" cy="390" r="170" fill="#4d7c0f"/>
    <!-- First Green Sprout (Initial life) -->
    <path d="M 250 360 Q 240 310 215 300 Q 235 330 250 360 Z" fill="#84cc16"/>
    <path d="M 250 360 Q 260 300 285 295 Q 265 325 250 360 Z" fill="#a3e635"/>
  </g>
</svg>