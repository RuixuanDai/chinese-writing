<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <filter id="shadowHe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#ca8a04" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgHe)"/>
  <!-- Golden Rice Grain Stalk (禾苗) -->
  <g filter="url(#shadowHe)">
    <!-- Stem -->
    <path d="M 250 420 Q 240 280 260 160" stroke="#65a30d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Rice Grains / Head -->
    <ellipse cx="260" cy="150" rx="14" ry="24" fill="#eab308" transform="rotate(25, 260, 150)"/>
    <ellipse cx="280" cy="180" rx="14" ry="24" fill="#facc15" transform="rotate(40, 280, 180)"/>
    <ellipse cx="235" cy="180" rx="14" ry="24" fill="#eab308" transform="rotate(-30, 235, 180)"/>
    <ellipse cx="285" cy="225" rx="14" ry="24" fill="#facc15" transform="rotate(45, 285, 225)"/>
    <ellipse cx="230" cy="225" rx="14" ry="24" fill="#eab308" transform="rotate(-35, 230, 225)"/>
    <!-- Slender Graceful Leaves -->
    <path d="M 245 320 C 150 310 120 240 100 220 C 130 250 200 320 245 320 Z" fill="#84cc16"/>
    <path d="M 250 300 C 340 290 380 220 400 200 C 370 230 300 300 250 300 Z" fill="#65a30d"/>
  </g>
</svg>