<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_mo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_mo)"/>

  <!-- Tree trunk base on bottom-left extending to fine branch tip on top-right (本 -> 末) -->
  <path d="M24 168 Q68 128 148 64" fill="none" stroke="#92400e" stroke-width="14" stroke-linecap="round"/>
  <path d="M84 120 Q116 92 156 60" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <!-- Leaves at the very tip (末梢) -->
  <ellipse cx="160" cy="54" rx="14" ry="8" transform="rotate(-30 160 54)" fill="#22c55e"/>
  <ellipse cx="148" cy="46" rx="12" ry="7" transform="rotate(-70 148 46)" fill="#4ade80"/>
  <!-- Glowing dashed circle & arrow highlighting the very tip (末) -->
  <circle cx="154" cy="54" r="26" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6,4"/>
  <path d="M154 114 L154 88" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <polygon points="154,82 144,94 164,94" fill="#ef4444"/>

</svg>
