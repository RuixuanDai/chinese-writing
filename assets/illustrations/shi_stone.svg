<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgStone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadowStone" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#475569" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="30" fill="url(#bgStone)"/>
  <!-- Smooth River Stones Stack (石头) -->
  <g filter="url(#shadowStone)">
    <!-- Base Large Stone -->
    <ellipse cx="250" cy="360" rx="140" ry="60" fill="#64748b"/>
    <ellipse cx="230" cy="350" rx="110" ry="40" fill="#94a3b8" opacity="0.5"/>
    <!-- Middle Stone -->
    <ellipse cx="245" cy="275" rx="105" ry="48" fill="#0d9488"/>
    <ellipse cx="230" cy="268" rx="80" ry="32" fill="#2dd4bf" opacity="0.6"/>
    <!-- Top Small Stone -->
    <ellipse cx="255" cy="200" rx="75" ry="36" fill="#f59e0b"/>
    <ellipse cx="245" cy="195" rx="55" ry="24" fill="#fde68a" opacity="0.7"/>
    <!-- Tiny green sprout beside stones -->
    <path d="M 370 380 Q 380 340 400 330 Q 405 350 375 380 Z" fill="#22c55e"/>
    <path d="M 370 380 Q 355 355 350 340 Q 365 345 370 380 Z" fill="#16a34a"/>
  </g>
</svg>