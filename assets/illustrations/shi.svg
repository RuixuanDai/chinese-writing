<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#d97706" flood-opacity="0.25"/>
    </filter>
    <g id="star">
      <!-- 5-pointed cute chubby star -->
      <path d="M 0 -38 Q 6 -12 28 -10 Q 9 6 16 32 Q 0 16 -16 32 Q -9 6 -28 -10 Q -6 -12 0 -38 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" filter="url(#softShadow)"/>
      <!-- cute eyes -->
      <circle cx="-8" cy="-3" r="3.5" fill="#78350f"/>
      <circle cx="8" cy="-3" r="3.5" fill="#78350f"/>
      <circle cx="-6.5" cy="-5" r="1.3" fill="#ffffff"/>
      <circle cx="9.5" cy="-5" r="1.3" fill="#ffffff"/>
      <!-- rosy cheeks -->
      <circle cx="-14" cy="5" r="3.5" fill="#f87171" opacity="0.6"/>
      <circle cx="14" cy="5" r="3.5" fill="#f87171" opacity="0.6"/>
      <!-- sweet smile -->
      <path d="M -6 7 Q 0 14 6 7" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgGlow)"/>

  <!-- Ten Stars: Row 1 (5 stars) -->
  <use href="#star" x="65" y="160"/>
  <use href="#star" x="157" y="160"/>
  <use href="#star" x="250" y="160"/>
  <use href="#star" x="342" y="160"/>
  <use href="#star" x="435" y="160"/>

  <!-- Ten Stars: Row 2 (5 stars) -->
  <use href="#star" x="65" y="340"/>
  <use href="#star" x="157" y="340"/>
  <use href="#star" x="250" y="340"/>
  <use href="#star" x="342" y="340"/>
  <use href="#star" x="435" y="340"/>
</svg>
