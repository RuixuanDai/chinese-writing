<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  
      <!-- Stall posts -->
      <rect x="38" y="64" width="8" height="96" fill="#92400e"/>
      <rect x="154" y="64" width="8" height="96" fill="#92400e"/>
      <!-- Red & white striped market awning -->
      <polygon points="26,72 40,40 160,40 174,72" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <polygon points="26,72 40,40 64,40 55,72" fill="#ef4444"/><polygon points="85,72 88,40 112,40 114,72" fill="#ef4444"/><polygon points="144,72 136,40 160,40 173,72" fill="#ef4444"/>
      <!-- Hanging little lantern -->
      <line x1="100" y1="72" x2="100" y2="82" stroke="#b45309" stroke-width="2"/>
      <circle cx="100" cy="88" r="7" fill="#facc15" stroke="#ea580c" stroke-width="2"/>
      <!-- Display baskets of colorful produce -->
      <circle cx="62" cy="114" r="9" fill="#ef4444"/><circle cx="76" cy="114" r="9" fill="#ef4444"/>
      <circle cx="96" cy="114" r="9" fill="#facc15"/><circle cx="110" cy="114" r="9" fill="#fb923c"/>
      <circle cx="130" cy="114" r="9" fill="#22c55e"/><circle cx="144" cy="114" r="9" fill="#22c55e"/>
      <!-- Wooden market counter -->
      <rect x="32" y="118" width="136" height="46" rx="6" fill="#d97706" stroke="#78350f" stroke-width="3"/>
      <line x1="34" y1="138" x2="166" y2="138" stroke="#92400e" stroke-width="3"/>
    
</svg>