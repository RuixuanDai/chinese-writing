<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_di_low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg_di_low)"/>

  <line x1="20" y1="168" x2="180" y2="168" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Tall tree on left (faded reference for 高) -->
  <g opacity="0.45">
    <rect x="48" y="100" width="14" height="68" fill="#92400e"/>
    <circle cx="55" cy="72" r="34" fill="#22c55e"/>
  </g>
  <!-- Low small bush & mushroom on right (highlighted for 低) -->
  <ellipse cx="136" cy="152" rx="28" ry="16" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="124" cy="148" r="4" fill="#ef4444"/><circle cx="146" cy="150" r="4" fill="#ef4444"/>
  <!-- Bold downward red arrow pointing to the LOW position -->
  <line x1="106" y1="132" x2="166" y2="132" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,4"/>
  <path d="M136 74 L136 118" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <polygon points="136,126 124,110 148,110" fill="#ef4444"/>

</svg>
